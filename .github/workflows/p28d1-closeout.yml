name: P28-D1 verified closeout

on:
  push:
    branches: [chatgpt/p28-d1-vanguard-lod0]
    paths: ['.github/workflows/p28d1-closeout.yml']

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d1-vanguard-lod0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Move verified D1 to archive and sync metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/content-roadmap.md')
          text = roadmap.read_text()
          task = "- [ ] **P28-D1 — Ship Vanguard operator LOD0** — Add a hero-quality Vanguard LOD0 model/material set using the proven operator rig/socket contract while preserving current animation and gameplay bounds. **Done when:** Flagship selects Vanguard LOD0, all required animation/socket states remain valid, the model is clearly more detailed at gameplay zoom, and standard build/APK gates pass.\n\n"
          if text.count(task) != 1:
              raise SystemExit(f'roadmap D1 match count={text.count(task)}')
          roadmap.write_text(text.replace(task, '', 1))

          archive = Path('docs/content-roadmap-archive.md')
          text = archive.read_text()
          marker = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          if text.count(marker) != 1:
              raise SystemExit(f'archive P28 marker count={text.count(marker)}')
          entry = """- [x] **P28-D1 — Ship Vanguard operator LOD0** — Completed 2026-10-07 with a deterministic shipping Vanguard hero model that promotes the proven D0 character source contract into the live Flagship runtime while preserving animation hooks, simulation-owned gameplay bounds, and the existing weapon socket.\n  - Added `operator-vanguard-lod0.glb` plus `scripts/prepare-vanguard-operator-lod0.mjs`; the 116,332-byte GLB uses layered cylindrical/chamfered/wedge hard-surface geometry, four textured metallic/roughness PBR materials, embedded base-color/normal/ORM/emissive payloads, class-specific ram plate/pauldrons/reactive pack/visor/light detail, and no embedded weapon. The regression requires at least 50 authored nodes, 16 geometry meshes, 550 source triangles, and 1,700 instantiated mesh-node triangles, materially above the D0 source baseline.\n  - Preserved `operator-rig`, hip/torso/helmet/arm/leg/backpack transforms and `weapon-socket`; hitbox/gameplay-bounds ownership remains simulation-side. Flagship/high detail selects `operator-vanguard-lod0`, while balanced/performance retain Vanguard LOD1/LOD2 and shared weapons/enemies keep their existing recovery LOD policy.\n  - Added deterministic byte-regeneration, geometry/detail, PBR texture/material, Babylon NullEngine loading, ground/bounds, rig/socket, no-embedded-weapon, and Flagship LOD-selection regressions. Updated browser authored-operator/mobile contracts so Vanguard LOD0 is verified independently from the breacher's LOD1 on Flagship.\n  - Exact implementation head `50f7878fed5c4382922695ee1f39301983616718` on PR #331 passed PR Candidate Verification run `37722878714`: the single full repository verification/production build, desktop and mobile-landscape browser journeys, APK delivery/signature checks, API 35 product smoke, Android 16/API 36 large-screen smoke, aggregate Android verification, and AO-5 exact-candidate evidence all passed. Candidate web artifact `ironshade-vector-pr-candidate-web-50f7878fed5c4382922695ee1f39301983616718` is `11526626581` (digest `sha256:319a7068e34d065e1d0b010fd1a57ff6e115e0ce7861117644652b165818b874`).\n  - Deterministic Flagship evidence is tagged `p28-d1-vanguard-operator-lod0`; P28 Image Grade Visual run `37722878475` passed with artifact `ironshade-vector-p28a5-image-grade` (`11527095201`, digest `sha256:11bf1be4b51958c07179ebb5d2634d49c257024a0619e43f4de987da461e09ed`) while explicitly requiring `operator-vanguard-lod0`, the articulated rig, and `weapon-socket` in the live high-tier scene. Browser artifacts are desktop `11527395510` (digest `sha256:b4578fe80d4feb7c5698819d1b1c70c9005866620f28d3da60ce76e36dffe4ec`) and mobile-landscape `11527475316` (digest `sha256:05e26d7621adc54cb54f1701ed006c333c1415de2bb3ed654ef165daf757e658`).\n  - Verified implementation APK artifact `ironshade-vector-pr-android-apk` (`11527130027`, artifact digest `sha256:f210ad4c6fe15e24b9dae3fe71654a14cff2100e4c114c3983b71e8a2ab807a0`) contains `Ironshade-Vector-Android-Debug.apk` (10,474,416 bytes; package `app.ironshade.vector`; version `0.0.1-pr.53 (53)`; min SDK 24; target SDK 36; APK Signature Scheme v2 verified; APK SHA-256 `93dddfbf095707a71542e71f633ff21ffcb333d3dc498b09793b253e43fc060c`). API 35 artifact `11526499558` and API 36 artifact `11525979674` preserve emulator evidence for that same APK; candidate evidence artifact `11527036486` records the exact implementation proof ledger.\n  - **Next: P28-D2 — Ship Vector operator LOD0.**\n\n"""
          archive.write_text(text.replace(marker, marker + entry, 1))
          PY
          node agent/tools/sync-roadmap-metadata.mjs --write
          node agent/tools/sync-roadmap-metadata.mjs
          rm .github/workflows/p28d1-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json .github/workflows/p28d1-closeout.yml
          git diff --cached --check
          git commit -m 'P28-D1 archive verified Vanguard LOD0 delivery'
          git push origin HEAD:${GITHUB_REF_NAME}
