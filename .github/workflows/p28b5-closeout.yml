name: P28 B5 roadmap closeout

on:
  push:
    branches:
      - p28-b5-refinery-decal-atlas
    paths:
      - .github/workflows/p28b5-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p28-b5-refinery-decal-atlas
      - name: Archive B5 and advance the active queue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path('docs/content-roadmap.md')
          roadmap = roadmap_path.read_text()
          active = """- [ ] **P28-B5 — Add a refinery decal/trim atlas** — Add a rich detail layer for panel seams, hazard stripes, service labels, grime, heat staining, and repair marks using an atlas plus instanced/merged decal cards or another Babylon-friendly batching method. **Done when:** the refinery gains convincing medium-scale breakup, decals do not z-fight or obscure combat telegraphs, and standard build/APK gates pass.\n\n"""
          if active not in roadmap:
              raise SystemExit('P28-B5 active roadmap item was not found exactly once')
          roadmap = roadmap.replace(active, '', 1)
          if '**P28-B5 —' in roadmap:
              raise SystemExit('P28-B5 still appears in the active roadmap')
          roadmap_path.write_text(roadmap)

          archive_path = Path('docs/content-roadmap-archive.md')
          archive = archive_path.read_text()
          if '**P28-B5 —' in archive:
              raise SystemExit('P28-B5 is already archived')
          anchor = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          if anchor not in archive:
              raise SystemExit('P28 archive anchor not found')
          entry = """- [x] **P28-B5 — Add a refinery decal/trim atlas** — Added a deterministic shared 512×512 detail atlas and batched decal-card geometry for authored refinery machinery without changing gameplay layout, collision, or cue ownership.
            - `scripts/prepare-refinery-decal-atlas.mjs` generates `refinery-decal-atlas.png` with six medium-scale detail families—panel seams, hazard stripes, service labels, grime, heat staining, and repair marks—and merges one alpha-blended detail mesh into processor, pipe-rack, and smelter-gantry LOD1/LOD2 GLBs. Cards remain vertical and use a 0.012 surface offset, avoiding floor combat telegraphs and z-fighting while preserving existing authored bounds and premium PBR geometry/material contracts.
            - The generated GLBs retain the repository's extension-free baseline loader contract; the B5 detail material uses alpha PBR with no emissive output. `tests/node-glb-external-texture-shim.mjs` lets generic Node GLB content validation resolve the external atlas texture without broadening the production Babylon loader boundary.
            - Added `tests/refinery-decal-atlas.mjs`, extended machinery/content/runtime regressions, and tagged deterministic Flagship visual capture with `p28-b5-refinery-decal-atlas`.
            - Exact code candidate `abdd6dc81cef69a7cce332c0040af1127f355475` passed Browser E2E run `37498049266` on desktop and mobile-landscape, P28 Image Grade Visual run `37498049122`, Build Android APK run `37498049166`, and PR Android APK run `37498049140` including full repository verification, native Android generation, API 35 product smoke, API 36 large-screen smoke, and aggregate Android verification.
            - Verified PR artifact `ironshade-vector-pr-android-apk` (artifact `11428293238`, artifact ZIP SHA-256 `274a9e9dc84d12d11ce6216786de36f48922990f7dbd6bb786c2bf98022b75de`) contains `Ironshade-Vector-Android-Debug.apk` (10,300,630 bytes; package `app.ironshade.vector`; version `0.0.1-pr.82 (82)`; min SDK 24; compile/target SDK 36; APK Signature Scheme v2 verified; signer SHA-256 `696a617b184e002aa777601eec31e03efa3df997e62dad201f302af2b2bca21b`; APK SHA-256 `fff70aaf5006d05dc7671d266ba7b5e63ada66952e27f04c97da414fc26138fc`).
            - **Next: P28-B6 — Art-direct Deep Salvage decal placement.**

          """
          archive_path.write_text(archive.replace(anchor, anchor + entry, 1))
          PY
          rm .github/workflows/p28b5-closeout.yml
          git diff --check
          grep -n -- 'P28-B6 — Art-direct Deep Salvage decal placement' docs/content-roadmap.md
          grep -n -- 'P28-B5 — Add a refinery decal/trim atlas' docs/content-roadmap-archive.md
          if grep -q -- '\[ \].*P28-B5' docs/content-roadmap.md; then
            echo 'P28-B5 still active' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md .github/workflows/p28b5-closeout.yml
          git commit -m 'docs: archive P28-B5 verification'
          git push origin HEAD:p28-b5-refinery-decal-atlas
