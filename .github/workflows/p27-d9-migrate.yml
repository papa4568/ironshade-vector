name: P27 D9 Migration

on:
  push:
    branches:
      - p27-d9-babylon-cleanup
    paths:
      - '.github/workflows/p27-d9-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p27-d9-babylon-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Use npm 10.9.8
        run: npm install --global npm@10.9.8
      - name: Apply migration
        run: python3 scripts/p27-d9-migrate.py
      - name: Regenerate lockfile without Three
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify migration shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q '"three"' package.json
          ! grep -q '"@types/three"' package.json
          test ! -f src/game/threeCombatRenderer.ts
          test ! -f src/game/webGpuRefineryRenderer.ts
          test ! -f src/game/hardSciFiVisuals.ts
          test ! -f src/game/mapVisuals.ts
          test ! -f src/game/refineryBloom.ts
          test ! -f src/game/refineryIbl.ts
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove retired Three runtime implementation'
          git push origin HEAD:p27-d9-babylon-cleanup
