name: P27 D9 Fix Regressions

on:
  push:
    branches:
      - p27-d9-babylon-cleanup
    paths:
      - '.github/workflows/p27-d9-fix-regressions.yml'
      - 'scripts/p27-d9-fix-regressions.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p27-d9-babylon-cleanup
          fetch-depth: 0
      - name: Apply regression migration
        run: |
          python3 scripts/p27-d9-fix-regressions.py
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/gameplay-regressions.ts
          git commit -m 'Move gameplay graphics assertions to Babylon'
          git push origin HEAD:p27-d9-babylon-cleanup
