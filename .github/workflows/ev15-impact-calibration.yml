name: EV-15 Impact Calibration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'agent/impact-calibration-corpus.json'
      - 'agent/impact-map.json'
      - 'agent/tools/impact-calibration-evidence.mjs'
      - 'agent/tools/impact-map-calibration.mjs'
      - 'agent/tools/select-affected-verification.mjs'
      - 'agent/tests/impact-calibration-evidence.mjs'
      - '.github/workflows/ev15-impact-calibration.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: Exact Candidate Impact Calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run EV-15 calibration contract regressions
        run: node agent/tests/impact-calibration-evidence.mjs

      - name: Generate exact-SHA EV-15 calibration evidence
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .agent-impact-calibration-ev15
          node agent/tools/impact-calibration-evidence.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-impact-calibration-ev15/calibration.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('.agent-impact-calibration-ev15/calibration.json','utf8')); if(r.taskId!=='EV-15'||r.candidateSha!==process.env.CANDIDATE_SHA||r.acceptedForEnforcement!==false||r.candidatePassGranted!==false||r.rollback.defaultImpactMapChanged!==false||r.rollback.enforcementEnabled!==false||r.metrics.decisionCalibration.pass!==true||r.safeWideningCandidates.length!==1||r.safeWideningCandidates[0].ruleId!=='ui-and-design-system'||r.safeWideningCandidates[0].action!=='set-risk-high'){throw new Error('EV-15 exact-SHA calibration evidence failed closed validation')}"

      - name: Upload exact-SHA EV-15 calibration evidence
        uses: actions/upload-artifact@v7
        with:
          name: impact-calibration-ev15-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-impact-calibration-ev15/calibration.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
