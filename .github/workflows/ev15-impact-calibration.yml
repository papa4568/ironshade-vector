name: EV-15 Impact Calibration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'agent/impact-calibration-corpus.json'
      - 'agent/impact-map.json'
      - 'agent/tools/impact-calibration-evidence.mjs'
      - 'agent/tools/verification-file-observer.cjs'
      - 'agent/tools/impact-map-calibration.mjs'
      - 'agent/tools/select-affected-verification.mjs'
      - 'agent/tests/impact-calibration-evidence.mjs'
      - '.github/workflows/ev15-impact-calibration.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  calibrate:
    name: Exact Candidate Impact Calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run EV-15 calibration contract regressions
        run: node agent/tests/impact-calibration-evidence.mjs

      - name: Generate exact-SHA EV-15 calibration evidence
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .agent-impact-calibration-ev15
          node agent/tools/impact-calibration-evidence.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-impact-calibration-ev15/calibration.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.agent-impact-calibration-ev15/calibration.json', 'utf8'));
          const fail = message => { throw new Error(`EV15_EXACT_EVIDENCE_FAIL ${message}`); };
          if (report.taskId !== 'EV-15' || report.candidateSha !== process.env.CANDIDATE_SHA) fail('task/candidate binding mismatch');
          if (report.acceptedForEnforcement !== false || report.candidatePassGranted !== false) fail('calibration must not grant enforcement or candidate acceptance');
          if (report.rollback.defaultImpactMapChanged !== false || report.rollback.enforcementEnabled !== false || report.rollback.sourceMutationsRestored !== true) fail('rollback/default-impact-map contract failed');
          if (report.metrics.decisionCalibration.pass !== true || report.metrics.decisionCalibration.falsePositiveWidenings !== 0 || report.metrics.decisionCalibration.falseNegativeWidenings !== 0) fail('widening decision zero-error calibration failed');
          if (report.metrics.authenticatedHistoricalObservationCount !== report.metrics.historicalObservationCount || report.metrics.historicalObservationCount !== 2) fail('historical full-verification controls are not independently authenticated');
          if (!report.historicalObservations.every(entry => entry.authentication?.authenticated === true && entry.authentication?.github?.authenticated === true && entry.authentication?.gitRange?.authenticated === true)) fail('historical authentication detail missing');
          if (report.ruleClassMetrics.length !== 1 || report.ruleClassMetrics[0].ruleId !== 'ui-and-design-system') fail('unexpected measured rule-class scope');
          const ui = report.ruleClassMetrics[0];
          if (ui.missCount !== 2 || ui.trialCount !== 2 || ui.selectedVerificationCount !== 4 || ui.overSelectedVerificationCount !== 3 || ui.observedOverSelectionRate !== 0.75 || ui.overSelectionMethod !== 'runtime-file-read-observation') fail('measured UI miss/over-selection metrics drifted');
          if (report.safeWideningCandidates.length !== 1 || report.safeWideningCandidates[0].ruleId !== 'ui-and-design-system' || report.safeWideningCandidates[0].action !== 'set-risk-high') fail('safe widening scope drifted');
          console.log(`EV15_EXACT_EVIDENCE_PASS candidate=${report.candidateSha} history=${report.metrics.authenticatedHistoricalObservationCount}/${report.metrics.historicalObservationCount} misses=${ui.missCount}/${ui.trialCount} overSelected=${ui.overSelectedVerificationCount}/${ui.selectedVerificationCount} widening=${report.safeWideningCandidates[0].ruleId}`);
          NODE

      - name: Upload exact-SHA EV-15 calibration evidence
        uses: actions/upload-artifact@v7
        with:
          name: impact-calibration-ev15-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-impact-calibration-ev15/calibration.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
