name: Apply item inspector redesign

on:
  push:
    branches:
      - feat/item-inspector-redesign

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-item-inspector-redesign.mjs')
          source = path.read_text()
          old = "  const deltaCopy = Math.abs(delta) < 0.001 ? 'NO CHANGE' : `${delta > 0 ? '+' : ''}${delta.toFixed(digits)}`;"
          new = "  const deltaCopy = Math.abs(delta) < 0.001 ? 'NO CHANGE' : (delta > 0 ? '+' : '') + delta.toFixed(digits);"
          if old not in source:
              raise SystemExit('deltaCopy patch marker missing')
          path.write_text(source.replace(old, new))
          PY
      - name: Apply redesign
        run: node scripts/apply-item-inspector-redesign.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production build
        run: npm run build
      - name: Commit verified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'Redesign item inspector experience'
          git push origin HEAD:feat/item-inspector-redesign
