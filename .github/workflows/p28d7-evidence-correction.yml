name: P28-D7 evidence correction

on:
  push:
    branches:
      - chatgpt/p28-d7-elite-enemy-lod0
    paths:
      - .github/workflows/p28d7-evidence-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Correct archived exact-candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/content-roadmap-archive.md')
          text = path.read_text()

          old_metrics = 'the production build generates a 99,276-byte textured metallic/roughness PBR GLB with 54 authored nodes, 1,792 source triangles, 9,780 instantiated mesh-node triangles'
          new_metrics = 'the production build generates a 116,800-byte textured metallic/roughness PBR GLB with 53 authored nodes, 592 source triangles, 1,820 instantiated mesh-node triangles'
          assert text.count(old_metrics) == 1, f'stale metric match count={text.count(old_metrics)}'
          text = text.replace(old_metrics, new_metrics, 1)

          old_digest = 'sha256:182455414213e1d7112c67099b81a30f84fa8819ea4a13b4dba68b725151fe6c'
          new_digest = 'sha256:d25f14371ca72c8af1c1843aef4c9b64155cbe1250f5160b4c86d83c01cdec05'
          assert text.count(old_digest) == 1, f'stale image-grade digest match count={text.count(old_digest)}'
          text = text.replace(old_digest, new_digest, 1)

          path.write_text(text)
          PY

          node agent/tools/sync-roadmap-metadata.mjs --write
          node agent/tests/roadmap-adapter.mjs

          python - <<'PY'
          import json
          from pathlib import Path

          archive = Path('docs/content-roadmap-archive.md').read_text()
          roadmap = Path('docs/content-roadmap.md').read_text()
          metadata = json.loads(Path('agent/roadmap-metadata.json').read_text())
          assert '116,800-byte' in archive
          assert '53 authored nodes, 592 source triangles, 1,820 instantiated mesh-node triangles' in archive
          assert 'sha256:d25f14371ca72c8af1c1843aef4c9b64155cbe1250f5160b4c86d83c01cdec05' in archive
          assert '99,276-byte' not in archive
          assert 'sha256:182455414213e1d7112c67099b81a30f84fa8819ea4a13b4dba68b725151fe6c' not in archive
          assert '**P28-D7 — Ship elite enemy LOD0**' not in roadmap
          assert metadata['roadmapIds'][0] == 'P28-D8'
          assert 'P28-D7' not in metadata['roadmapIds']
          PY

      - name: Commit correction and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p28d7-evidence-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git diff --cached --check
          git commit -m 'P28-D7 correct archived evidence'
          git push origin HEAD:${GITHUB_REF_NAME}
