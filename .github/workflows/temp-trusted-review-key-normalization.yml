name: Temporary Trusted Review Key Normalization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize-trusted-review-keys:
    if: github.event.head_commit.message == 'Add temporary trusted-review key normalization helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize incidental whitespace in trusted model JSON keys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('agent/tools/ao6-trusted-independent-review-v2.mjs')
          text = path.read_text()

          anchor = "function normalizeEnum(value) {\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'normalizeEnum anchor count={text.count(anchor)}')
          helper = (
              "export function normalizeReviewKeys(value) {\n"
              "  if (Array.isArray(value)) return value.map(normalizeReviewKeys);\n"
              "  if (!value || typeof value !== 'object') return value;\n"
              "  const normalized = {};\n"
              "  for (const [rawKey, rawValue] of Object.entries(value)) {\n"
              "    const key = rawKey.trim();\n"
              "    ok(key, 'trusted review contains an empty JSON key after whitespace normalization');\n"
              "    ok(!Object.hasOwn(normalized, key), `trusted review JSON keys collide after whitespace normalization: ${JSON.stringify(rawKey)} -> ${JSON.stringify(key)}`);\n"
              "    normalized[key] = normalizeReviewKeys(rawValue);\n"
              "  }\n"
              "  return normalized;\n"
              "}\n\n"
          )
          text = text.replace(anchor, helper + anchor, 1)

          old = "  const result = validate(anchorReviewIdentity(normalizeProofCheckIds(normalizeReviewEnums(parseReview(response)), packet), packet), packet);\n"
          new = "  const result = validate(anchorReviewIdentity(normalizeProofCheckIds(normalizeReviewEnums(normalizeReviewKeys(parseReview(response))), packet), packet), packet);\n"
          if text.count(old) != 1:
              raise SystemExit(f'run validation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = "  ok(normalizedEnums.proofChecks[0].status === 'credible', 'trusted wrapper did not normalize proof enum');\n"
          new = old + (
              "  const whitespaceKeys = {\n"
              "    schemaVersion: 1,\n"
              "    taskId: 'AO-6',\n"
              "    candidateSha: 'a'.repeat(40),\n"
              "    mode: 'read-only-adversarial',\n"
              "    verdict: 'pass',\n"
              "    acceptanceChecks: [\n"
              "      { index: 0, status: 'satisfied', '\\nnotes': 'checked' },\n"
              "      { index: 1, status: 'satisfied', notes: 'checked' },\n"
              "    ],\n"
              "    proofChecks: structuredClone(wrappedProof.proofChecks),\n"
              "    findings: [],\n"
              "  };\n"
              "  const normalizedKeys = validate(anchorReviewIdentity(normalizeProofCheckIds(normalizeReviewEnums(normalizeReviewKeys(whitespaceKeys)), packet), packet), packet);\n"
              "  ok(normalizedKeys.acceptanceChecks[0].notes === 'checked', 'trusted wrapper did not normalize incidental JSON-key whitespace');\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'self-test enum anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node agent/tools/ao6-trusted-independent-review-v2.mjs self-test
          git diff --check

      - name: Commit trusted verifier key normalization and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-trusted-review-key-normalization.yml
          git add agent/tools/ao6-trusted-independent-review-v2.mjs
          git commit -m 'Normalize trusted review JSON key whitespace'
          git push origin HEAD:main
