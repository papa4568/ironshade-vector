name: AO-6 Trusted Independent Review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ao6-trusted-independent-review.yml'
      - 'agent/tools/ao6-trusted-independent-review.mjs'
      - 'agent/tools/ao6-trusted-independent-review-v2.mjs'
      - 'agent/tools/trusted-independent-review-v3.mjs'
      - 'agent/tools/trusted-independent-review-v4.mjs'
      - 'agent/tools/experimental-review-task.mjs'
      - 'agent/tools/ao6-trusted-review-request.mjs'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      candidate_sha:
        description: Exact PR head SHA to review
        required: true
        type: string
      task_id:
        description: AO, EV, or product task ID
        required: false
        default: AO-6
        type: string

permissions:
  contents: read

jobs:
  self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Verify trusted-review parser and fail-closed contract
        run: |
          node agent/tools/ao6-trusted-independent-review.mjs self-test
          node agent/tools/ao6-trusted-independent-review-v2.mjs self-test
          node agent/tools/trusted-independent-review-v3.mjs self-test
          node agent/tools/trusted-independent-review-v4.mjs self-test
          node agent/tools/ao6-trusted-review-request.mjs self-test

  trusted-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/ao6-trusted-review ') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      copilot-requests: write
    steps:
      - name: Check out trusted main verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Resolve trusted review request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          INPUT_TASK_ID: ${{ inputs.task_id || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
        run: node agent/tools/ao6-trusted-review-request.mjs resolve
      - name: Install pinned Copilot CLI
        run: |
          npm install --global @github/copilot@1.0.88
          copilot --version
      - name: Verify trusted-review parser and fail-closed contract
        run: |
          node agent/tools/ao6-trusted-independent-review.mjs self-test
          node agent/tools/ao6-trusted-independent-review-v2.mjs self-test
          node agent/tools/trusted-independent-review-v3.mjs self-test
          node agent/tools/trusted-independent-review-v4.mjs self-test
          node agent/tools/ao6-trusted-review-request.mjs self-test
      - name: Run trusted exact-SHA adversarial review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: auto
        run: node agent/tools/trusted-independent-review-v4.mjs run
      - name: Retain validated trusted-review result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trusted-independent-review-${{ github.run_id }}
          path: .trusted-review/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
