name: Browser E2E

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate SHA whose verified web bundle must be tested.
        required: true
        type: string
      candidate_artifact_name:
        description: Same-run artifact containing dist/ and its candidate manifest.
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/browser-e2e.yml'
      - 'agent/tools/candidate-artifact.mjs'

permissions:
  contents: read

jobs:
  prepare-browser-candidate:
    name: Prepare Browser Candidate
    if: ${{ inputs.candidate_sha == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = '10.9.8'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit runtime dependencies once
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if grep -Eq '503 Service Unavailable|performing maintenance|audit endpoint returned an error' <<<"$output"; then
              if [[ "$attempt" -lt 4 ]]; then
                sleep $((attempt * 5))
                continue
              fi
              echo "::warning::npm advisory service unavailable after retries; lockfile remains pinned and this gate will run again on the next candidate."
              exit 0
            fi
            exit "$status"
          done

      - name: Run full regression and production build once
        run: npm run build

      - name: Create browser candidate artifact manifest
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          node agent/tools/candidate-artifact.mjs create \
            --candidate "$CANDIDATE_SHA" \
            --root dist \
            --build-command 'npm run build' \
            --output .candidate-artifact/candidate-web.json
          node agent/tools/candidate-artifact.mjs validate \
            --candidate "$CANDIDATE_SHA" \
            --root dist \
            --manifest .candidate-artifact/candidate-web.json

      - name: Upload browser candidate web bundle
        uses: actions/upload-artifact@v7
        with:
          name: ironshade-vector-browser-candidate-web-${{ github.sha }}
          path: |
            dist/
            .candidate-artifact/candidate-web.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  browser-e2e:
    needs: prepare-browser-candidate
    if: ${{ always() && (needs.prepare-browser-candidate.result == 'success' || needs.prepare-browser-candidate.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - desktop
          - mobile-landscape
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve exact candidate identity
        id: candidate
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.candidate_sha }}
          INPUT_ARTIFACT: ${{ inputs.candidate_artifact_name }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidate_sha="${INPUT_SHA:-$DEFAULT_SHA}"
          artifact_name="${INPUT_ARTIFACT:-ironshade-vector-browser-candidate-web-$candidate_sha}"
          echo "candidate-sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.candidate-sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          npm_version="$(npm --version)"
          echo "$npm_version"
          test "$npm_version" = "10.9.8"

      - name: Set up stable Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download exact candidate web bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: .

      - name: Verify exact candidate web bundle
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node agent/tools/candidate-artifact.mjs validate \
            --candidate "$CANDIDATE_SHA" \
            --root dist \
            --manifest .candidate-artifact/candidate-web.json

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > browser-preview.log 2>&1 &
          echo $! > "$RUNNER_TEMP/ironshade-preview.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo 'Production preview is ready.'
              exit 0
            fi
            sleep 0.5
          done
          cat browser-preview.log
          exit 1

      - name: Launch Chrome
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BROWSER_E2E_VIEWPORT: ${{ matrix.viewport }}
        run: |
          set -euo pipefail
          if [[ "$BROWSER_E2E_VIEWPORT" == "desktop" ]]; then
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y mesa-vulkan-drivers xvfb xauth >/dev/null
            lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 \( -name 'lvp_icd.json' -o -name 'lvp_icd.x86_64.json' \) -print -quit)"
            if [[ -z "$lavapipe_icd" ]]; then
              echo "::error::Mesa Lavapipe ICD is required for the headed Babylon WebGPU presentation gate."
              find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print 2>/dev/null || true
              exit 1
            fi
            npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.26.1 >/dev/null
            export BABYLON_LAVAPIPE_ICD="$lavapipe_icd"
            cat > .babylon-webgpu-puppeteer-launch.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: false,
            dumpio: true,
            protocolTimeout: 0,
            userDataDir: `${process.env.RUNNER_TEMP}/ironshade-browser-e2e`,
            env: {
              ...process.env,
              VK_DRIVER_FILES: process.env.BABYLON_LAVAPIPE_ICD,
            },
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-unsafe-webgpu',
              '--enable-features=Vulkan',
              '--ozone-platform=x11',
              '--ignore-gpu-blocklist',
              '--disable-gpu-driver-bug-workarounds',
              '--disable-gpu-watchdog',
              '--window-size=1280,720',
              '--remote-debugging-address=127.0.0.1',
              '--remote-debugging-port=9223',
              'http://127.0.0.1:4173/',
            ],
          });

          const shutdown = async () => {
            await browser.close().catch(() => undefined);
            process.exit(0);
          };
          process.once('SIGTERM', shutdown);
          process.once('SIGINT', shutdown);
          console.log(`Babylon WebGPU Puppeteer headed browser ready endpoint=${browser.wsEndpoint()}`);
          await new Promise(() => {});
          NODE
            xvfb-run -a -s "-screen 0 1280x720x24" node .babylon-webgpu-puppeteer-launch.mjs > browser-chrome.log 2>&1 &
            launch_attempts=180
            echo "Babylon WebGPU desktop Chrome mode: puppeteer-headed-xvfb lavapipe=$lavapipe_icd"
          else
            chrome_window_size="851,360"
            chrome_dir="$(dirname "$CHROME_PATH")"
            swiftshader_icd="$(find "$chrome_dir" -maxdepth 4 -name vk_swiftshader_icd.json -print -quit)"
            if [[ -z "$swiftshader_icd" ]]; then
              echo "::error::Chrome for Testing did not include vk_swiftshader_icd.json; mobile WebGPU support cannot initialize."
              find "$chrome_dir" -maxdepth 4 -type f | sort | tail -n 120
              exit 1
            fi
            export VK_ICD_FILENAMES="$swiftshader_icd"
            export LD_LIBRARY_PATH="$(dirname "$swiftshader_icd"):${LD_LIBRARY_PATH:-}"
            "$CHROME_PATH" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --enable-unsafe-webgpu \
              --use-webgpu-adapter=swiftshader \
              --use-vulkan=swiftshader \
              --enable-dawn-features=allow_unsafe_apis \
              --disable-dawn-features=use_dxc \
              --enable-webgpu-developer-features \
              --use-gpu-in-tests \
              --enable-accelerated-2d-canvas \
              --enable-unsafe-swiftshader \
              --window-size="$chrome_window_size" \
              --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=9223 \
              --user-data-dir="$RUNNER_TEMP/ironshade-browser-e2e" \
              http://127.0.0.1:4173/ > browser-chrome.log 2>&1 &
            launch_attempts=60
            echo "Browser Chrome mode: headless-mobile swiftshader=$swiftshader_icd"
          fi
          echo $! > "$RUNNER_TEMP/ironshade-chrome.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null; then
              echo 'Chrome CDP endpoint is ready.'
              exit 0
            fi
            sleep 0.5
          done
          cat browser-chrome.log
          exit 1

      - name: Verify browser player journey
        env:
          CDP_ENDPOINT: http://127.0.0.1:9223
          BROWSER_E2E_APP_URL: http://127.0.0.1:4173/
          BROWSER_E2E_VIEWPORT: ${{ matrix.viewport }}
          BROWSER_E2E_GRAPHICS_PATH: babylon
          BROWSER_E2E_SKIP_SYNTHETIC_CONTROLLER: ${{ matrix.viewport == 'desktop' && '1' || '0' }}
          BROWSER_E2E_SCREENSHOT: browser-e2e-${{ matrix.viewport }}.png
          BROWSER_E2E_COMMAND_SCREENSHOT: browser-command-${{ matrix.viewport }}.png
          BROWSER_E2E_CLASS_SCREENSHOT: browser-class-${{ matrix.viewport }}.png
          BROWSER_E2E_ACCESSIBILITY_SCREENSHOT: browser-accessibility-${{ matrix.viewport }}.png
          BROWSER_E2E_P22C_BEFORE_SCREENSHOT: browser-p22c-before-${{ matrix.viewport }}.png
          BROWSER_E2E_P22C_AFTER_SCREENSHOT: browser-p22c-after-${{ matrix.viewport }}.png
          BROWSER_E2E_P22C_CONTRACT_SCREENSHOT: browser-p22c-contract-${{ matrix.viewport }}.png
          BROWSER_E2E_P22C_DIALOG_SCREENSHOT: browser-p22c-dialog-${{ matrix.viewport }}.png
          BROWSER_E2E_P22C_REPORT: browser-p22c-${{ matrix.viewport }}.json
          BROWSER_E2E_CHAPTER3_SCREENSHOT: browser-chapter3-${{ matrix.viewport }}.png
          BROWSER_E2E_CHAPTER3_REPORT: browser-chapter3-${{ matrix.viewport }}.json
        run: |
          node() {
            if [[ "${1:-}" != "scripts/browser-runtime-smoke.mjs" ]]; then
              command node "$@"
              return
            fi
            local attempt log_file status
            log_file="$(mktemp "$RUNNER_TEMP/browser-runtime-smoke.XXXXXX.log")"
            for attempt in 1 2; do
              set +e
              command node "$@" 2>&1 | tee "$log_file"
              status=${PIPESTATUS[0]}
              set -e
              if [[ "$status" -eq 0 ]]; then
                rm -f "$log_file"
                return 0
              fi
              if [[ "$attempt" -eq 1 ]] && grep -Eq '"(environmentState|enemyState)":"loading"' "$log_file"; then
                echo "::notice::Retrying browser parity once after transient authored-scene loading race."
                continue
              fi
              rm -f "$log_file"
              return "$status"
            done
          }
          node scripts/verify-authored-operator.mjs
          node scripts/verify-authored-enemies.mjs
          node scripts/verify-authored-weapons.mjs
          node scripts/verify-authored-interactables.mjs
          node scripts/verify-authored-refinery.mjs
          BROWSER_E2E_GRAPHICS_PATH=babylon BROWSER_E2E_SCREENSHOT=browser-e2e-${{ matrix.viewport }}-p27a2-babylon.png node scripts/browser-runtime-smoke.mjs
          if [[ "${{ matrix.viewport }}" == "desktop" ]]; then
            BROWSER_E2E_GRAPHICS_PATH=babylon BROWSER_E2E_BABYLON_BACKEND=webgpu BROWSER_E2E_SCREENSHOT=browser-e2e-${{ matrix.viewport }}-p27d1-babylon-webgpu.png node scripts/browser-runtime-smoke.mjs
          fi
          BROWSER_E2E_GRAPHICS_PATH=babylon BROWSER_E2E_LOCATION=orbital-station BROWSER_E2E_SCREENSHOT=browser-e2e-${{ matrix.viewport }}-p27c1-orbital-station.png node scripts/browser-runtime-smoke.mjs
          BROWSER_E2E_GRAPHICS_PATH=babylon BROWSER_E2E_LOCATION=damaged-vessel BROWSER_E2E_SCREENSHOT=browser-e2e-${{ matrix.viewport }}-p27c2-damaged-vessel.png node scripts/browser-runtime-smoke.mjs
          BROWSER_E2E_LOCATION=damaged-vessel BROWSER_E2E_SCREENSHOT=browser-e2e-${{ matrix.viewport }}-damaged-vessel.png node scripts/browser-runtime-smoke.mjs
          node scripts/verify-authored-damaged-vessel.mjs
          node --input-type=module <<'NODE'
          const targets = await (await fetch('http://127.0.0.1:9223/json')).json();
          const target = targets.find(candidate => candidate.type === 'page' && candidate.webSocketDebuggerUrl);
          if (!target) throw new Error('No Chrome page target available for Spin Habitat QA seeding.');
          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener('open', resolve, { once: true });
            socket.addEventListener('error', reject, { once: true });
          });
          let sequence = 0;
          const evaluate = expression => new Promise((resolve, reject) => {
            const id = ++sequence;
            const onMessage = event => {
              const message = JSON.parse(event.data);
              if (message.id !== id) return;
              socket.removeEventListener('message', onMessage);
              if (message.error) reject(new Error(message.error.message));
              else resolve(message.result);
            };
            socket.addEventListener('message', onMessage);
            socket.send(JSON.stringify({ id, method: 'Runtime.evaluate', params: { expression, returnByValue: true } }));
          });
          const result = await evaluate(`(() => {
            const stateKey = 'ironshade-vector-state-v1';
            const campaignKey = 'ironshade-vector-campaign-v1';
            const stateRaw = localStorage.getItem(stateKey);
            if (stateRaw) {
              const state = JSON.parse(stateRaw);
              if (state?.campaign) state.campaign.cycle = 1;
              localStorage.setItem(stateKey, JSON.stringify(state));
            }
            const campaignRaw = localStorage.getItem(campaignKey);
            if (campaignRaw) {
              const campaign = JSON.parse(campaignRaw);
              campaign.cycle = 1;
              localStorage.setItem(campaignKey, JSON.stringify(campaign));
            }
            return { state: Boolean(stateRaw), campaign: Boolean(campaignRaw) };
          })()`);
          socket.close();
          if (result?.result?.exceptionDetails) throw new Error('Failed to seed Spin Habitat QA campaign cycle.');
          console.log('BROWSER_SPIN_HABITAT_SEED_PASS cycle=1');
          NODE
