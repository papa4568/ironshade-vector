            };
            socket.addEventListener('message', onMessage);
            socket.send(JSON.stringify({ id, method: 'Runtime.evaluate', params: { expression, returnByValue: true } }));
          });
          const result = await evaluate(`(() => {
            const stateKey = 'ironshade-vector-state-v1';
            const campaignKey = 'ironshade-vector-campaign-v1';
            const stateRaw = localStorage.getItem(stateKey);
            if (stateRaw) {
              const state = JSON.parse(stateRaw);
              if (state?.campaign) state.campaign.cycle = 4;
              localStorage.setItem(stateKey, JSON.stringify(state));
            }
            const campaignRaw = localStorage.getItem(campaignKey);
            if (campaignRaw) {
              const campaign = JSON.parse(campaignRaw);
              campaign.cycle = 4;
              localStorage.setItem(campaignKey, JSON.stringify(campaign));
            }
            return { state: Boolean(stateRaw), campaign: Boolean(campaignRaw) };
          })()`);
          socket.close();
          if (result?.result?.exceptionDetails) throw new Error('Failed to seed Solar Yard QA campaign cycle.');
          console.log('BROWSER_SOLAR_YARD_SEED_PASS cycle=4');
          NODE
          BROWSER_E2E_LOCATION=solar-yard BROWSER_E2E_SCREENSHOT=browser-e2e-${{ matrix.viewport }}-solar-yard.png node scripts/browser-runtime-smoke.mjs
          node scripts/browser-chapter3-playthrough.mjs

      - name: Upload browser QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ironshade-vector-browser-e2e-${{ matrix.viewport }}
          path: |
            browser-class-${{ matrix.viewport }}.png
            browser-accessibility-${{ matrix.viewport }}.png
            browser-chapter3-${{ matrix.viewport }}.png
            browser-chapter3-${{ matrix.viewport }}.json
            browser-command-${{ matrix.viewport }}.png
            browser-e2e-${{ matrix.viewport }}.png
            browser-e2e-${{ matrix.viewport }}-damaged-vessel.png
            browser-e2e-${{ matrix.viewport }}-spin-habitat.png
            browser-e2e-${{ matrix.viewport }}-jovian-harvester.png
            browser-e2e-${{ matrix.viewport }}-ice-mine.png
            browser-e2e-${{ matrix.viewport }}-solar-yard.png
            browser-preview.log
            browser-chrome.log
          if-no-files-found: warn
          retention-days: 30
