name: P28-A0 Browser Smoke Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-browser-smoke-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct adaptive shadow expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-runtime-smoke.mjs')
          source = path.read_text()

          anchor = "  const effectsExpected = {\n"
          replacement = "  const qualityInputMatch = /^requested:([0-9]+\\.[0-9]{2})\\+effective:([0-9]+\\.[0-9]{2})$/.exec(state.renderQualityInput);\n  const effectsExpected = {\n"
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one effectsExpected anchor, found {source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)

          anchor = "  }[state.renderTier];\n  if (!effectsBudgetMatch\n"
          replacement = "  }[state.renderTier];\n  const expectedShadow = effectsExpected && qualityInputMatch\n    && Number(qualityInputMatch[2]) > 0.62\n    && state.renderTier !== 'performance'\n      ? effectsExpected.shadow\n      : '0';\n  if (!effectsBudgetMatch\n"
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one effects tier anchor, found {source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)

          anchor = "    || !effectsExpected\n    || effectsBudgetMatch[1] !== state.renderTier\n    || effectsBudgetMatch[2] !== effectsExpected.shadow\n"
          replacement = "    || !effectsExpected\n    || !qualityInputMatch\n    || effectsBudgetMatch[1] !== state.renderTier\n    || effectsBudgetMatch[2] !== expectedShadow\n"
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one effects shadow assertion anchor, found {source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)

          path.write_text(source)
          PY
          git diff --check
          node --check scripts/browser-runtime-smoke.mjs
      - name: Commit correction and retire helper
        shell: bash
        run: |
          rm .github/workflows/p28a0-browser-smoke-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-runtime-smoke.mjs .github/workflows/p28a0-browser-smoke-fix.yml
          git commit -m 'Fix P28-A0 adaptive shadow smoke expectation'
          git push origin HEAD:main
