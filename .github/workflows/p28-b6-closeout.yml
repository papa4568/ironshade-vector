name: P28 B6 Closeout

on:
  push:
    branches:
      - p28-b6-deep-salvage-decals

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive P28-B6 and advance active queue
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const archivePath = 'docs/content-roadmap-archive.md';
          const roadmapPath = 'docs/content-roadmap.md';
          let archive = fs.readFileSync(archivePath, 'utf8');
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');

          const entry = `- [x] **P28-B6 — Art-direct Deep Salvage decal placement** — Art-directed the existing shared refinery detail atlas across the Deep Salvage showcase route with sparse navigation/focal hierarchy marks while preserving the simulation-owned route layout, collision, mission state, and gameplay-cue ownership.
            - Added \`scripts/prepare-refinery-route-decals.mjs\` and wired it into the existing deterministic premium-surface preparation path. Ten LOD1/LOD2 targets now receive one merged alpha-blended route-detail batch per asset: floor panels use low-opacity structural seam rhythm; service grates use bounded hazard/label marks; bulkheads reinforce thresholds; wall service panels add seams, grime, and repair history; terminals add service/repair focal detail.
            - Reused \`refinery-decal-atlas-v1\` instead of introducing another texture. Ground cards are capped at opacity \`0.46\`, vertical focal cards at \`0.76\`, all cards are non-emissive with a \`0.012\` anti-z-fight offset, and authored metadata explicitly records \`gameplay-cues-win:low-opacity-ground-detail\` or \`no-floor-cue-overlap\`. Repeated floor modules intentionally use only continuous panel-seam rhythm while other families mix atlas details with the existing authored module rotations to avoid obvious salient tiling.
            - Extended \`tests/refinery-premium-surfaces.mjs\` and \`tests/refinery-machinery-premium-surfaces.mjs\` so B2/B4 base geometry/material invariants remain enforced while B6 validates family coverage, sparse batching, atlas reuse, route roles, opacity/cue priority, non-emissive behavior, unchanged gameplay/layout bounds, anti-tiling policy, scene mounting, and deterministic/idempotent regeneration. The Flagship capture is tagged \`p28-b6-deep-salvage-route-decals\`.
            - Exact code candidate \`e1fc65cc1d4a312d78094d25d8c6ec3588d1896f\` passed Browser E2E run \`37512446185\` on desktop and mobile-landscape (full repository regression/production build plus live player journeys), P28 Image Grade Visual run \`37512446234\`, and PR Android APK run \`37512446336\` including full repository verification, native Android generation, APK build/sign/delivery checks, API 35 product smoke, API 36 Android 16 large-screen smoke, and aggregate Android verification. Deterministic Flagship capture artifact \`11435464680\` (digest \`sha256:ff5ca9a5e95137d5241f48b26fc98b33f9078225a312aee06894a591349928f3\`) retained gameplay cues at critical scale \`1.00\` in normal and forced low-visibility grades; visual inspection showed no dominant repeated high-salience marks.
            - Verified PR artifact \`ironshade-vector-pr-android-apk\` (artifact \`11435654813\`, artifact ZIP SHA-256 \`6c92642f497b85b765a8cc9fb5e1a4b625f3764a2c0f5ac8bc6179e751d77f57\`) contains \`Ironshade-Vector-Android-Debug.apk\` (10,309,378 bytes; package \`app.ironshade.vector\`; version \`0.0.1-pr.86 (86)\`; min SDK 24; compile/target SDK 36; APK Signature Scheme v2 verified; signer SHA-256 \`6ea33afa2fa9d5dfcdfa6484af20a99f4546af4f5835fc83322797542392a216\`; APK SHA-256 \`73bcd8a4bd92ad2f0aabefdfa70da710209e185ac6fdb4129b9cb44c5cad9325\`).
            - **Next: P28-C0 — Add reusable non-box hard-surface geometry support to asset authoring.**`;

          if (!archive.includes('**P28-B6 — Art-direct Deep Salvage decal placement**')) {
            const heading = '## P28 — Babylon flagship visual-quality overhaul\n';
            if (!archive.includes(heading)) throw new Error('P28 archive heading not found');
            archive = archive.replace(heading, `${heading}\n${entry}\n\n`);
            fs.writeFileSync(archivePath, archive);
          }

          const before = roadmap;
          roadmap = roadmap.replace(/\n- \[ \] \*\*P28-B6 — Art-direct Deep Salvage decal placement\*\*[^\n]*\n/, '\n');
          if (before === roadmap && roadmap.includes('P28-B6 — Art-direct Deep Salvage decal placement')) {
            throw new Error('P28-B6 roadmap item was not removed');
          }
          if (!roadmap.includes('- [ ] **P28-C0 — Add reusable non-box hard-surface geometry support to asset authoring**')) {
            throw new Error('P28-C0 did not become the next active item');
          }
          fs.writeFileSync(roadmapPath, roadmap);
          NODE

      - name: Commit closeout and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/p28-b6-closeout.yml
          git add docs/content-roadmap.md docs/content-roadmap-archive.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P28-B6 archive verified completion"
          git push origin HEAD:${GITHUB_REF_NAME}
