name: EV-16 Authoring

on:
  push:
    branches:
      - agent/ev16-impact-widening

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev16-impact-widening
          fetch-depth: 0

      - name: Apply EV-16 implementation
        run: python3 agent/ev16-authoring.py

      - name: Restore workflow files for connector-owned commit
        run: |
          set -euo pipefail
          git restore --source=HEAD -- \
            .github/workflows/ev16-authoring.yml \
            .github/workflows/agent-orchestration.yml \
            .github/workflows/ev15-impact-calibration.yml \
            agent/ev16-authoring.py
          rm -f .github/workflows/ev16-impact-widening.yml

      - name: Commit non-workflow implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'EV-16 enforce calibrated impact widening'
          git push origin HEAD:agent/ev16-impact-widening
