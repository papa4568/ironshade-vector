name: EV-16 Authoring

on:
  push:
    branches:
      - agent/ev16-impact-widening

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev16-impact-widening
          fetch-depth: 0

      - name: Generate permanent workflow blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 agent/ev16-workflow-authoring.py
