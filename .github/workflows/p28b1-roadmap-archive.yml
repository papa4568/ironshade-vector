name: P28-B1 Roadmap Archive

on:
  push:
    branches:
      - p28-b1-premium-pbr-surface-library
    paths:
      - .github/workflows/p28b1-roadmap-archive.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out B1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p28-b1-premium-pbr-surface-library

      - name: Move verified P28-B1 evidence to archive
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const activePath = 'docs/content-roadmap.md';
          const archivePath = 'docs/content-roadmap-archive.md';
          let active = fs.readFileSync(activePath, 'utf8');
          let archive = fs.readFileSync(archivePath, 'utf8');

          const itemPattern = /^- \[ \] \*\*P28-B1 — Build a reusable premium PBR surface library\*\*.*\n/m;
          const archiveMarker = '- [x] **P28-B1 — Build a reusable premium PBR surface library**';
          const archiveBlock = `- [x] **P28-B1 — Build a reusable premium PBR surface library** — Added five reusable flagship hard-sci-fi surface families—painted metal, bare metal, deck plate, polymer/rubber, and emissive fixture—with deterministic local KTX2 mip chains and Babylon PBR bindings.\n  - Added \`scripts/prepare-premium-pbr-library.mjs\`; it generates 512×512 authored base-color/normal/packed ORM maps (plus emissive for fixtures), full 512→1 mip chains, correct sRGB/linear metadata, and KTX2 Zstandard supercompression into \`public/assets/materials/premium-pbr/\`.\n  - Added \`src/game/babylonPremiumPbrSurfaceLibrary.ts\` with reusable shared \`PBRMaterial\` instances, trilinear mip sampling, engine-bounded anisotropy up to 16×, glTF ORM channel semantics, tangent-space normal strength, and emissive fixture support.\n  - Added deterministic content validation in \`tests/premium-pbr-library.mjs\`; the exact generated library is 3,875,485 bytes across five surfaces and validates KTX2 headers/DFD/orientation, ten mip levels, Zstd round-trip, color spaces, ORM channel variation, authored surface variation, and deterministic rebuilds.\n  - Exact product revision \`ca21bbc3d635b38b12dcaa6c12312a4fe58cd7c8\` passed full repository verification and Browser E2E run \`37449379474\`, plus PR Android APK run \`37449379488\` with APK build/signing/delivery checks and API 35 product smoke. The first API 36 large-screen attempt reached Babylon WebGL2 and the large-screen-ready checkpoint before a CDP transport timeout; rerunning only that failed job passed without product changes, confirming a harness/transport flake rather than a product regression.\n  - Verified PR debug APK: 10,252,407 bytes, SHA-256 \`fe9e15620465e4a1123e64cc35292465f861b0ba5ffa1ed846424c3a5151a9a5\`.\n  - **Next: P28-B2 — Apply P28 materials to refinery floors and bulkheads.**\n\n`;

          if (itemPattern.test(active)) {
            active = active.replace(itemPattern, '');
          } else if (!archive.includes(archiveMarker)) {
            throw new Error('P28-B1 active roadmap item was not found');
          }

          if (!archive.includes(archiveMarker)) {
            const heading = '## P28 — Babylon flagship visual-quality overhaul\n\n';
            const index = archive.indexOf(heading);
            if (index < 0) throw new Error('P28 archive heading was not found');
            archive = archive.slice(0, index + heading.length) + archiveBlock + archive.slice(index + heading.length);
          }

          if (active.includes('**P28-B1 — Build a reusable premium PBR surface library**')) {
            throw new Error('P28-B1 remains in the active roadmap');
          }
          if (!active.includes('- [ ] **P28-B2 — Apply P28 materials to refinery floors and bulkheads**')) {
            throw new Error('P28-B2 did not remain the next active material item');
          }
          if (!archive.includes(archiveMarker)) {
            throw new Error('P28-B1 archive evidence was not written');
          }

          fs.writeFileSync(activePath, active);
          fs.writeFileSync(archivePath, archive);
          NODE

      - name: Commit roadmap/archive update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content-roadmap.md docs/content-roadmap-archive.md
          if git diff --cached --quiet; then
            echo "Roadmap/archive already current"
            exit 0
          fi
          git commit -m "Archive verified P28-B1 completion"
          git push origin HEAD:p28-b1-premium-pbr-surface-library
