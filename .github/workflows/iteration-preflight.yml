name: Fast Iteration Preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iteration-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Verify iteration preflight guards
        run: node tests/iteration-preflight.mjs

      - name: Show affected checks without running expensive verification
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/iteration-preflight.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --json
