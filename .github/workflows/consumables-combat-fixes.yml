name: Validate combat fixes and consumables

on:
  push:
    branches:
      - feature/consumables-combat-fixes

jobs:
  verify-main-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests and production build
        run: npm run build
      - name: Load live QA script
        run: |
          git fetch origin feature/consumables-combat-fixes
          git show FETCH_HEAD:scripts/live_consumable_qa.mjs > .live-consumable-qa.mjs
      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Verify live purchase and combat stock
        run: node .live-consumable-qa.mjs
