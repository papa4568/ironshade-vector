name: Validate mobile clarity and recovery review

on:
  push:
    branches:
      - ui/mobile-clarity-recovery-review

permissions:
  contents: write

jobs:
  validate-publish-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply mobile clarity and recovery review
        run: |
          git fetch origin ui/mobile-clarity-recovery-review
          git show FETCH_HEAD:scripts/apply_mobile_clarity_review.py > /tmp/apply_mobile_clarity_review.py
          python /tmp/apply_mobile_clarity_review.py
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full regression suite and production build
        run: npm run build

      - name: Publish validated clarity changes to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/Armory.tsx src/game/threeCombatRenderer.ts src/readability.css src/equipmentBay.css tests/ui-readability.ts
          git commit -m 'Improve mobile combat and reward clarity'
          git push origin HEAD:main

      - name: Load live QA
        run: |
          git fetch origin ui/mobile-clarity-recovery-review
          git show FETCH_HEAD:scripts/live_mobile_clarity_qa.mjs > .live-mobile-clarity-qa.mjs

      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Verify live mobile clarity
        run: node .live-mobile-clarity-qa.mjs

      - name: Upload live QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-clarity-live-qa
          path: |
            mobile-gear-clarity.png
            mobile-combat-clarity.png
          if-no-files-found: ignore
