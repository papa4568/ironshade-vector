name: P27-D9 Command Fit Gate Fix

on:
  push:
    branches:
      - p27d9-clean
    paths:
      - .github/workflows/p27d9-command-fit-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p27d9-clean
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Patch Command fit assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/android-runtime-smoke.mjs')
          text = path.read_text()
          old = """  const overlap = !!rail && !!workspace && !(rail.right <= workspace.left || workspace.right <= rail.left || rail.bottom <= workspace.top || workspace.bottom <= rail.top);\n  const verticalOverflow = workspaceElement ? workspaceElement.scrollHeight - workspaceElement.clientHeight : null;\n  const scrollTop = workspaceElement?.scrollTop ?? null;\n  return { viewport, rail, workspace, overview, primaryCount: primaryButtons.length, offscreen, undersized, overlap, verticalOverflow, scrollTop, landscape: viewport.width > viewport.height };\n})()`);\nconst commandDoesNotFit = commandLayout.verticalOverflow === null\n  || commandLayout.verticalOverflow > 2\n  || commandLayout.scrollTop !== 0\n  || !commandLayout.overview\n  || commandLayout.overview.bottom > commandLayout.workspace.bottom + 2;\n"""
          new = """  const overlap = !!rail && !!workspace && !(rail.right <= workspace.left || workspace.right <= rail.left || rail.bottom <= workspace.top || workspace.bottom <= rail.top);\n  const workspaceChildren = workspaceElement\n    ? [...workspaceElement.children].filter(visible).map(element => ({\n      label: element.className || element.tagName,\n      rect: bounds(element),\n    }))\n    : [];\n  const workspaceOffscreen = workspace && workspaceChildren\n    ? workspaceChildren.filter(item => item.rect && (\n      item.rect.left < workspace.left - 2\n      || item.rect.top < workspace.top - 2\n      || item.rect.right > workspace.right + 2\n      || item.rect.bottom > workspace.bottom + 2\n    )).map(item => item.label)\n    : [];\n  const verticalOverflow = workspaceElement ? workspaceElement.scrollHeight - workspaceElement.clientHeight : null;\n  const scrollTop = workspaceElement?.scrollTop ?? null;\n  return { viewport, rail, workspace, overview, primaryCount: primaryButtons.length, offscreen, undersized, overlap, workspaceOffscreen, verticalOverflow, scrollTop, landscape: viewport.width > viewport.height };\n})()`);\nconst commandDoesNotFit = commandLayout.verticalOverflow === null\n  || commandLayout.scrollTop !== 0\n  || commandLayout.workspaceOffscreen.length\n  || !commandLayout.overview\n  || commandLayout.overview.bottom > commandLayout.workspace.bottom + 2;\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Command fit block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          npm ci --no-audit --no-fund
          npm run test:android-fast-smoke
          npm run test:ui
          git diff --check
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p27d9-command-fit-fix.yml
          git add scripts/android-runtime-smoke.mjs
          git commit -m 'Measure visible Command fit in Android smoke'
          git push origin HEAD:p27d9-clean
