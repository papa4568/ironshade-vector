name: ChatGPT P28-C1 Authored Refinery Patch

on:
  push:
    branches:
      - chatgpt/p28-c1-refinery-floor-lod0

permissions:
  contents: write

jobs:
  patch-authored-refinery-verifier:
    if: github.ref == 'refs/heads/chatgpt/p28-c1-refinery-floor-lod0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authored refinery LOD contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/verify-authored-refinery.mjs')
          text = path.read_text()
          stale = """      const lods = String(lastState.lod).split(',').filter(Boolean);\n      if (lods.length === 0 || !lods.every(value => value === '1' || value === '2')) {\n        throw new Error(`Unexpected authored Babylon refinery LOD: ${JSON.stringify(lastState)}`);\n      }\n"""
          replacement = """      const lods = String(lastState.lod).split(',').filter(Boolean);\n      const lodsSupported = lods.length > 0 && lods.every(value => value === '0' || value === '1' || value === '2');\n      const flagshipLodPresent = lastState.renderTier !== 'high' || lods.includes('0');\n      if (!lodsSupported || !flagshipLodPresent) {\n        throw new Error(`Unexpected authored Babylon refinery LOD: ${JSON.stringify(lastState)}`);\n      }\n"""

          if replacement in text:
              print('Authored refinery verifier already patched.')
          else:
              if text.count(stale) != 1:
                  raise SystemExit(f'expected one stale authored-refinery LOD assertion, found {text.count(stale)}')
              path.write_text(text.replace(stale, replacement, 1))

      - name: Commit source patch
        run: |
          if git diff --quiet -- scripts/verify-authored-refinery.mjs; then
            echo "Authored refinery verifier already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-authored-refinery.mjs
          git commit -m "test: verify flagship refinery lod0 runtime"
          git push origin HEAD:chatgpt/p28-c1-refinery-floor-lod0
