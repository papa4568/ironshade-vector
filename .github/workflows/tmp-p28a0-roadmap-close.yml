name: Temporary P28-A0 roadmap closeout

on:
  push:
    branches: [p28a0-roadmap-close-work]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: p28a0-roadmap-close-work
          fetch-depth: 0

      - name: Mark P28-A0 complete and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/content-roadmap.md')
          text = path.read_text()
          old = "- [ ] **P28-A0 — Remove legacy low-end quality ceilings from the production render policy**"
          new = "- [x] **P28-A0 — Remove legacy low-end quality ceilings from the production render policy**"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one unchecked P28-A0 item, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-p28a0-roadmap-close.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content-roadmap.md .github/workflows/tmp-p28a0-roadmap-close.yml
          git diff --cached --check
          git commit -m "Mark P28-A0 complete"
          git push origin HEAD:p28a0-roadmap-close-work
