name: Black-box Settings Playtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/android-settings-playtest.py'
      - '.github/workflows/settings-playtest.yml'

permissions:
  contents: read
  actions: read

jobs:
  play-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out QA scripts
        uses: actions/checkout@v4

      - name: Download verified beta.418 APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .settings-beta
          gh api repos/${{ github.repository }}/actions/artifacts/10894079405/zip > .settings-beta/beta418.zip
          unzip -q .settings-beta/beta418.zip -d .settings-beta/artifact
          test -s .settings-beta/artifact/Ironshade-Vector-Android-Beta.apk
          sha256sum .settings-beta/artifact/Ironshade-Vector-Android-Beta.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play Settings in beta.418
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash -lc 'adb install -r .settings-beta/artifact/Ironshade-Vector-Android-Beta.apk && python3 scripts/android-settings-playtest.py'

      - name: Upload black-box screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beta418-settings-black-box
          path: android-settings-*.png
          if-no-files-found: warn
          retention-days: 30
