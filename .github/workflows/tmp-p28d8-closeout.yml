name: P28-D8 Closeout Maintenance

on:
  push:
    branches:
      - chatgpt/p28-d8-refinery-boss-lod0

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run P28-D8 closeout maintenance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d8-refinery-boss-lod0
          fetch-depth: 0
      - name: Apply verified D8 closeout
        run: |
          node scripts/tmp-p28d8-closeout.mjs
          git diff --check
          git diff -- docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
      - name: Commit closeout
        run: |
          git config user.name 'papa4568'
          git config user.email 'fpspro0421@gmail.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git commit -m 'docs: archive P28-D8'
          git push origin HEAD:chatgpt/p28-d8-refinery-boss-lod0
