name: Three graphics migration

on:
  push:
    branches:
      - graphics/full-three-3d
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Apply renderer migration
        run: node scripts/apply-three-renderer.mjs
      - name: Validate beta and production build
        run: npm run build
      - name: Commit migrated GameCanvas
        shell: bash
        run: |
          if git diff --quiet -- src/components/GameCanvas.tsx; then
            echo "GameCanvas already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GameCanvas.tsx
          git commit -m "Wire Three.js renderer into combat canvas"
          git push origin HEAD:graphics/full-three-3d
