name: P28-B2 Implementation

on:
  push:
    branches:
      - p28-b2-refinery-floor-bulkhead-pbr
    paths:
      - '.github/workflows/p28b2-implement.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out B2 branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: p28-b2-refinery-floor-bulkhead-pbr

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: npm install --global npm@10.9.8

      - name: Implement premium refinery floor and bulkhead surfaces
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/prepare-refinery-premium-surfaces.mjs <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          export const REFINERY_PREMIUM_SURFACE_TARGETS = [
            { family: 'floor', relativePath: 'environments/refinery-floor-panel-lod1.glb' },
            { family: 'floor', relativePath: 'environments/refinery-floor-panel-lod2.glb' },
            { family: 'floorGrate', relativePath: 'environments/refinery-floor-service-grate-lod1.glb' },
            { family: 'floorGrate', relativePath: 'environments/refinery-floor-service-grate-lod2.glb' },
            { family: 'bulkhead', relativePath: 'environments/refinery-bulkhead-lod1.glb' },
            { family: 'bulkhead', relativePath: 'environments/refinery-bulkhead-lod2.glb' },
            { family: 'wallPanel', relativePath: 'environments/refinery-wall-service-panel-lod1.glb' },
            { family: 'wallPanel', relativePath: 'environments/refinery-wall-service-panel-lod2.glb' },
          ];

          function bytes(view) {
            return Buffer.from(view.buffer, view.byteOffset, view.byteLength);
          }

          function align(value, multiple = 4) {
            return Math.ceil(value / multiple) * multiple;
          }

          function pad(buffer, multiple, fill) {
            const remainder = buffer.length % multiple;
            if (remainder === 0) return buffer;
            return Buffer.concat([buffer, Buffer.alloc(multiple - remainder, fill)]);
          }

          function parseGlb(buffer, label = 'GLB') {
            if (buffer.length < 20 || buffer.toString('ascii', 0, 4) !== 'glTF') throw new Error(`${label}: invalid GLB header`);
            if (buffer.readUInt32LE(4) !== 2) throw new Error(`${label}: expected glTF 2.0`);
            if (buffer.readUInt32LE(8) !== buffer.length) throw new Error(`${label}: GLB byte length mismatch`);
            const jsonLength = buffer.readUInt32LE(12);
            if (buffer.readUInt32LE(16) !== 0x4e4f534a) throw new Error(`${label}: JSON chunk is missing`);
            return JSON.parse(buffer.subarray(20, 20 + jsonLength).toString('utf8').trim());
          }

          function texturedCubeGeometry() {
            const h = 0.5;
            const faces = [
              { n: [0, 0, 1], t: [1, 0, 0, 1], p: [[-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h]] },
              { n: [0, 0, -1], t: [-1, 0, 0, 1], p: [[h, -h, -h], [-h, -h, -h], [-h, h, -h], [h, h, -h]] },
              { n: [1, 0, 0], t: [0, 0, -1, 1], p: [[h, -h, h], [h, -h, -h], [h, h, -h], [h, h, h]] },
              { n: [-1, 0, 0], t: [0, 0, 1, 1], p: [[-h, -h, -h], [-h, -h, h], [-h, h, h], [-h, h, -h]] },
              { n: [0, 1, 0], t: [1, 0, 0, 1], p: [[-h, h, h], [h, h, h], [h, h, -h], [-h, h, -h]] },
              { n: [0, -1, 0], t: [1, 0, 0, 1], p: [[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]] },
            ];
            const faceUvs = [[0, 0], [1, 0], [1, 1], [0, 1]];
            const positions = [];
            const normals = [];
            const tangents = [];
            const uvs = [];
            const indices = [];
            for (const face of faces) {
              const base = positions.length / 3;
              for (let vertex = 0; vertex < 4; vertex += 1) {
                positions.push(...face.p[vertex]);
                normals.push(...face.n);
                tangents.push(...face.t);
                uvs.push(...faceUvs[vertex]);
              }
              indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
            }
            return {
              positions: new Float32Array(positions),
              normals: new Float32Array(normals),
              tangents: new Float32Array(tangents),
              uvs: new Float32Array(uvs),
              indices: new Uint16Array(indices),
            };
          }

          function packGeometry(geometry) {
            const parts = [
              { data: bytes(geometry.positions), target: 34962 },
              { data: bytes(geometry.normals), target: 34962 },
              { data: bytes(geometry.tangents), target: 34962 },
              { data: bytes(geometry.uvs), target: 34962 },
              { data: bytes(geometry.indices), target: 34963 },
            ];
            const chunks = [];
            const views = [];
            let cursor = 0;
            for (const part of parts) {
              const offset = align(cursor);
              if (offset > cursor) chunks.push(Buffer.alloc(offset - cursor));
              views.push({ buffer: 0, byteOffset: offset, byteLength: part.data.length, target: part.target });
              chunks.push(part.data);
              cursor = offset + part.data.length;
            }
            const total = align(cursor);
            if (total > cursor) chunks.push(Buffer.alloc(total - cursor));
            return { binary: Buffer.concat(chunks), views };
          }

          function encodeGlb(gltf, binary) {
            const json = pad(Buffer.from(JSON.stringify(gltf), 'utf8'), 4, 0x20);
            const bin = pad(binary, 4, 0);
            const header = Buffer.alloc(12);
            header.write('glTF', 0, 'ascii');
            header.writeUInt32LE(2, 4);
            header.writeUInt32LE(12 + 8 + json.length + 8 + bin.length, 8);
            const jsonHeader = Buffer.alloc(8);
            jsonHeader.writeUInt32LE(json.length, 0);
            jsonHeader.writeUInt32LE(0x4e4f534a, 4);
            const binHeader = Buffer.alloc(8);
            binHeader.writeUInt32LE(bin.length, 0);
            binHeader.writeUInt32LE(0x004e4942, 4);
            return Buffer.concat([header, jsonHeader, json, binHeader, bin]);
          }

          export function upgradeRefineryPremiumSurfaceGlb(input, target) {
            const gltf = parseGlb(input, target.relativePath);
            if (!Array.isArray(gltf.meshes) || gltf.meshes.length === 0) throw new Error(`${target.relativePath}: no meshes found`);
            const geometry = texturedCubeGeometry();
            const { binary, views } = packGeometry(geometry);
            for (const mesh of gltf.meshes) {
              for (const primitive of mesh.primitives ?? []) {
                primitive.attributes = { POSITION: 0, NORMAL: 1, TANGENT: 2, TEXCOORD_0: 3 };
                primitive.indices = 4;
              }
            }
            gltf.accessors = [
              { bufferView: 0, componentType: 5126, count: 24, type: 'VEC3', min: [-0.5, -0.5, -0.5], max: [0.5, 0.5, 0.5] },
              { bufferView: 1, componentType: 5126, count: 24, type: 'VEC3' },
              { bufferView: 2, componentType: 5126, count: 24, type: 'VEC4' },
              { bufferView: 3, componentType: 5126, count: 24, type: 'VEC2' },
              { bufferView: 4, componentType: 5123, count: 36, type: 'SCALAR', min: [0], max: [23] },
            ];
            gltf.bufferViews = views;
            gltf.buffers = [{ byteLength: binary.length }];
            gltf.extras = {
              ...(gltf.extras ?? {}),
              ironshadeP28B2SurfaceGeometry: {
                version: 1,
                family: target.family,
                uvSet: 'TEXCOORD_0',
                tangentSpace: true,
                unitBounds: [[-0.5, -0.5, -0.5], [0.5, 0.5, 0.5]],
                gameplayBoundsChanged: false,
              },
            };
            return encodeGlb(gltf, binary);
          }

          export async function writeRefineryPremiumSurfaceGeometry() {
            const results = [];
            for (const target of REFINERY_PREMIUM_SURFACE_TARGETS) {
              const outputPath = resolve(process.cwd(), 'public/assets/models', target.relativePath);
              const input = await readFile(outputPath);
              const upgraded = upgradeRefineryPremiumSurfaceGlb(input, target);
              await writeFile(outputPath, upgraded);
              results.push({ ...target, bytes: upgraded.length });
            }
            console.log('[graphics] P28-B2 premium refinery surface geometry ' + results.map(item => `${item.relativePath}=${item.bytes}b`).join(' '));
            return results;
          }

          const modulePath = fileURLToPath(import.meta.url);
          if (process.argv[1] && resolve(process.argv[1]) === modulePath) await writeRefineryPremiumSurfaceGeometry();
          NODE

          cat > tests/refinery-premium-surfaces.mjs <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import {
            REFINERY_PREMIUM_SURFACE_TARGETS,
            upgradeRefineryPremiumSurfaceGlb,
          } from '../scripts/prepare-refinery-premium-surfaces.mjs';

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          function parseGlb(buffer, label) {
            assert(buffer.toString('ascii', 0, 4) === 'glTF', `${label}: invalid GLB magic`);
            assert(buffer.readUInt32LE(4) === 2, `${label}: expected glTF 2.0`);
            assert(buffer.readUInt32LE(8) === buffer.length, `${label}: byte length mismatch`);
            const jsonLength = buffer.readUInt32LE(12);
            assert(buffer.readUInt32LE(16) === 0x4e4f534a, `${label}: missing JSON chunk`);
            return JSON.parse(buffer.subarray(20, 20 + jsonLength).toString('utf8').trim());
          }

          const expectedMaterials = [
            'refinery-structural',
            'refinery-shell',
            'refinery-hazard-emissive',
            'refinery-screen-emissive',
          ];
          const requiredNodeByFamily = {
            floor: 'refinery-floor-panel',
            floorGrate: 'refinery-floor-service-grate',
            bulkhead: 'refinery-bulkhead-left',
            wallPanel: 'refinery-wall-service-panel-shell',
          };
          const expectedNodeTransforms = {
            'refinery-floor-panel': { translation: [0, 0.03, 0], scale: [3.8, 0.08, 3.8] },
            'refinery-floor-service-grate': { translation: [0, 0.035, 0], scale: [3.8, 0.07, 3.8] },
            'refinery-bulkhead-left': { translation: [0, 1.45, -1.75], scale: [0.44, 2.9, 0.38] },
            'refinery-wall-service-panel-shell': { translation: [0, 1.28, 0], scale: [0.18, 2.56, 2.75] },
          };

          for (const target of REFINERY_PREMIUM_SURFACE_TARGETS) {
            const path = resolve(process.cwd(), 'public/assets/models', target.relativePath);
            const bytes = await readFile(path);
            const gltf = parseGlb(bytes, target.relativePath);
            const rebuilt = upgradeRefineryPremiumSurfaceGlb(bytes, target);
            assert(bytes.equals(rebuilt), `${target.relativePath}: P28-B2 upgrade is not deterministic/idempotent`);

            assert(gltf.extras?.ironshadeP28B2SurfaceGeometry?.family === target.family, `${target.relativePath}: missing B2 geometry marker`);
            assert(gltf.extras?.ironshadeP28B2SurfaceGeometry?.gameplayBoundsChanged === false, `${target.relativePath}: gameplay-bounds invariant is missing`);
            assert(JSON.stringify(gltf.accessors?.[0]?.min) === JSON.stringify([-0.5, -0.5, -0.5]), `${target.relativePath}: position minimum changed`);
            assert(JSON.stringify(gltf.accessors?.[0]?.max) === JSON.stringify([0.5, 0.5, 0.5]), `${target.relativePath}: position maximum changed`);
            assert(gltf.accessors?.[0]?.count === 24, `${target.relativePath}: expected face-split 24-vertex geometry`);
            assert(gltf.accessors?.[2]?.type === 'VEC4' && gltf.accessors?.[2]?.count === 24, `${target.relativePath}: tangent accessor is missing`);
            assert(gltf.accessors?.[3]?.type === 'VEC2' && gltf.accessors?.[3]?.count === 24, `${target.relativePath}: UV0 accessor is missing`);
            assert(gltf.accessors?.[4]?.count === 36, `${target.relativePath}: index topology changed`);

            for (const mesh of gltf.meshes ?? []) {
              for (const primitive of mesh.primitives ?? []) {
                assert(primitive.attributes?.POSITION === 0, `${target.relativePath}: POSITION binding changed`);
                assert(primitive.attributes?.NORMAL === 1, `${target.relativePath}: NORMAL binding changed`);
                assert(primitive.attributes?.TANGENT === 2, `${target.relativePath}: TANGENT binding missing`);
                assert(primitive.attributes?.TEXCOORD_0 === 3, `${target.relativePath}: TEXCOORD_0 binding missing`);
                assert(primitive.indices === 4, `${target.relativePath}: index binding changed`);
              }
            }

            assert(JSON.stringify((gltf.materials ?? []).map(material => material.name)) === JSON.stringify(expectedMaterials), `${target.relativePath}: authored material slots changed`);
            const requiredName = requiredNodeByFamily[target.family];
            const requiredNode = (gltf.nodes ?? []).find(node => node.name === requiredName);
            assert(requiredNode, `${target.relativePath}: required surface node ${requiredName} is missing`);
            const expectedTransform = expectedNodeTransforms[requiredName];
            assert(JSON.stringify(requiredNode.translation) === JSON.stringify(expectedTransform.translation), `${target.relativePath}: ${requiredName} translation changed`);
            assert(JSON.stringify(requiredNode.scale) === JSON.stringify(expectedTransform.scale), `${target.relativePath}: ${requiredName} scale changed`);
          }

          const rendererSource = await readFile(resolve(process.cwd(), 'src/game/babylonCombatRenderer.ts'), 'utf8');
          const expectedTelemetry = 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|wall-panel:bare-metal+painted-metal';
          assert(rendererSource.includes(expectedTelemetry), 'Babylon refinery renderer is missing the B2 premium-surface telemetry contract');
          for (const surface of ['deck-plate', 'bare-metal', 'painted-metal']) {
            assert(rendererSource.includes(`'${surface}'`), `Babylon refinery renderer does not bind ${surface}`);
          }
          assert(rendererSource.includes('normal+roughness+metalness:shared-premium-pbr'), 'Babylon refinery renderer is missing material-detail telemetry');

          console.log(`REFINERY_PREMIUM_SURFACES_PASS targets=${REFINERY_PREMIUM_SURFACE_TARGETS.length} attributes=POSITION+NORMAL+TANGENT+TEXCOORD_0 bounds=unchanged telemetry=${expectedTelemetry}`);
          NODE

          python <<'PY'
          from pathlib import Path

          path = Path('src/game/babylonCombatRenderer.ts')
          text = path.read_text()

          old = "import { Mesh } from '@babylonjs/core/Meshes/mesh';\n"
          new = old + "import { InstancedMesh } from '@babylonjs/core/Meshes/instancedMesh';\n"
          assert old in text and "@babylonjs/core/Meshes/instancedMesh" not in text
          text = text.replace(old, new, 1)

          old = "import { BabylonRefineryPostProcessing } from './babylonRefineryPostProcessing';\n"
          new = old + "import {\n  createBabylonPremiumPbrSurfaceLibrary,\n  type BabylonPremiumPbrSurfaceLibrary,\n  type PremiumPbrSurfaceId,\n} from './babylonPremiumPbrSurfaceLibrary';\n"
          assert old in text and 'createBabylonPremiumPbrSurfaceLibrary' not in text
          text = text.replace(old, new, 1)

          old = "type RefineryFamilyKey = keyof typeof REFINERY_ASSET_FAMILIES;\n"
          new = old + "\nconst REFINERY_PREMIUM_SURFACE_ASSIGNMENTS: Partial<Record<RefineryFamilyKey, Readonly<Record<string, PremiumPbrSurfaceId>>>> = {\n  floor: {\n    'refinery-structural': 'deck-plate',\n    'refinery-shell': 'bare-metal',\n  },\n  floorGrate: {\n    'refinery-structural': 'bare-metal',\n    'refinery-shell': 'painted-metal',\n  },\n  bulkhead: {\n    'refinery-structural': 'painted-metal',\n    'refinery-shell': 'painted-metal',\n  },\n  wallPanel: {\n    'refinery-structural': 'bare-metal',\n    'refinery-shell': 'painted-metal',\n  },\n};\nconst REFINERY_PREMIUM_SURFACE_ORDER: readonly RefineryFamilyKey[] = ['floor', 'floorGrate', 'bulkhead', 'wallPanel'];\nconst REFINERY_PREMIUM_SURFACE_LABELS: Partial<Record<RefineryFamilyKey, string>> = {\n  floor: 'floor',\n  floorGrate: 'floor-grate',\n  bulkhead: 'bulkhead',\n  wallPanel: 'wall-panel',\n};\nconst REFINERY_PREMIUM_SURFACE_TELEMETRY = 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|wall-panel:bare-metal+painted-metal';\n\nfunction premiumSurfaceTelemetry(usage: Map<RefineryFamilyKey, Set<PremiumPbrSurfaceId>>) {\n  return REFINERY_PREMIUM_SURFACE_ORDER.map(key => {\n    const surfaces = [...(usage.get(key) ?? [])].sort();\n    return surfaces.length ? `${REFINERY_PREMIUM_SURFACE_LABELS[key]}:${surfaces.join('+')}` : '';\n  }).filter(Boolean).join('|');\n}\n"
          assert old in text and 'REFINERY_PREMIUM_SURFACE_ASSIGNMENTS' not in text
          text = text.replace(old, new, 1)

          old = "  private readonly refineryPostProcessing: BabylonRefineryPostProcessing;\n  private readonly renderBudget: AdaptiveRenderBudget;\n"
          new = "  private readonly refineryPostProcessing: BabylonRefineryPostProcessing;\n  private refineryPremiumSurfaceLibrary: BabylonPremiumPbrSurfaceLibrary | null = null;\n  private readonly renderBudget: AdaptiveRenderBudget;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "    this.refineryPostProcessing.dispose();\n    this.refineryLighting.dispose();\n    this.releaseRefineryEnvironment('renderer-dispose');\n    void disposeBabylonGraphicsAssetRuntime(this.scene);\n"
          new = "    this.refineryPostProcessing.dispose();\n    this.refineryLighting.dispose();\n    this.releaseRefineryEnvironment('renderer-dispose');\n    this.refineryPremiumSurfaceLibrary?.dispose();\n    this.refineryPremiumSurfaceLibrary = null;\n    void disposeBabylonGraphicsAssetRuntime(this.scene);\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  private async loadRefineryEnvironment(\n"
          new = "  private getRefineryPremiumSurfaceLibrary() {\n    this.refineryPremiumSurfaceLibrary ??= createBabylonPremiumPbrSurfaceLibrary(this.scene);\n    return this.refineryPremiumSurfaceLibrary;\n  }\n\n  private applyRefineryPremiumSurfaces(\n    key: RefineryFamilyKey,\n    instance: BabylonGraphicsAssetInstance,\n    usage: Map<RefineryFamilyKey, Set<PremiumPbrSurfaceId>>,\n  ) {\n    const assignments = REFINERY_PREMIUM_SURFACE_ASSIGNMENTS[key];\n    if (!assignments) return;\n    const library = this.getRefineryPremiumSurfaceLibrary();\n    const targetUsage = usage.get(key) ?? new Set<PremiumPbrSurfaceId>();\n    usage.set(key, targetUsage);\n\n    for (const node of instanceNodes(instance)) {\n      const mesh = node instanceof InstancedMesh ? node.sourceMesh : node instanceof Mesh ? node : null;\n      if (!mesh) continue;\n      const materialName = mesh.material?.name ?? '';\n      let surface = assignments[materialName];\n      if (!surface && materialName.startsWith('premium-pbr:')) {\n        const existingSurface = materialName.slice('premium-pbr:'.length) as PremiumPbrSurfaceId;\n        if (Object.values(assignments).includes(existingSurface)) surface = existingSurface;\n      }\n      if (!surface) continue;\n      mesh.material = library.get(surface);\n      targetUsage.add(surface);\n    }\n  }\n\n  private async loadRefineryEnvironment(\n"
          assert old in text and 'applyRefineryPremiumSurfaces' not in text
          text = text.replace(old, new, 1)

          old = "    const mountedInstances: BabylonGraphicsAssetInstance[] = [];\n    let placementCount = 0;\n"
          new = "    const mountedInstances: BabylonGraphicsAssetInstance[] = [];\n    const premiumSurfaceUsage = new Map<RefineryFamilyKey, Set<PremiumPbrSurfaceId>>();\n    let placementCount = 0;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "          instance.rootNodes.forEach(root => {\n            root.parent = placementRoot;\n          });\n          mountedInstances.push(instance);\n"
          new = "          instance.rootNodes.forEach(root => {\n            root.parent = placementRoot;\n          });\n          this.applyRefineryPremiumSurfaces(key, instance, premiumSurfaceUsage);\n          mountedInstances.push(instance);\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "      this.refineryAssetInstances.push(...mountedInstances);\n      this.refineryMountRoot = loadRoot;\n      loadRoot.setEnabled(true);\n\n      const lods = [...new Set(selected.map(item => item.spec.lod))].sort();\n"
          new = "      const premiumSurfaces = premiumSurfaceTelemetry(premiumSurfaceUsage);\n      if (premiumSurfaces !== REFINERY_PREMIUM_SURFACE_TELEMETRY) {\n        throw new Error(`Incomplete P28-B2 premium surface binding: ${premiumSurfaces || 'none'}`);\n      }\n\n      this.refineryAssetInstances.push(...mountedInstances);\n      this.refineryMountRoot = loadRoot;\n      loadRoot.setEnabled(true);\n\n      const lods = [...new Set(selected.map(item => item.spec.lod))].sort();\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "      this.canvas.dataset.environmentSurfaceDetail = `wall-panel:${placements.wallPanel.length}+cable-tray:${placements.cableTray.length}`;\n      this.canvas.dataset.environmentMachineDetail = `processor-functional:${placements.processor.length}+floor-grate:${placements.floorGrate.length}`;\n"
          new = "      this.canvas.dataset.environmentSurfaceDetail = `wall-panel:${placements.wallPanel.length}+cable-tray:${placements.cableTray.length}`;\n      this.canvas.dataset.babylonEnvironmentPremiumSurfaces = premiumSurfaces;\n      this.canvas.dataset.babylonEnvironmentMaterialDetail = 'normal+roughness+metalness:shared-premium-pbr';\n      this.canvas.dataset.environmentMachineDetail = `processor-functional:${placements.processor.length}+floor-grate:${placements.floorGrate.length}`;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "    delete this.canvas.dataset.babylonEnvironmentError;\n    void this.loadRefineryEnvironment(state, world.w, world.h, selected, generation);\n"
          new = "    delete this.canvas.dataset.babylonEnvironmentError;\n    delete this.canvas.dataset.babylonEnvironmentPremiumSurfaces;\n    delete this.canvas.dataset.babylonEnvironmentMaterialDetail;\n    void this.loadRefineryEnvironment(state, world.w, world.h, selected, generation);\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "    this.canvas.dataset.environmentTerminals = '0';\n    this.canvas.dataset.babylonEnvironmentState = 'released';\n"
          new = "    this.canvas.dataset.environmentTerminals = '0';\n    delete this.canvas.dataset.babylonEnvironmentPremiumSurfaces;\n    delete this.canvas.dataset.babylonEnvironmentMaterialDetail;\n    this.canvas.dataset.babylonEnvironmentState = 'released';\n"
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          python <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-authored-refinery.mjs')
          text = path.read_text()
          old = "        surfaceDetail: canvas.dataset.environmentSurfaceDetail ?? '',\n        machineDetail: canvas.dataset.environmentMachineDetail ?? '',\n"
          new = "        surfaceDetail: canvas.dataset.environmentSurfaceDetail ?? '',\n        premiumSurfaces: canvas.dataset.babylonEnvironmentPremiumSurfaces ?? '',\n        materialDetail: canvas.dataset.babylonEnvironmentMaterialDetail ?? '',\n        machineDetail: canvas.dataset.environmentMachineDetail ?? '',\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "      if (lastState.surfaceDetail !== 'wall-panel:6+cable-tray:6') {\n        throw new Error(`Authored Babylon refinery wall/cable detail coverage is incomplete: ${JSON.stringify(lastState)}`);\n      }\n"
          new = old + "      if (lastState.premiumSurfaces !== 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|wall-panel:bare-metal+painted-metal'\n        || lastState.materialDetail !== 'normal+roughness+metalness:shared-premium-pbr') {\n        throw new Error(`P28-B2 premium refinery surface binding is incomplete: ${JSON.stringify(lastState)}`);\n      }\n"
          assert old in text and 'P28-B2 premium refinery surface binding' not in text
          text = text.replace(old, new, 1)

          old = "console.log(`AUTHORED_REFINERY_RUNTIME_PASS lod=${lastState.lod} kit=${[...kit].sort().join(',')} instances=${lastState.instances} terminals=${lastState.terminals} landmark=${lastState.landmark} lighting=${lastState.lighting} grounding=${lastState.actorGrounding} actors=${lastState.actorGroundingActors} ibl=${lastState.ibl} post=${lastState.postStack} tier=${lastState.renderTier} frame=${lastState.renderFrameMs}ms budget=${lastState.renderBudget} canvas=${Math.round(lastState.width)}x${Math.round(lastState.height)}`);"
          new = "console.log(`AUTHORED_REFINERY_RUNTIME_PASS lod=${lastState.lod} kit=${[...kit].sort().join(',')} instances=${lastState.instances} terminals=${lastState.terminals} landmark=${lastState.landmark} premium=${lastState.premiumSurfaces} lighting=${lastState.lighting} grounding=${lastState.actorGrounding} actors=${lastState.actorGroundingActors} ibl=${lastState.ibl} post=${lastState.postStack} tier=${lastState.renderTier} frame=${lastState.renderFrameMs}ms budget=${lastState.renderBudget} canvas=${Math.round(lastState.width)}x${Math.round(lastState.height)}`);"
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          node <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.scripts['prepare:graphics-assets'] = 'node scripts/prepare-graphics-assets.mjs && node scripts/prepare-refinery-premium-surfaces.mjs && node scripts/prepare-premium-pbr-reference.mjs';
          pkg.scripts['test:graphics:content'] = 'node tests/graphics-content-assets.mjs && node tests/premium-pbr-reference.mjs && node tests/premium-pbr-library.mjs && node tests/refinery-premium-surfaces.mjs';
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run targeted B2 verification
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:graphics-assets
          node tests/refinery-premium-surfaces.mjs
          npm run test:graphics:content
          npx tsc --noEmit
          npm run build:prod

      - name: Commit B2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/prepare-refinery-premium-surfaces.mjs \
            scripts/verify-authored-refinery.mjs \
            src/game/babylonCombatRenderer.ts \
            tests/refinery-premium-surfaces.mjs \
            public/assets/models/environments/refinery-floor-panel-lod1.glb \
            public/assets/models/environments/refinery-floor-panel-lod2.glb \
            public/assets/models/environments/refinery-floor-service-grate-lod1.glb \
            public/assets/models/environments/refinery-floor-service-grate-lod2.glb \
            public/assets/models/environments/refinery-bulkhead-lod1.glb \
            public/assets/models/environments/refinery-bulkhead-lod2.glb \
            public/assets/models/environments/refinery-wall-service-panel-lod1.glb \
            public/assets/models/environments/refinery-wall-service-panel-lod2.glb
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Apply premium PBR to refinery floors and bulkheads"
          git push origin HEAD:p28-b2-refinery-floor-bulkhead-pbr
