name: P28-B4 Roadmap Closeout

on:
  push:
    branches:
      - p28-b4-refinery-machinery-materials
    paths:
      - '.github/workflows/p28b4-roadmap-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out B4 branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: p28-b4-refinery-machinery-materials

      - name: Archive completed B4 item
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roadmap = Path('docs/content-roadmap.md')
          active = roadmap.read_text()
          pattern = re.compile(r'^- \[ \] \*\*P28-B4 — Apply P28 materials to refinery machinery\*\*.*?(?=^- \[ \] \*\*P28-B5 — Add a refinery decal/trim atlas\*\*)', re.M | re.S)
          matches = pattern.findall(active)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one active P28-B4 block, got {len(matches)}')
          active = pattern.sub('', active, count=1)
          if 'P28-B4 — Apply P28 materials to refinery machinery' in active:
              raise SystemExit('P28-B4 remained in active roadmap')
          if '- [ ] **P28-B5 — Add a refinery decal/trim atlas**' not in active:
              raise SystemExit('P28-B5 did not remain active after closeout')
          roadmap.write_text(active)

          archive = Path('docs/content-roadmap-archive.md')
          archived = archive.read_text()
          if '**P28-B4 — Apply P28 materials to refinery machinery**' in archived:
              raise SystemExit('P28-B4 is already archived')
          anchor = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          if archived.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one P28 archive heading, got {archived.count(anchor)}')
          entry_lines = [
              '- [x] **P28-B4 — Apply P28 materials to refinery machinery** — Moved processors, terminals, pipe racks, service conduits, cable trays, and gantries onto the shared P28 premium PBR surface language while preserving authored transforms and gameplay bounds.',
              '  - Extended the shared surface binder across six authored machinery families and all twelve LOD1/LOD2 GLBs with deterministic UV0/tangent geometry: painted structural metal, bare shell metal, and shared emissive fixtures for authored hazard/screen elements.',
              '  - Extended selective glow to all six authored machinery emissive families while leaving HUD, enemies, hazards, objectives, loot, and interactables excluded by default.',
              '  - Added B4 machinery/LOD regression coverage and made the earlier B2/runtime bloom-source telemetry assertions extensible so later material phases can add families without weakening existing guarantees.',
              '  - Exact code candidate `d132249a245ed61dce808b4bcf29d42562751f02` passed Browser E2E run `37484917179` (desktop + mobile-landscape), P28 Image Grade Visual run `37484916740`, Build Android APK run `37484918289`, and PR Android APK run `37484917475` including API 35 product smoke, API 36 large-screen smoke, and aggregate verification.',
              '  - Verified PR artifact `ironshade-vector-pr-android-apk` (artifact `11423356717`, artifact ZIP SHA-256 `ef69abec3bbbf946149230f5545a27e02223be1630a2ee998eff310fd918758c`) contains `Ironshade-Vector-Android-Debug.apk` (10,260,395 bytes; package `app.ironshade.vector`; version `0.0.1-pr.68`; min SDK 24; target SDK 36; APK SHA-256 `8f33b41aef75d6df73d9e5c333fd1ba365dc5b500e8a73b6f3e11c6baf3dd337`; Android debug signer).',
              '  - **Next: P28-B5 — Add a refinery decal/trim atlas.**',
              '',
              '',
          ]
          entry = '\n'.join(entry_lines)
          archive.write_text(archived.replace(anchor, anchor + entry, 1))
          PY
          rm .github/workflows/p28b4-roadmap-closeout.yml
          git diff --check

      - name: Commit roadmap closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md .github/workflows/p28b4-roadmap-closeout.yml
          git diff --cached --check
          git commit -m 'Archive completed P28-B4 roadmap item'
          git push origin HEAD:p28-b4-refinery-machinery-materials
