name: P28 B3 Cleanup

on:
  push:
    branches:
      - p28-b3-refinery-cover-crate-pbr

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: p28-b3-refinery-cover-crate-pbr
          fetch-depth: 0

      - name: Remove unrelated generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          while IFS= read -r path; do
            case "$path" in
              tests/refinery-cover-crate-premium-surfaces.mjs|public/assets/models/environments/refinery-crate-lod1.glb|public/assets/models/environments/refinery-crate-lod2.glb|.github/workflows/p28-b3-cleanup.yml)
                ;;
              *)
                git rm -f -- "$path"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=A origin/main...HEAD)
          git rm -f .github/workflows/p28-b3-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clean P28-B3 generated asset staging'
          git push origin HEAD:p28-b3-refinery-cover-crate-pbr
