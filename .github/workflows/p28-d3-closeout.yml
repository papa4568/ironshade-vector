name: P28-D3 Roadmap Closeout

on:
  push:
    branches:
      - chatgpt/p28-d3-systems-operator-lod0
    paths:
      - '.github/workflows/p28-d3-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d3-systems-operator-lod0
          fetch-depth: 0

      - name: Archive P28-D3 and advance roadmap
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          roadmap = Path('docs/content-roadmap.md')
          active = roadmap.read_text()
          item = "- [ ] **P28-D3 — Ship Systems operator LOD0** — Add the Systems hero LOD0 on the same validated rig/socket/material contract with class-specific silhouette detail. **Done when:** Flagship selection, animation/socket compatibility, class readability, and standard build/APK gates pass.\n\n"
          if active.count(item) != 1:
              raise SystemExit('P28-D3 active roadmap item was not found exactly once')
          roadmap.write_text(active.replace(item, ''))
          archive = Path('docs/content-roadmap-archive.md')
          archived = archive.read_text()
          marker = '- [x] **P28-D2 — Ship Vector operator LOD0**'
          if archived.count(marker) != 1:
              raise SystemExit('P28-D2 archive insertion marker was not found exactly once')
          encoded = ''
          entry = base64.b64decode(encoded).decode('utf-8')
          archive.write_text(archived.replace(marker, entry + marker))
          PY

          node agent/tools/sync-roadmap-metadata.mjs --write

          python - <<'PY'
          import json
          from pathlib import Path
          active = Path('docs/content-roadmap.md').read_text()
          archive = Path('docs/content-roadmap-archive.md').read_text()
          metadata = json.loads(Path('agent/roadmap-metadata.json').read_text())
          assert 'P28-D3' not in active
          assert '**P28-D3 — Ship Systems operator LOD0**' in archive
          assert metadata['roadmapIds'][0] == 'P28-D4', metadata['roadmapIds'][:3]
          PY

          git diff --check

      - name: Commit roadmap closeout
        shell: bash
        run: |
          git config user.name 'papa4568'
          git config user.email 'fpspro0421@gmail.com'
          git rm .github/workflows/p28-d3-closeout.yml
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git diff --cached --check
          git commit -m 'docs: archive P28-D3 completion'
          git push origin HEAD:chatgpt/p28-d3-systems-operator-lod0
