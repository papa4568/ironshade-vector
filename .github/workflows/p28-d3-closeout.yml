name: P28-D3 Roadmap Closeout

on:
  push:
    branches:
      - chatgpt/p28-d3-systems-operator-lod0
    paths:
      - '.github/workflows/p28-d3-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d3-systems-operator-lod0
          fetch-depth: 0

      - name: Archive P28-D3 and advance roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/content-roadmap.md')
          active = roadmap.read_text()
          item = "- [ ] **P28-D3 — Ship Systems operator LOD0** — Add the Systems hero LOD0 on the same validated rig/socket/material contract with class-specific silhouette detail. **Done when:** Flagship selection, animation/socket compatibility, class readability, and standard build/APK gates pass.\n\n"
          if active.count(item) != 1:
              raise SystemExit('P28-D3 active roadmap item was not found exactly once')
          roadmap.write_text(active.replace(item, ''))

          archive = Path('docs/content-roadmap-archive.md')
          archived = archive.read_text()
          marker = '- [x] **P28-D2 — Ship Vector operator LOD0**'
          if archived.count(marker) != 1:
              raise SystemExit('P28-D2 archive insertion marker was not found exactly once')
          entry = """- [x] **P28-D3 — Ship Systems operator LOD0** — Completed 2026-10-08 with a deterministic shipping Systems hero model on the validated operator rig/socket/material contract, class-specific relay/capacitor/sensor silhouette treatment, and unchanged simulation-owned gameplay bounds.
  - Added `operator-systems-lod0.glb` plus `scripts/prepare-systems-operator-lod0.mjs`; the production build generates a 118,612-byte textured metallic/roughness PBR GLB with embedded base-color, normal, packed ORM, and emissive channels. It carries Systems-specific diagnostic chest/banks, twin relay masts and tips, capacitor pack/heat sinks, sensor crown, wrist consoles, diagnostic visor, and green diagnostic emissive identity while retaining the proven P28-D2 hard-surface geometry/material contract for this pre-heavyweight D-phase asset.
  - Preserved `operator-rig`, hip/torso/helmet/arm/leg/backpack transforms and `weapon-socket`, kept the weapon external to the operator asset, and left hitbox/gameplay-bounds ownership simulation-side. Flagship/high detail selects `operator-systems-lod0`; balanced/performance retain Systems LOD1/LOD2, while Vanguard and Vector keep their shipped LOD0 paths.
  - Added deterministic regeneration/detail/PBR/rig/socket/bounds/Babylon-loading/LOD-selection regressions and updated authored-operator runtime validation. The deterministic Flagship capture now seeds a Systems profile, reloads through Command Deck → Operations → Contracts, redeploys Deep Salvage, and explicitly requires Systems LOD0 with articulated rig and `weapon-socket` in the live high-tier scene.
  - Exact implementation head `2856b6bb667d70c827d3fe556502598e7bb4f5d0` on PR #333 passed PR Candidate Verification run `37771959936`: the single full repository verification/production build, desktop and mobile-landscape browser journeys, APK delivery/signature checks, API 35 product smoke, Android 16/API 36 large-screen smoke, aggregate Android verification, and AO-5 exact-candidate evidence all passed. Candidate web artifact `ironshade-vector-pr-candidate-web-2856b6bb667d70c827d3fe556502598e7bb4f5d0` is `11547808003` (digest `sha256:efdcc8dee90842c4a4c9e57a8f91ae4922e9ee46343b4cf442963f5fdf52798a`).
  - Deterministic Flagship evidence is tagged `p28-d3-systems-operator-lod0`; P28 Image Grade Visual run `37771959493` passed with artifact `ironshade-vector-p28a5-image-grade` (`11548297928`, digest `sha256:9a13346ca52b4bf49ab81a61af6d4bff29e0dcd6620b4585a4c3f32d9f2495ed`). Browser artifacts are desktop `11547469483` (digest `sha256:fcd908bd2039da1a5f2ad084dfbaebd720b64aba6a384c865f899fd3a399eabd`) and mobile-landscape `11547484199` (digest `sha256:9fa9f6db27a1a35574346319b8bdb1dfb25ec1d9768159954c91cd08f03d991e`).
  - Verified implementation APK artifact `ironshade-vector-pr-android-apk` (`11547889027`, artifact digest `sha256:7315e4b2ce1e923e8828d8da19aecd1344050fd07b9cf92ef0e9fa5c704af3e6`) contains `Ironshade-Vector-Android-Debug.apk` (20,087,811 bytes; package `app.ironshade.vector`; version `0.0.1-pr.62 (62)`; min SDK 24; target SDK 36; APK Signature Scheme v2 verified; APK SHA-256 `24510c9f79bc47efb29a2f4605572647abdaafd15e13bb311c4cb15b2d0be981`). API 35 artifact `11548443550` (digest `sha256:3c003683dfc2ca227c123d2410e3754d58b7cd520a094b5baa24a6e6e0b96aaa`) and API 36 artifact `11548234111` (digest `sha256:c92d3c69d103b45ad74619b27a29a2a196133fd72f013eda268b6dccc3d7aa63`) preserve emulator evidence for that same APK; candidate evidence artifact `11548354120` (digest `sha256:02276d730d0b3734d1ef4c3b0a9e2efe9935044518970b405d41e2bdf7187457`) records the exact implementation proof ledger.
  - **Next: P28-D4 — Ship assault enemy LOD0.**

"""
          archive.write_text(archived.replace(marker, entry + marker))
          PY

          node agent/tools/sync-roadmap-metadata.mjs --write
          node agent/tools/next-task.mjs | tee /tmp/next-task.txt
          grep -q 'P28-D4' /tmp/next-task.txt

          python - <<'PY'
          import json
          from pathlib import Path
          active = Path('docs/content-roadmap.md').read_text()
          archive = Path('docs/content-roadmap-archive.md').read_text()
          metadata = json.loads(Path('agent/roadmap-metadata.json').read_text())
          assert 'P28-D3' not in active
          assert '**P28-D3 — Ship Systems operator LOD0**' in archive
          assert metadata['roadmapIds'][0] == 'P28-D4', metadata['roadmapIds'][:3]
          PY

          git diff --check

      - name: Commit roadmap closeout
        shell: bash
        run: |
          git config user.name 'papa4568'
          git config user.email 'fpspro0421@gmail.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git diff --cached --check
          git commit -m 'docs: archive P28-D3 completion'
          git push origin HEAD:chatgpt/p28-d3-systems-operator-lod0
