name: Validate WebGL restart fix

on:
  push:
    branches:
      - fix/webgl-restart-context

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply restart-safe renderer cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/game/threeCombatRenderer.ts')
          text = p.read_text()
          old = "    this.renderer.dispose();\n    this.renderer.forceContextLoss();"
          new = "    this.renderer.dispose();"
          if old not in text:
              raise SystemExit('Expected renderer cleanup not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run level 15 regression and production build
        run: npm run build
      - name: Commit validated fix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/threeCombatRenderer.ts
          git commit -m 'Keep WebGL context alive across combat restart'
          git push origin HEAD:main
