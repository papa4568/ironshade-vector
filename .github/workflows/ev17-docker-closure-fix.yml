name: EV-17 Docker Closure Correction

on:
  push:
    branches:
      - agent/ev17-proof-cache-calibration
    paths:
      - '.github/workflows/ev17-docker-closure-fix.yml'

permissions:
  contents: read

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev17-proof-cache-calibration
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Apply reviewed EV-17 Docker closure correction
        run: |
          python3 agent/ev17-author-docker-closure-fix.py
          bash -n scripts/run-full-repository-build-proof.sh
          node agent/tests/causal-proof-cache.mjs
          node agent/tests/proof-cache-calibration-evidence.mjs
          git diff --check
      - name: Export full tested corrected files
        run: |
          mkdir -p .ev17-bundle/.github/workflows .ev17-bundle/agent/tests .ev17-bundle/agent/tools .ev17-bundle/docs .ev17-bundle/scripts
          cp .github/workflows/ev17-proof-cache-calibration.yml .ev17-bundle/.github/workflows/
          cp .github/workflows/pr-candidate.yml .ev17-bundle/.github/workflows/
          cp AGENTS.md .ev17-bundle/
          cp agent/proof-cache-calibration-corpus.json .ev17-bundle/agent/
          cp agent/tests/proof-cache-calibration-evidence.mjs .ev17-bundle/agent/tests/
          cp agent/tools/proof-cache-calibration-evidence.mjs .ev17-bundle/agent/tools/
          cp docs/experimental-verification-roadmap.md .ev17-bundle/docs/
          cp docs/experimental-verification-archive.md .ev17-bundle/docs/
          cp scripts/run-full-repository-build-proof.sh .ev17-bundle/scripts/
          printf '%s\n' '.github/workflows/ev17-docker-closure-fix.yml' 'agent/ev17-author-docker-closure-fix.py' > .ev17-bundle/delete-paths.txt
          find .ev17-bundle -type f -print | sort > .ev17-bundle/files.txt
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - .ev17-bundle | sha256sum > .ev17-bundle/bundle.sha256
      - name: Upload tested corrected files
        uses: actions/upload-artifact@v7
        with:
          name: ev17-docker-closure-files-${{ github.sha }}
          path: .ev17-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
