name: EV-17 Docker Closure Correction

on:
  push:
    branches:
      - agent/ev17-proof-cache-calibration
    paths:
      - '.github/workflows/ev17-docker-closure-fix.yml'

permissions:
  contents: read

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev17-proof-cache-calibration
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Apply reviewed EV-17 Docker closure correction
        run: |
          python3 agent/ev17-author-docker-closure-fix.py
          bash -n scripts/run-full-repository-build-proof.sh
          node agent/tests/causal-proof-cache.mjs
          node agent/tests/proof-cache-calibration-evidence.mjs
          git diff --check
      - name: Export exact tested patch
        run: |
          git rm .github/workflows/ev17-docker-closure-fix.yml agent/ev17-author-docker-closure-fix.py
          git add .github/workflows/pr-candidate.yml .github/workflows/ev17-proof-cache-calibration.yml AGENTS.md agent/proof-cache-calibration-corpus.json agent/tests/proof-cache-calibration-evidence.mjs agent/tools/proof-cache-calibration-evidence.mjs docs/experimental-verification-roadmap.md docs/experimental-verification-archive.md scripts/run-full-repository-build-proof.sh
          git diff --cached --check
          mkdir -p .ev17-patch
          git diff --cached --binary HEAD > .ev17-patch/ev17-docker-closure-fix.patch
          test -s .ev17-patch/ev17-docker-closure-fix.patch
          git diff --cached --name-status > .ev17-patch/name-status.txt
      - name: Upload tested patch
        uses: actions/upload-artifact@v7
        with:
          name: ev17-docker-closure-fix-${{ github.sha }}
          path: .ev17-patch/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
