name: EV-17 Contract Authoring

on:
  push:
    branches:
      - agent/ev17-proof-cache-calibration

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev17-proof-cache-calibration
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Apply EV-17 permanent contract documentation
        run: python3 agent/ev17-author-contract.py

      - name: Validate and commit contract documentation
        run: |
          set -euo pipefail
          git diff --check
          node agent/tests/proof-cache-calibration-evidence.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Document EV-17 proof-cache calibration contract'
          git push origin HEAD:agent/ev17-proof-cache-calibration
