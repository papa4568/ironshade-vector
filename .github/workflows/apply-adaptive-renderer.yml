name: Apply adaptive renderer patch

on:
  push:
    branches:
      - perf/adaptive-render-budget
    paths:
      - 'scripts/apply-adaptive-renderer.mjs'
      - '.github/workflows/apply-adaptive-renderer.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply deterministic renderer patch
        run: node scripts/apply-adaptive-renderer.mjs

      - name: Validate full production build
        run: npm run build

      - name: Verify source diff
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- package.json src/game/renderQuality.ts tests/render-performance.ts
          if git diff --quiet -- src/game/threeCombatRenderer.ts; then
            echo 'Renderer patch did not modify threeCombatRenderer.ts' >&2
            exit 1
          fi

      - name: Commit renderer integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/threeCombatRenderer.ts
          git commit -m 'Integrate adaptive Three.js render budget'
          git push origin HEAD:perf/adaptive-render-budget
