name: EV-16 Review Fix Authoring

on:
  push:
    branches:
      - agent/ev16-impact-widening

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev16-impact-widening
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Apply trusted-review correction
        run: python3 agent/ev16-review-fix.py

      - name: Run focused EV-16 regressions
        run: |
          set -euo pipefail
          node agent/tests/affected-verification.mjs
          node agent/tests/impact-widening-promotion.mjs
          node agent/tools/select-affected-verification.mjs --files src/game/babylonAbilityVfx.ts --json | grep '"mode": "full"'
          IRONSHADE_IMPACT_WIDENING_ENFORCEMENT=0 node agent/tools/select-affected-verification.mjs --files src/game/babylonAbilityVfx.ts --json | grep '"mode": "targeted"'
          git diff --check

      - name: Commit corrected implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix EV-16 low-confidence fail-safe'
          git push origin HEAD:agent/ev16-impact-widening
