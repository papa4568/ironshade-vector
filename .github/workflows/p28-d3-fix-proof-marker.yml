name: P28-D3 Proof Marker Fix
on:
  push:
    branches: [chatgpt/p28-d3-systems-operator-lod0]
    paths: ['.github/workflows/p28-d3-fix-proof-marker.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d3-systems-operator-lod0
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/p28a5-image-grade-capture.mjs')
          s=p.read_text()
          old="visualDetail: 'p28-d1-vanguard-operator-lod0'; visualDetail: 'p28-d3-systems-operator-lod0'"
          new="visualDetail: 'p28-d1-vanguard-operator-lod0'; visualDetail: 'p28-d2-vector-operator-lod0'"
          if s.count(old)!=1: raise SystemExit('unexpected proof marker history')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'papa4568'
          git config user.email 'fpspro0421@gmail.com'
          git add scripts/p28a5-image-grade-capture.mjs
          git diff --cached --check
          git commit -m 'test: preserve Vector LOD0 proof marker'
          git push origin HEAD:chatgpt/p28-d3-systems-operator-lod0
