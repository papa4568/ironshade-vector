name: P28-A0 Camera Smoke Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-camera-smoke-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct camera compact-layout expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-runtime-smoke.mjs')
          source = path.read_text()

          old = "      viewport: canvas?.dataset.babylonViewport ?? '',\n      feedback: canvas?.dataset.cameraFeedback ?? '',\n"
          new = "      viewport: canvas?.dataset.babylonViewport ?? '',\n      compactLayout: document.querySelector('.game-root')?.dataset.compactLayout === 'true',\n      feedback: canvas?.dataset.cameraFeedback ?? '',\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one Babylon viewport telemetry anchor, found {count}')
          source = source.replace(old, new, 1)

          old = "  const expectedLayout = state.rectWidth / Math.max(1, state.rectHeight) < 1.15\n    ? 'narrow'\n    : pointerProbe.coarse ? 'coarse' : 'standard';"
          new = "  const expectedNarrow = state.rectWidth / Math.max(1, state.rectHeight) < 1.35\n    || state.rectWidth < 560\n    || state.rectHeight < 340;\n  const expectedLayout = expectedNarrow\n    ? 'narrow'\n    : state.compactLayout ? 'coarse' : 'standard';"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one camera layout expectation anchor, found {count}')
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git diff --check
          node --check scripts/browser-runtime-smoke.mjs
      - name: Commit correction and retire helper
        shell: bash
        run: |
          rm .github/workflows/p28a0-camera-smoke-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-runtime-smoke.mjs .github/workflows/p28a0-camera-smoke-fix.yml
          git commit -m 'Fix P28-A0 camera layout smoke expectation'
          git push origin HEAD:main
