name: P28-A0 Camera Smoke Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-camera-smoke-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Correct camera compact-layout expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-runtime-smoke.mjs')
          source = path.read_text()

          anchor = """  const babylonCameraState = await page.evaluate(() => {
    const canvas = document.querySelector('canvas.game-canvas');
    return {
      layout: canvas?.dataset.babylonCameraLayout ?? '',
      framing: canvas?.dataset.babylonCameraFraming ?? '',
      viewport: canvas?.dataset.babylonViewport ?? '',
    };
  });
"""
          replacement = """  const babylonCameraState = await page.evaluate(() => {
    const canvas = document.querySelector('canvas.game-canvas');
    const root = document.querySelector('.game-root');
    return {
      layout: canvas?.dataset.babylonCameraLayout ?? '',
      framing: canvas?.dataset.babylonCameraFraming ?? '',
      viewport: canvas?.dataset.babylonViewport ?? '',
      compactLayout: root instanceof HTMLElement && root.dataset.compactLayout === 'true',
    };
  });
"""
          count = source.count(anchor)
          if count != 1:
              raise SystemExit(f'expected one Babylon camera state anchor, found {count}')
          source = source.replace(anchor, replacement, 1)

          old = "  const expectedLayout = expectedNarrow ? 'narrow' : pointerProbe.coarse ? 'coarse' : 'standard';"
          new = "  const expectedLayout = expectedNarrow ? 'narrow' : babylonCameraState.compactLayout ? 'coarse' : 'standard';"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one camera layout expectation anchor, found {count}')
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git diff --check
          node --check scripts/browser-runtime-smoke.mjs
      - name: Commit correction and retire helper
        shell: bash
        run: |
          rm .github/workflows/p28a0-camera-smoke-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-runtime-smoke.mjs .github/workflows/p28a0-camera-smoke-fix.yml
          git commit -m 'Fix P28-A0 camera layout smoke expectation'
          git push origin HEAD:main
