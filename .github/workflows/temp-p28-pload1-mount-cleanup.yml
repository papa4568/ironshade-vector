name: Temporary P28-PLOAD1 Mount Cleanup Patch

on:
  push:
    branches:
      - agent/p28-pload1-batched-refinery-instantiation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix temporary P28-PLOAD1 patch helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/p28-pload1-batched-refinery-instantiation
          fetch-depth: 0

      - name: Apply exact renderer cleanup fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/babylonCombatRenderer.ts')
          text = path.read_text()
          search_from = text.index("        const rejected = results.find((result): result is PromiseRejectedResult")
          start = text.index("        for (let index = 0; index < batch.length; index += 1) {", search_from)
          end_marker = "          placementCount += 1;\n        }\n"
          end = text.index(end_marker, start) + len(end_marker)
          old = text[start:end]
          if 'unmountedBatchInstances' in old:
              raise SystemExit('renderer cleanup fix is already present')

          inner = '\n'.join('  ' + line for line in old.rstrip('\n').split('\n')) + '\n'
          mounted = "              mountedInstances.push(instance);\n"
          if inner.count(mounted) != 1:
              raise SystemExit(f'expected one mounted ownership line, found {inner.count(mounted)}')
          inner = inner.replace(
              mounted,
              mounted + "              unmountedBatchInstances.delete(instance);\n",
          )
          new = (
              "        const unmountedBatchInstances = new Set(batchInstances);\n"
              "        try {\n"
              + inner
              + "        } catch (error) {\n"
              "          unmountedBatchInstances.forEach(instance => instance.release());\n"
              "          throw error;\n"
              "        }\n"
          )
          path.write_text(text[:start] + new + text[end:])
          PY

          git diff --check
          git diff -- src/game/babylonCombatRenderer.ts

      - name: Commit renderer fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/babylonCombatRenderer.ts
          git commit -m 'Release fulfilled refinery batch on mount failure'
          git push origin HEAD:agent/p28-pload1-batched-refinery-instantiation
