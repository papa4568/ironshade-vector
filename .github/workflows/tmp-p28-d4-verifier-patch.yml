name: Temporary P28-D4 verifier patch

on:
  push:
    branches:
      - chatgpt/p28-d4-assault-enemy-lod0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d4-assault-enemy-lod0
          fetch-depth: 0
      - name: Patch mixed enemy LOD expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-runtime-smoke.mjs')
          source = path.read_text()

          old = """  const expectedEnemyRoles = ['assault', 'suppressor', 'technician', 'elite'];
            const expectedEnemyAssets = expectedEnemyRoles.map(role => `enemy-${role}-lod${expectedSharedLod}`);
          """
          new = """  const expectedEnemyRoles = ['assault', 'suppressor', 'technician', 'elite'];
            const expectedEnemyLodByRole = Object.fromEntries(expectedEnemyRoles.map(role => [
              role,
              role === 'assault' && state.renderTier === 'high' ? 0 : expectedSharedLod,
            ]));
            const expectedEnemyAssets = expectedEnemyRoles.map(role => `enemy-${role}-lod${expectedEnemyLodByRole[role]}`);
            const expectedEnemyCatalogLods = [...new Set(expectedEnemyRoles.map(role => expectedEnemyLodByRole[role]))]
              .sort((left, right) => left - right)
              .join(',');
          """
          if old not in source:
              raise SystemExit('expected enemy asset block not found')
          source = source.replace(old, new, 1)

          old = "    || state.enemyCatalogLod !== String(expectedSharedLod)\n"
          new = "    || state.enemyCatalogLod !== expectedEnemyCatalogLods\n"
          if old not in source:
              raise SystemExit('enemy catalog LOD assertion not found')
          source = source.replace(old, new, 1)

          old = "    || !enemyAssets.every(asset => /^enemy-(assault|suppressor|technician|elite)-lod[12]$/.test(asset))\n"
          new = "    || !enemyAssets.every(asset => expectedEnemyAssets.includes(asset))\n"
          if old not in source:
              raise SystemExit('active enemy asset assertion not found')
          source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Commit verifier correction
        run: |
          set -euo pipefail
          git diff --check
          git diff -- scripts/browser-runtime-smoke.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/browser-runtime-smoke.mjs
          git commit -m "P28-D4 accept mixed assault enemy LOD policy"
          git push origin HEAD:chatgpt/p28-d4-assault-enemy-lod0
