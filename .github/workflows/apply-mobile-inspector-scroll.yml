name: Apply mobile inspector scroll fix

on:
  push:
    branches: [fix/mobile-inspector-scroll]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply inspector scroll fix
        run: node scripts/apply-mobile-inspector-scroll.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production build
        run: npm run build
      - name: Commit verified production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'Fix mobile item inspector scrolling'
          git push origin HEAD:fix/mobile-inspector-scroll
