name: P27 D9 Validate

on:
  push:
    branches:
      - p27-d9-babylon-cleanup
    paths:
      - '.github/workflows/p27-d9-validate.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Use npm 10.9.8
        run: npm install --global npm@10.9.8
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Android smoke contract
        run: npm run test:android-fast-smoke
      - name: Production build and regressions — pass 9
        run: npm run build
