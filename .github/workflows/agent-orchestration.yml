name: Agent Orchestration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'docs/content-roadmap.md'
      - 'docs/agent-orchestration.md'
      - 'AGENTS.md'
      - '.github/workflows/agent-orchestration.yml'
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'docs/content-roadmap.md'
      - 'docs/agent-orchestration.md'
      - 'AGENTS.md'
      - '.github/workflows/agent-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Validate orchestration task graph
        run: node agent/tools/validate-task-graph.mjs

      - name: Verify deterministic orchestration selection
        run: |
          node agent/tools/next-task.mjs
          node agent/tools/next-task.mjs --json

      - name: Run orchestration graph regressions
        run: node agent/tests/task-graph.mjs

      - name: Require roadmap metadata sync
        run: node agent/tools/sync-roadmap-metadata.mjs --check

      - name: Validate roadmap graph adapter
        run: |
          node agent/tools/roadmap-adapter.mjs --validate-only
          node agent/tools/roadmap-adapter.mjs

      - name: Run roadmap adapter regressions
        run: node agent/tests/roadmap-adapter.mjs

      - name: Validate affected-verification map
        run: node agent/tools/select-affected-verification.mjs --validate-only

      - name: Exercise deterministic affected-verification selection
        run: node agent/tools/select-affected-verification.mjs --files scripts/prepare-refinery-premium-surfaces.mjs,src/game/graphicsAssetManifest.ts --json

      - name: Run affected-verification regressions
        run: node agent/tests/affected-verification.mjs
