name: Agent Orchestration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'docs/agent-orchestration.md'
      - 'AGENTS.md'
      - '.github/workflows/agent-orchestration.yml'
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'docs/agent-orchestration.md'
      - 'AGENTS.md'
      - '.github/workflows/agent-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Validate task graph
        run: node agent/tools/validate-task-graph.mjs

      - name: Verify deterministic task selection
        run: |
          node agent/tools/next-task.mjs
          node agent/tools/next-task.mjs --json

      - name: Run orchestration regressions
        run: node agent/tests/task-graph.mjs
