name: Agent Orchestration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'docs/content-roadmap.md'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/agent-orchestration.md'
      - 'AGENTS.md'
      - '.github/workflows/agent-orchestration.yml'
      - '.github/workflows/pr-candidate.yml'
      - '.github/workflows/browser-e2e.yml'
      - '.github/workflows/pr-android-apk.yml'
      - '.github/workflows/ev9-trusted-pr-candidate-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-orchestration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      active-task: ${{ steps.evidence-task.outputs.task }}
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Install locked dependencies for runtime calibration and architecture checks
        run: npm ci --ignore-scripts

      - name: Validate orchestration task graph
        run: node agent/tools/validate-task-graph.mjs

      - name: Verify deterministic orchestration selection
        run: |
          node agent/tools/next-task.mjs
          node agent/tools/next-task.mjs --json

      - name: Run orchestration graph regressions
        run: node agent/tests/task-graph.mjs

      - name: Require roadmap metadata sync
        run: node agent/tools/sync-roadmap-metadata.mjs --check

      - name: Validate roadmap graph adapter
        run: |
          node agent/tools/roadmap-adapter.mjs --validate-only
          node agent/tools/roadmap-adapter.mjs

      - name: Run roadmap adapter regressions
        run: node agent/tests/roadmap-adapter.mjs

      - name: Run acceptance attack compiler shadow regressions
        env:
          ACCEPTANCE_ATTACK_EVIDENCE_DIR: .agent-attacks
        run: node agent/tests/acceptance-attack-compiler.mjs

      - name: Run promoted acceptance attack regressions
        run: node agent/tests/acceptance-attack-promotion.mjs

      - name: Enforce promoted acceptance attack scope
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node agent/tools/acceptance-attack-gate.mjs gate \
            --candidate-sha "$CANDIDATE_SHA" \
            --policy agent/acceptance-attack-policy.json \
            --output .agent-attacks/promotion-gate.json

      - name: Upload acceptance attack advisory and enforcement evidence
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-attack-shadow-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-attacks/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Run causal evidence independence regressions
        run: node agent/tests/evidence-independence.mjs

      - name: Run promoted causal evidence independence regressions
        run: |
          node agent/tests/evidence-independence-promotion.mjs
          node agent/tests/pr-candidate-head-observer.mjs

      - name: Record causal evidence independence advisory report
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node agent/tools/evidence-independence.mjs \
            --graph agent/evidence-independence.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-independence/report.json

      - name: Enforce promoted causal evidence independence scope
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node agent/tools/evidence-independence-promotion-gate.mjs gate \
            --candidate-sha "$CANDIDATE_SHA" \
            --graph agent/evidence-independence.json \
            --policy agent/evidence-independence-policy.json \
            --output .agent-independence/promotion-gate.json

      - name: Upload causal evidence independence advisory and enforcement evidence
        uses: actions/upload-artifact@v7
        with:
          name: causal-evidence-independence-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-independence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Run repository immune system regressions
        run: node agent/tests/repository-immune-system.mjs

      - name: Record repository immune system advisory report
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node agent/tools/repository-immune-system.mjs analyze \
            --memory agent/failure-memory.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-immune/report.json

      - name: Upload repository immune system advisory evidence
        uses: actions/upload-artifact@v7
        with:
          name: repository-immune-system-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-immune/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Run causal proof cache shadow regressions
        run: node agent/tests/causal-proof-cache.mjs

      - name: Validate exact-SHA causal proof cache history
        run: node agent/tools/causal-proof-cache.mjs history-check

      - name: Run roadmap shadow simulator regressions
        run: node agent/tests/roadmap-shadow-simulator.mjs

      - name: Require exact-SHA EV-10 calibration proof
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node agent/tests/behavioral-genome-calibration.mjs
          mkdir -p .agent-genome-calibration
          node agent/tools/behavioral-genome-calibration.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-genome-calibration/calibration.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.agent-genome-calibration/calibration.json', 'utf8'));
          const expectedSha = process.env.CANDIDATE_SHA;
          const requiredDomains = ['load', 'mission', 'performance', 'presentation', 'resources', 'simulation'];
          const fail = message => { throw new Error(`EV10_CALIBRATION_PROOF_FAIL ${message}`); };
          if (report.candidateSha !== expectedSha) fail(`candidateSha expected=${expectedSha} actual=${report.candidateSha}`);
          if (report.mode !== 'advisory' || report.blocking !== false) fail('report must remain advisory and non-blocking');
          if (report.calibrationPass !== true) fail('representative calibration must pass its zero-error budgets');
          if (report.falsePositives !== 0 || report.falseNegatives !== 0) fail(`errors fp=${report.falsePositives} fn=${report.falseNegatives}`);
          if (report.acceptedForEnforcement !== false || report.candidatePassGranted !== false) fail('report must not grant enforcement or candidate acceptance');
          if (JSON.stringify(report.validatedDomains) !== JSON.stringify(requiredDomains)) fail(`validatedDomains=${JSON.stringify(report.validatedDomains)}`);
          console.log(`EV10_CALIBRATION_PROOF_PASS candidate=${report.candidateSha} falsePositives=0 falseNegatives=0 domains=${report.validatedDomains.join(',')} blocking=${report.blocking}`);
          NODE

      - name: Upload exact-SHA EV-10 calibration proof
        uses: actions/upload-artifact@v7
        with:
          name: behavioral-genome-calibration-proof-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-genome-calibration/calibration.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Validate affected-verification map
        run: node agent/tools/select-affected-verification.mjs --validate-only

      - name: Exercise deterministic affected-verification selection
        run: node agent/tools/select-affected-verification.mjs --files scripts/prepare-refinery-premium-surfaces.mjs,src/game/graphicsAssetManifest.ts --json

      - name: Run affected-verification regressions
        run: node agent/tests/affected-verification.mjs

      - name: Run candidate evidence regressions
        run: node agent/tests/candidate-evidence.mjs

      - name: Run candidate artifact integrity regressions
        run: node agent/tests/candidate-artifact.mjs

      - name: Enforce single-producer CI proof reuse contract
        run: node agent/tests/ci-proof-reuse.mjs

      - name: Enforce mechanical architecture invariants
        run: |
          node agent/tools/check-architecture-invariants.mjs
          node agent/tests/architecture-invariants.mjs

      - name: Run independent verifier gate regressions
        run: |
          node agent/tools/select-review-task.mjs --json
          node agent/tests/independent-review.mjs
          node agent/tests/trusted-main-review-gate.mjs

      - name: Verify trusted EV-9 observer bootstrap
        run: node agent/tools/ev9-trusted-pr-candidate-observer-v8.mjs self-test

      - name: Detect active orchestration evidence task
        id: evidence-task
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const graph = JSON.parse(readFileSync('agent/task-graph.json', 'utf8'));
          const task = graph.tasks.find(entry => entry.status === 'active' || entry.status === 'verifying');
          appendFileSync(process.env.GITHUB_OUTPUT, `task=${task?.id ?? ''}\n`);
          console.log(`ACTIVE_EVIDENCE_TASK ${task?.id ?? 'none'}`);
          NODE

      - name: Generate and validate exact candidate manifest
        if: github.event_name == 'pull_request' && steps.evidence-task.outputs.task != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node agent/tools/candidate-evidence.mjs manifest \
            --task active \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$HEAD_BRANCH" \
            --output .agent-evidence/candidate-manifest.json
          node agent/tools/candidate-evidence.mjs validate \
            --manifest .agent-evidence/candidate-manifest.json \
            --verify-git

  record-agent-candidate-evidence:
    needs: validate-agent-orchestration
    if: github.event_name == 'pull_request' && needs.validate-agent-orchestration.outputs.active-task != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Generate exact candidate manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node agent/tools/candidate-evidence.mjs manifest \
            --task active \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$HEAD_BRANCH" \
            --output .agent-evidence/candidate-manifest.json

      - name: Record only orchestration-owned proof evidence
        run: |
          node agent/tools/candidate-evidence.mjs ledger \
            --manifest .agent-evidence/candidate-manifest.json \
            --pass-kinds test,invariant \
            --workflow 'Agent Orchestration' \
            --run-id "$GITHUB_RUN_ID" \
            --job 'validate-agent-orchestration' \
            --allow-incomplete \
            --output .agent-evidence/verification-ledger.json

      - name: Validate partial candidate evidence without crediting downstream CI or review
        run: |
          node agent/tools/candidate-evidence.mjs validate \
            --manifest .agent-evidence/candidate-manifest.json \
            --ledger .agent-evidence/verification-ledger.json \
            --verify-git \
            --allow-incomplete

      - name: Upload partial candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: agent-candidate-evidence-partial-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .agent-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
