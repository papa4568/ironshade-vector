name: Full engineering audit fixes

on:
  push:
    branches:
      - fix/full-engineering-audit

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-engineering-audit
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply audited repairs
        run: |
          node .github/scripts/apply-full-audit-fixes.mjs
          sed -i 's/[[:space:]]\+$//' src/App.tsx

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full production regression build
        run: npm run build

      - name: Commit validated repairs to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src netlify tests package.json
          git diff --cached --check
          git commit -m 'Fix audit findings across runtime and persistence'
          git push origin HEAD:fix/full-engineering-audit
