name: Temporary P28-D4 roadmap closeout

on:
  push:
    branches:
      - chatgpt/p28-d4-assault-enemy-lod0

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d4-assault-enemy-lod0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Archive verified P28-D4 delivery
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/content-roadmap.md')
          text = roadmap.read_text()
          item = "- [ ] **P28-D4 — Ship assault enemy LOD0** — Add a hero-near-camera LOD0 for the common assault enemy family without changing hitboxes, targeting, or lifecycle cues. **Done when:** Flagship uses the LOD0 where appropriate, telegraphs/status/lifecycle overlays still align, and standard build/APK gates pass.\n\n"
          if text.count(item) != 1:
              raise SystemExit('P28-D4 active roadmap item not found exactly once')
          roadmap.write_text(text.replace(item, '', 1))

          archive = Path('docs/content-roadmap-archive.md')
          text = archive.read_text()
          marker = "## P28 — Babylon flagship visual-quality overhaul\n\n"
          if text.count(marker) != 1:
              raise SystemExit('P28 archive insertion marker not found exactly once')
          entry = """- [x] **P28-D4 — Ship assault enemy LOD0** — Completed 2026-10-08 with a deterministic authored assault LOD0 that upgrades the common close-range enemy silhouette while preserving the shared enemy rig/socket contract, simulation-owned hitboxes/gameplay bounds, and all combat-presentation ownership boundaries.
            - Added `enemy-assault-lod0.glb` plus `scripts/prepare-assault-enemy-lod0.mjs`; the production build generates a 116,504-byte textured metallic/roughness PBR GLB with 53 authored nodes, 592 source triangles, 1,820 instantiated mesh-node triangles, embedded base-color/normal/packed-ORM/emissive channels, assault chest/brace/backpack silhouette detail, and no embedded weapon.
            - Preserved `enemy-rig`, hip/torso/helmet/arm/leg/backpack transforms and `weapon-socket`; hitbox/gameplay-bounds ownership stays simulation-side. Flagship/high detail selects `enemy-assault-lod0`; balanced/performance retain assault LOD1/LOD2, while suppressor, technician, elite, and boss remain on their existing tiers for P28-D5 through P28-D8.
            - Added deterministic regeneration/detail/PBR/rig/socket/bounds/Babylon-loading/LOD-selection regressions and corrected the browser parity gate to validate the intentional mixed enemy LOD catalog. Deterministic Flagship evidence explicitly requires `enemy-assault-lod0,enemy-suppressor-lod1,enemy-technician-lod1,enemy-elite-lod1`, `enemyCatalogLod=0,1`, zero authored-enemy fallbacks, and read-only telegraph/status/lifecycle presentation ownership/alignment.
            - Exact implementation head `3a4b922a01893d2860ab062d4bcc3e91e40e868d` on PR #334 passed PR Candidate Verification run `37791511366`: the single full repository verification/production build, desktop and mobile-landscape browser journeys, APK delivery/signature checks, API 35 product smoke, Android 16/API 36 large-screen smoke, aggregate Android verification, and AO-5 exact-candidate evidence all passed. Candidate web artifact `ironshade-vector-pr-candidate-web-3a4b922a01893d2860ab062d4bcc3e91e40e868d` is `11557150836` (digest `sha256:aefe8e9c29577cba504cbf1f07329acf13cf88f0b8716e9ccfc055961406df49`).
            - Deterministic Flagship evidence is tagged `p28-d4-assault-enemy-lod0`; P28 Image Grade Visual run `37791510968` passed with artifact `ironshade-vector-p28a5-image-grade` (`11557538017`, digest `sha256:a8b940be94af720f312568878f65f46c4bf4f8cba884ba8967d10e6cdf1d8c63`). Browser artifacts are desktop `11557341522` (digest `sha256:0ed7164c04d37265db4c6f0ea9c39357d30558dde2ea9d240b2d960c8d68d409`) and mobile-landscape `11557711074` (digest `sha256:d72d37746574d0c1b300b8b76c2b00a5f7855a18c3a3adf11e4cfb1ed164ebbe`).
            - Verified implementation APK artifact `ironshade-vector-pr-android-apk` (`11557595206`, artifact digest `sha256:7035f5eff90d09176202cf26e0e9f680de3f1c0c59b4b951018b788987538292`) contains `Ironshade-Vector-Android-Debug.apk` (10,532,657 bytes; package `app.ironshade.vector`; version `0.0.1-pr.75 (75)`; min SDK 24; target SDK 36; APK Signature Scheme v2 verified; APK SHA-256 `a1f600f87b391228249f9ad0e242f19da87fa0db439d8a11f72f7fbc36a102ec`). API 35 artifact `11556769093` (digest `sha256:8bf53d280a6cab9ca732a2dffa950888b90f2fefe96287be3edda3f0935c8f0b`) and API 36 artifact `11557047569` (digest `sha256:656c3ecfa904c5a59205397c38ffa3175ce632efc5cf3e20456ff2a132b16db0`) preserve emulator evidence for that same APK; candidate evidence artifact `11556928030` (digest `sha256:8c563fdfea3822ee9e34f41c500e562498b473b9c02368342f779a56cc1db3e8`) records the exact implementation proof ledger.
            - **Next: P28-D5 — Ship suppressor enemy LOD0.**

          """
          archive.write_text(text.replace(marker, marker + entry, 1))
          PY
      - name: Sync and validate roadmap metadata
        run: |
          set -euo pipefail
          node agent/tools/sync-roadmap-metadata.mjs
          node agent/tools/sync-roadmap-metadata.mjs --check
          node agent/tools/roadmap-adapter.mjs --validate-only
          node agent/tests/roadmap-adapter.mjs
          node agent/tests/task-graph.mjs
      - name: Commit verified closeout
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git commit -m "P28-D4 archive verified delivery"
          git push origin HEAD:chatgpt/p28-d4-assault-enemy-lod0
