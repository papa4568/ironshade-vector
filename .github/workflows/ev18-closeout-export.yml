name: EV-18 Closeout Archive Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ev18-closeout-export.yml'

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ github.event.pull_request.number == 406 && github.head_ref == 'agent/ev18-closeout' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Write EV-18 closeout state
        env:
          EV18_ARCHIVE_APPEND_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import os
          import re

          archive_path = Path("docs/experimental-verification-archive.md")
          roadmap_path = Path("docs/experimental-verification-roadmap.md")
          archive = archive_path.read_text()
          roadmap = roadmap_path.read_text()

          expected_archive = "23a3237267d01be7975c98bb3785675bdbc12e72fff3b5e1c05ca3ec61903677"
          expected_roadmap = "a80dfd9d608c78fe15a81d0f2d099a76da5b186e0269e5aa399413ff2043ba31"
          if hashlib.sha256(archive.encode()).hexdigest() != expected_archive:
              raise SystemExit("unexpected archive source digest")
          if hashlib.sha256(roadmap.encode()).hexdigest() != expected_roadmap:
              raise SystemExit("unexpected roadmap source digest")

          append = base64.b64decode(os.environ["EV18_ARCHIVE_APPEND_B64"]).decode()
          if "## EV-18 — Reuse One Validated Proof Class" in archive:
              raise SystemExit("EV-18 already archived")
          archive_new = archive + append
          if not archive_new.startswith(archive):
              raise SystemExit("archive prefix changed")

          pattern = re.compile(
              r"- \[ \] \*\*EV-18 — Reuse One Validated Proof Class\*\*\n"
              r"(?:  - .*\n)+\n",
              re.M,
          )
          match = pattern.search(roadmap)
          if not match:
              raise SystemExit("EV-18 active block not found")
          roadmap_new = roadmap[:match.start()] + roadmap[match.end():]

          old_dep = (
              "EV-27, EV-26, and EV-28 have completed their trusted-main closeouts, clearing the "
              "mechanism-governance availability, unchanged-roadmap review-selection, and prepared-image "
              "closure-identity blockers. EV-18 is therefore the resumed active experimental item and must "
              "prove live unchanged-SHA first-miss/second-hit reuse before completion."
          )
          new_dep = (
              "EV-27, EV-26, and EV-28 completed their trusted-main closeouts, clearing the "
              "mechanism-governance availability, unchanged-roadmap review-selection, and prepared-image "
              "closure-identity blockers. EV-18 then completed the reviewed single-proof promotion and a live "
              "unchanged-SHA first-miss/second-hit reuse demonstration for `full-repository-build-closed`. "
              "EV-19 — Validate EV-7 Roadmap Shadow Predictions is therefore the next actionable experimental item; "
              "EV-20 remains dependent on EV-19 evidence."
          )
          if old_dep not in roadmap_new:
              raise SystemExit("expected dependency text not found")
          roadmap_new = roadmap_new.replace(old_dep, new_dep, 1)

          if "- [ ] **EV-18" in roadmap_new:
              raise SystemExit("EV-18 remained active")
          if roadmap_new.count("- [ ] **EV-19") != 1:
              raise SystemExit("EV-19 queue state invalid")
          if archive_new.count("## EV-18 — Reuse One Validated Proof Class") != 1:
              raise SystemExit("EV-18 archive count invalid")

          archive_path.write_text(archive_new)
          roadmap_path.write_text(roadmap_new)
          PY

          git rm .ev18-live-reuse-witness .github/workflows/ev18-closeout-export.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".ev18-live-reuse-witness .github/workflows/ev18-closeout-export.yml docs/experimental-verification-archive.md docs/experimental-verification-roadmap.md "
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/experimental-verification-archive.md docs/experimental-verification-roadmap.md
          git commit -m "docs: archive EV-18 proof reuse promotion"
          git push origin HEAD:${{ github.head_ref }}
