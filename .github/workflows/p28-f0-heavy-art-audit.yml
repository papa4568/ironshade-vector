name: P28-F0 Exact APK Art Audit

on:
  pull_request:
    branches: [main]
    paths:
      - tools/heavy-asset-manifest.mjs
      - tests/heavy-asset-manifest.mjs
      - tests/graphics-content-assets.mjs
      - tests/graphics-runtime-assets.mjs

permissions:
  actions: read
  contents: read

jobs:
  audited-art-payload:
    name: Exact-head GLB/KTX2/PNG APK payload
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Find exact candidate web and Android artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          for attempt in $(seq 1 260); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=30")"
            run_id="$(jq -r '[.workflow_runs[] | select(.name=="PR Candidate Verification")]|sort_by(.run_number)|last|.id // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
              run_status="$(jq -r .status <<<"$details")"
              run_conclusion="$(jq -r '.conclusion // empty' <<<"$details")"
              if [[ "$run_status" == completed && "$run_conclusion" != success ]]; then
                echo "::error::PR Candidate Verification failed ($run_conclusion); no APK proof"
                exit 1
              fi
              artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
              web_name="ironshade-vector-pr-candidate-web-$HEAD_SHA"
              web_count="$(jq --arg n "$web_name" '[.artifacts[]|select(.name==$n and .expired==false)]|length' <<<"$artifacts")"
              apk_count="$(jq '[.artifacts[]|select(.name=="ironshade-vector-pr-android-apk" and .expired==false)]|length' <<<"$artifacts")"
              if [[ "$web_count" == 1 && "$apk_count" == 1 ]]; then
                echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
                echo "P28_F0_APK_PROVENANCE candidate=$HEAD_SHA sourceRun=$run_id"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "::error::Exact-candidate web/APK artifacts not available"
          exit 1

      - name: Download exact candidate web bundle
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.artifacts.outputs.run-id }}
          github-token: ${{ github.token }}
          name: ironshade-vector-pr-candidate-web-${{ github.event.pull_request.head.sha }}

      - name: Download same-run Android APK
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.artifacts.outputs.run-id }}
          github-token: ${{ github.token }}
          name: ironshade-vector-pr-android-apk

      - name: Verify source-bound bundle and APK art bytes
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node agent/tools/candidate-artifact.mjs validate \
            --candidate "$HEAD_SHA" \
            --dist dist \
            --manifest .candidate-artifact/candidate-web.json
          test -s Ironshade-Vector-Android-Debug.apk
          node tools/heavy-asset-manifest.mjs apk
          test -s p28-f0-heavy-asset-apk.json

      - name: Upload exact APK art breakdown
        uses: actions/upload-artifact@v7
        with:
          name: p28-f0-heavy-art-apk-${{ github.event.pull_request.head.sha }}
          path: p28-f0-heavy-asset-apk.json
          if-no-files-found: error
          retention-days: 30
