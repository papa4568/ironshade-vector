name: P28-A0 Quality Assertion Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-quality-assertions-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use locked npm
        run: npm install --global npm@10.9.8
      - name: Migrate renderer quality-source assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          replacement_count = 0
          for path in sorted(Path('tests').glob('babylon-*.ts')):
              source = path.read_text()
              lines = source.splitlines(keepends=True)
              updated_lines = []
              file_changes = 0
              for line in lines:
                  updated = line
                  source_assertion = ('assert.match(rendererSource' in line or 'assert.match(babylonRendererSource' in line)
                  if source_assertion and 'new ' in line and 'coarse' in line:
                      updated = line.replace('coarse', 'qualityCoarse')
                  if updated != line:
                      file_changes += 1
                  updated_lines.append(updated)
              if file_changes:
                  path.write_text(''.join(updated_lines))
                  changed.append(str(path))
                  replacement_count += file_changes
          if replacement_count < 4:
              raise SystemExit(f'expected at least four stale Babylon renderer quality-source assertions, found {replacement_count}')
          print(f'P28_A0_ASSERTION_MIGRATION files={len(changed)} replacements={replacement_count}')
          for path in changed:
              print(path)
          PY
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit migration and retire helper
        shell: bash
        run: |
          rm .github/workflows/p28a0-quality-assertions-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/p28a0-quality-assertions-fix.yml
          git commit -m 'Align Babylon quality assertions with flagship policy'
          git push origin HEAD:main
