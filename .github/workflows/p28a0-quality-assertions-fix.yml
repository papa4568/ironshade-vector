name: P28-A0 Quality Assertion Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-quality-assertions-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Migrate renderer quality-source assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          replacement_count = 0
          for path in sorted(Path('tests').glob('babylon-*.ts')):
              source = path.read_text()
              updated = source.replace('scene, canvas, coarse\\)', 'scene, canvas, qualityCoarse\\)')
              updated = updated.replace('scene, canvas, coarse\\,', 'scene, canvas, qualityCoarse\\,')
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))
                  replacement_count += source.count('scene, canvas, coarse\\)') + source.count('scene, canvas, coarse\\,')
          if replacement_count < 1:
              raise SystemExit('expected at least one stale Babylon renderer quality-source assertion')
          print(f'P28_A0_ASSERTION_MIGRATION files={len(changed)} replacements={replacement_count}')
          for path in changed:
              print(path)
          PY
          git diff --check
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit migration and retire helper
        shell: bash
        run: |
          rm .github/workflows/p28a0-quality-assertions-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/p28a0-quality-assertions-fix.yml
          git commit -m 'Align Babylon quality assertions with flagship policy'
          git push origin HEAD:main
