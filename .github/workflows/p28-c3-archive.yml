name: P28 C3 archive completion

on:
  push:
    branches:
      - chatgpt/p28-c3-refinery-pipe-cable-lod0
    paths:
      - .github/workflows/p28-c3-archive.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p28-c3-refinery-pipe-cable-lod0
          fetch-depth: 0
      - name: Add P28-C3 archive evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          archive_path = Path('docs/content-roadmap-archive.md')
          helper_path = Path('.github/workflows/p28-c3-archive.yml')
          archive = archive_path.read_text()
          marker = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          exact = '- [x] **P28-C3 — Add LOD0 refinery pipe and cable modules**'
          if exact not in archive:
              if marker not in archive:
                  raise SystemExit('P28 archive marker not found')
              block = dedent('''\
              - [x] **P28-C3 — Add LOD0 refinery pipe and cable modules** — added deterministic Flagship LOD0 variants for refinery pipe rack and cable tray families with materially richer mechanical layering while preserving stable identity pivots, existing gameplay/placement bounds, lower-LOD recovery, and premium PBR material contracts.
                - Added `scripts/prepare-refinery-pipe-cable-lod0.mjs` and wired it through `scripts/prepare-graphics-assets.mjs`. Pipe rack LOD0 adds layered pipe runs, clamps/fittings, braces/supports; cable tray LOD0 adds layered rails, rungs/support brackets, cable bundle detail. Both retain identity `environment-root` pivots and unchanged authored gameplay bounds.
                - Updated `src/game/graphics/assetManifest.ts` so Flagship/high detail selects `refinery-pipe-rack-lod0` and `refinery-cable-tray-lod0` before existing LOD1/LOD2 recovery, reusing the shared P28 premium PBR material bindings.
                - Extended `tests/refinery-machinery-premium-surfaces.mjs` and `tests/babylon-graphics-assets.ts` to verify deterministic regeneration, stable bounds/pivots, indexed POSITION/NORMAL/TANGENT/TEXCOORD_0 payloads, richer mechanical detail, premium materials, Flagship manifest selection, and Babylon GLB loading.
                - Exact implementation head `d5a10baaefdba9623fa9a1e8a48e81d9478067f6` passed Browser E2E run `37558624374` on desktop and mobile-landscape, P28 Image Grade Visual run `37558624344`, and PR Android APK run `37558624349` including full repository verification, native Android build and delivery checks, API 35 product smoke, API 36 large-screen smoke, and aggregate Android verification.
                - Deterministic content evidence: pipe rack / cable tray LOD0 assets are 97,544 / 75,048 bytes and 576 / 428 triangles respectively; `BABYLON_GRAPHICS_ASSETS_PASS` selects both for Flagship and `REFINERY_MACHINERY_PREMIUM_SURFACES_PASS` reports unchanged bounds with stable pivots across the machinery set.
                - Verified PR artifact `ironshade-vector-pr-android-apk` (artifact `11456016941`, artifact digest `sha256:a030843dbb916517fac16dc7a05cde8216360fba70b42ca81ce3d96e8482f395`) contains `Ironshade-Vector-Android-Debug.apk` (10,374,236 bytes; package `app.ironshade.vector`; version `0.0.1-pr.119 (119)`; min SDK 24; target/compile SDK 36; APK Signature Scheme v2 verified; signer SHA-256 `7cafe8377e225c340000e842885cc3e58f762954328bdf34511aa2f4fd7f1945`; APK SHA-256 `b369077a6f486cf955e9e1e1caa90ad26309537c6ce7e58fcfae8520bcd2c99c`).
                - **Next: P28-C4 — Add LOD0 refinery conduit and gantry modules.**

              ''')
              archive_path.write_text(archive.replace(marker, marker + block, 1))
          helper_path.unlink()
          PY
      - name: Commit archive closeout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content-roadmap-archive.md .github/workflows/p28-c3-archive.yml
          git diff --cached --check
          git commit -m "docs: archive P28-C3 completion evidence"
          git push origin HEAD:chatgpt/p28-c3-refinery-pipe-cable-lod0
