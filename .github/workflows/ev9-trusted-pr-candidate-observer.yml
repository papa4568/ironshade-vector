name: EV-9 Trusted PR Candidate Observer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ev9-trusted-pr-candidate-observer.yml'
      - 'agent/tools/ev9-trusted-pr-candidate-observer.mjs'
      - 'agent/task-graph.json'
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  self-test:
    if: inputs.candidate_sha == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out bootstrap candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Verify trusted observer parser and attack calibration
        run: node agent/tools/ev9-trusted-pr-candidate-observer.mjs self-test

  verify-observer-source:
    if: inputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted observer revision
        uses: actions/checkout@v7
        with:
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact candidate object
        shell: /usr/bin/bash -e {0}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: git fetch --no-tags --force origin "$CANDIDATE_SHA"
      - name: Verify trusted exact-head observation
        shell: /usr/bin/node {0}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_WORKFLOW_REF: ${{ job.workflow_ref }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          import './agent/tools/ev9-trusted-pr-candidate-observer.mjs';
          const module = await import('./agent/tools/ev9-trusted-pr-candidate-observer.mjs');
          module.verify();
