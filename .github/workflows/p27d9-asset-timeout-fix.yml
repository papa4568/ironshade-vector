name: P27-D9 Asset Timeout Fix

on:
  push:
    branches:
      - p27d9-clean
    paths:
      - '.github/workflows/p27d9-asset-timeout-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean D9 branch
        uses: actions/checkout@v7
        with:
          ref: p27d9-clean
          fetch-depth: 0
      - name: Build corrected Android smoke blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/android-runtime-smoke.mjs')
          source = path.read_text()
          replacements = {
              "})()`, 'Android Vanguard authored mobile assets', 20_000);": "})()`, 'Android Vanguard authored mobile assets', 90_000);",
              "await waitFor(`document.querySelector('canvas')?.dataset.bossEnvironmentFx === 'phase-reactive-ready'`, 'post-P20-E Asteroid Refinery authored asset verification state', 45_000);": "await waitFor(`document.querySelector('canvas')?.dataset.bossEnvironmentFx === 'phase-reactive-ready'`, 'post-P20-E Asteroid Refinery authored asset verification state', 90_000);",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'expected timeout target not found: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          jq -Rs '{content: ., encoding: "utf-8"}' scripts/android-runtime-smoke.mjs > /tmp/blob.json
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob.json)"
          echo "$response"
          echo "ANDROID_RUNTIME_SMOKE_BLOB_SHA=$(jq -r '.sha' <<<"$response")"
