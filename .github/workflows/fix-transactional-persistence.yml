name: Apply transactional persistence fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-transactional-persistence.yml'
      - 'scripts/apply-transactional-persistence.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply transactional persistence fix
        run: node scripts/apply-transactional-persistence.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate complete production build
        run: npm run build
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit verified fix
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/App.tsx src/game/gamePersistence.ts src/game/saveRecovery.ts tests/gameplay-regressions.ts scripts/apply-transactional-persistence.mjs .github/workflows/fix-transactional-persistence.yml
          git commit -m 'Make profile and campaign persistence transactional'
          git push origin HEAD:main
