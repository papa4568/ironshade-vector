name: P27-D9 Fast ACT Smoke Fix

on:
  push:
    branches:
      - p27d9-clean
    paths:
      - .github/workflows/p27d9-fast-act-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: p27d9-clean
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Patch deterministic ACT touch traversal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/android-runtime-smoke.mjs')
          text = path.read_text()
          old = """    const nearStartRefineryTarget = /^(grid-isolator-a|gravity-control-a|salvage-node-a)$/.test(state.targetId);\n    const direction = nearStartRefineryTarget && movementAttempt < 8 ? 'DOWN' : (state.direction || 'DOWN');\n    const duration = state.range > 700 ? 300 : state.range > 350 ? 220 : state.range > 160 ? 150 : 90;\n"""
          new = """    const direction = state.direction || 'DOWN';\n    const duration = state.range > 700 ? 1_200 : state.range > 350 ? 850 : state.range > 160 ? 550 : 320;\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one fast ACT traversal block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          npm ci --no-audit --no-fund
          npm run test:android-fast-smoke
          git diff --check
      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p27d9-fast-act-fix.yml
          git add scripts/android-runtime-smoke.mjs
          git commit -m 'Stabilize fast Android ACT traversal'
          git push origin HEAD:p27d9-clean
