name: P28-A0 Browser QA Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-browser-qa-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate flagship phone downgrades by measured pressure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-runtime-smoke.mjs')
          source = path.read_text()

          telemetry_old = "      renderTier: canvas?.dataset.renderTier ?? '',\n      graphicsQuality: canvas?.dataset.graphicsQuality ?? '',\n"
          telemetry_new = "      renderTier: canvas?.dataset.renderTier ?? '',\n      graphicsQuality: canvas?.dataset.graphicsQuality ?? '',\n      renderQualityInput: canvas?.dataset.renderQualityInput ?? '',\n      renderDeviceClassPolicy: canvas?.dataset.renderDeviceClassPolicy ?? '',\n      renderDowngradeReason: canvas?.dataset.renderDowngradeReason ?? '',\n"
          if telemetry_old not in source:
              raise SystemExit('P28-A0 browser telemetry anchor not found')
          source = source.replace(telemetry_old, telemetry_new, 1)

          assertion_old = "  if (viewportMode === 'mobile-landscape' && state.renderTier !== 'high') {\n    throw new Error('P28-A0 flagship phone render tier must start High without measured pressure: ' + JSON.stringify(state));\n  }\n"
          assertion_new = "  if (viewportMode === 'mobile-landscape') {\n    const flagshipInput = /^requested:[0-9]+\\.[0-9]{2}\\+effective:1\\.00$/.test(state.renderQualityInput);\n    const devicePolicy = /^flagship-default(?::coarse-hint-ignored)?$/.test(state.renderDeviceClassPolicy);\n    const downgradeMatchesTier = state.renderTier === 'high'\n      ? state.renderDowngradeReason === 'none'\n      : state.renderDowngradeReason === 'sustained-frame-pressure';\n    if (!flagshipInput || !devicePolicy || !downgradeMatchesTier) {\n      throw new Error('P28-A0 flagship phone quality must ignore device class and only downgrade under measured pressure: ' + JSON.stringify(state));\n    }\n  }\n"
          if assertion_old not in source:
              raise SystemExit('P28-A0 stale flagship phone assertion not found')
          source = source.replace(assertion_old, assertion_new, 1)

          path.write_text(source)
          print('P28_A0_BROWSER_PRESSURE_GATE migrated=1')
          PY
          git diff --check
          git diff -- scripts/browser-runtime-smoke.mjs
      - name: Commit migrated QA contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-runtime-smoke.mjs
          git commit -m 'P28-A0 validate mobile downgrade cause in browser QA'
          git push origin HEAD:main
