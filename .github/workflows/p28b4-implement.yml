name: P28-B4 Implementation

on:
  push:
    branches:
      - p28-b4-refinery-machinery-materials
    paths:
      - '.github/workflows/p28b4-implement.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out B4 branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: p28-b4-refinery-machinery-materials

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: npm install --global npm@10.9.8

      - name: Implement premium refinery machinery surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch anchor missing in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one patch anchor in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          renderer = Path('src/game/babylonCombatRenderer.ts')
          old_surface_block = """const REFINERY_PREMIUM_SURFACE_ASSIGNMENTS: Partial<Record<RefineryFamilyKey, Readonly<Record<string, PremiumPbrSurfaceId>>>> = {
            floor: {
              'refinery-structural': 'deck-plate',
              'refinery-shell': 'bare-metal',
            },
            floorGrate: {
              'refinery-structural': 'bare-metal',
              'refinery-shell': 'painted-metal',
            },
            bulkhead: {
              'refinery-structural': 'painted-metal',
              'refinery-shell': 'painted-metal',
            },
            wallPanel: {
              'refinery-structural': 'bare-metal',
              'refinery-shell': 'painted-metal',
            },
            crate: {
              'refinery-structural': 'bare-metal',
              'refinery-shell': 'painted-metal',
              'refinery-hazard-emissive': 'polymer-rubber',
            },
          };
          const REFINERY_PREMIUM_SURFACE_ORDER: readonly RefineryFamilyKey[] = ['floor', 'floorGrate', 'bulkhead', 'wallPanel', 'crate'];
          const REFINERY_PREMIUM_SURFACE_LABELS: Partial<Record<RefineryFamilyKey, string>> = {
            floor: 'floor',
            floorGrate: 'floor-grate',
            bulkhead: 'bulkhead',
            wallPanel: 'wall-panel',
            crate: 'crate',
          };
          const REFINERY_PREMIUM_SURFACE_TELEMETRY = 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|wall-panel:bare-metal+painted-metal|crate:bare-metal+painted-metal+polymer-rubber';
          """
          machinery_assignment = """{
              'refinery-structural': 'painted-metal',
              'refinery-shell': 'bare-metal',
              'refinery-hazard-emissive': 'emissive-fixture',
              'refinery-screen-emissive': 'emissive-fixture',
            }"""
          new_surface_block = f"""const REFINERY_PREMIUM_SURFACE_ASSIGNMENTS: Partial<Record<RefineryFamilyKey, Readonly<Record<string, PremiumPbrSurfaceId>>>> = {{
            floor: {{
              'refinery-structural': 'deck-plate',
              'refinery-shell': 'bare-metal',
            }},
            floorGrate: {{
              'refinery-structural': 'bare-metal',
              'refinery-shell': 'painted-metal',
            }},
            bulkhead: {{
              'refinery-structural': 'painted-metal',
              'refinery-shell': 'painted-metal',
            }},
            processor: {machinery_assignment},
            pipeRack: {machinery_assignment},
            wallPanel: {{
              'refinery-structural': 'bare-metal',
              'refinery-shell': 'painted-metal',
            }},
            cableTray: {machinery_assignment},
            serviceConduit: {machinery_assignment},
            gantry: {machinery_assignment},
            crate: {{
              'refinery-structural': 'bare-metal',
              'refinery-shell': 'painted-metal',
              'refinery-hazard-emissive': 'polymer-rubber',
            }},
            terminal: {machinery_assignment},
          }};
          const REFINERY_PREMIUM_SURFACE_ORDER: readonly RefineryFamilyKey[] = [
            'floor',
            'floorGrate',
            'bulkhead',
            'processor',
            'pipeRack',
            'wallPanel',
            'cableTray',
            'serviceConduit',
            'gantry',
            'crate',
            'terminal',
          ];
          const REFINERY_PREMIUM_SURFACE_LABELS: Partial<Record<RefineryFamilyKey, string>> = {{
            floor: 'floor',
            floorGrate: 'floor-grate',
            bulkhead: 'bulkhead',
            processor: 'processor',
            pipeRack: 'pipe-rack',
            wallPanel: 'wall-panel',
            cableTray: 'cable-tray',
            serviceConduit: 'service-conduit',
            gantry: 'gantry',
            crate: 'crate',
            terminal: 'terminal',
          }};
          const REFINERY_PREMIUM_SURFACE_TELEMETRY = 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|processor:bare-metal+emissive-fixture+painted-metal|pipe-rack:bare-metal+emissive-fixture+painted-metal|wall-panel:bare-metal+painted-metal|cable-tray:bare-metal+emissive-fixture+painted-metal|service-conduit:bare-metal+emissive-fixture+painted-metal|gantry:bare-metal+emissive-fixture+painted-metal|crate:bare-metal+painted-metal+polymer-rubber|terminal:bare-metal+emissive-fixture+painted-metal';
          """
          replace_once(renderer, old_surface_block, new_surface_block)
          replace_once(renderer, 'Incomplete P28-B2/B3 premium surface binding:', 'Incomplete P28-B2/B3/B4 premium surface binding:')

          prepare = Path('scripts/prepare-refinery-premium-surfaces.mjs')
          machinery_targets = """export const REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS = [
            { family: 'processor', phase: 'P28-B4', relativePath: 'environments/refinery-processor-lod1.glb' },
            { family: 'processor', phase: 'P28-B4', relativePath: 'environments/refinery-processor-lod2.glb' },
            { family: 'pipeRack', phase: 'P28-B4', relativePath: 'environments/refinery-pipe-rack-lod1.glb' },
            { family: 'pipeRack', phase: 'P28-B4', relativePath: 'environments/refinery-pipe-rack-lod2.glb' },
            { family: 'cableTray', phase: 'P28-B4', relativePath: 'environments/refinery-cable-tray-lod1.glb' },
            { family: 'cableTray', phase: 'P28-B4', relativePath: 'environments/refinery-cable-tray-lod2.glb' },
            { family: 'serviceConduit', phase: 'P28-B4', relativePath: 'environments/refinery-service-conduit-lod1.glb' },
            { family: 'serviceConduit', phase: 'P28-B4', relativePath: 'environments/refinery-service-conduit-lod2.glb' },
            { family: 'gantry', phase: 'P28-B4', relativePath: 'environments/refinery-smelter-gantry-lod1.glb' },
            { family: 'gantry', phase: 'P28-B4', relativePath: 'environments/refinery-smelter-gantry-lod2.glb' },
            { family: 'terminal', phase: 'P28-B4', relativePath: 'environments/refinery-terminal-lod1.glb' },
            { family: 'terminal', phase: 'P28-B4', relativePath: 'environments/refinery-terminal-lod2.glb' },
          ];

          """
          replace_once(prepare, '];\n\nfunction bytes(view) {', '];\n\n' + machinery_targets + 'function bytes(view) {')
          replace_once(
              prepare,
              '    ironshadeP28B2SurfaceGeometry: {',
              "    [target.phase === 'P28-B4' ? 'ironshadeP28B4MachinerySurfaceGeometry' : 'ironshadeP28B2SurfaceGeometry']: {",
          )
          replace_once(
              prepare,
              '  for (const target of REFINERY_PREMIUM_SURFACE_TARGETS) {',
              '  for (const target of [...REFINERY_PREMIUM_SURFACE_TARGETS, ...REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS]) {',
          )
          replace_once(
              prepare,
              "console.log('[graphics] P28-B2 premium refinery surface geometry '",
              "console.log('[graphics] P28-B2/B4 premium refinery surface geometry '",
          )

          expected_telemetry_old = 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|wall-panel:bare-metal+painted-metal|crate:bare-metal+painted-metal+polymer-rubber'
          expected_telemetry_new = 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|processor:bare-metal+emissive-fixture+painted-metal|pipe-rack:bare-metal+emissive-fixture+painted-metal|wall-panel:bare-metal+painted-metal|cable-tray:bare-metal+emissive-fixture+painted-metal|service-conduit:bare-metal+emissive-fixture+painted-metal|gantry:bare-metal+emissive-fixture+painted-metal|crate:bare-metal+painted-metal+polymer-rubber|terminal:bare-metal+emissive-fixture+painted-metal'
          replace_once('scripts/verify-authored-refinery.mjs', expected_telemetry_old, expected_telemetry_new)
          replace_once('scripts/verify-authored-refinery.mjs', 'P28-B2/B3 premium refinery surface binding is incomplete', 'P28-B2/B3/B4 premium refinery surface binding is incomplete')

          replace_once(
              'src/game/refineryBloomProfile.ts',
              "  return label === 'refinery-terminal' || label === 'refinery-processor';",
              "  return ['refinery-terminal', 'refinery-processor', 'refinery-pipe-rack', 'refinery-cable-tray', 'refinery-service-conduit', 'refinery-smelter-gantry'].includes(label);",
          )
          replace_once(
              'src/game/babylonRefineryPostProcessing.ts',
              "const REFINERY_BLOOM_SOURCE_NAME = /(refinery-(terminal|processor)|p27-b6-muzzle-(flash|core))/i;",
              "const REFINERY_BLOOM_SOURCE_NAME = /(refinery-(terminal|processor|pipe|cable-tray|service-conduit|smelter-gantry)|p27-b6-muzzle-(flash|core))/i;",
          )
          replace_once(
              'src/game/babylonRefineryPostProcessing.ts',
              "this.canvas.dataset.environmentBloomSources = 'babylon-included:' + sourceCount + '+authored:processor+terminal+muzzle';",
              "this.canvas.dataset.environmentBloomSources = 'babylon-included:' + sourceCount + '+authored:processor+terminal+pipe+cable-tray+service-conduit+gantry+muzzle';",
          )
          replace_once(
              'tests/refinery-bloom.ts',
              "assert(isRefineryBloomAssetLabel('refinery-terminal') && isRefineryBloomAssetLabel('refinery-processor'), 'authored emissives must remain explicit bloom sources');",
              "for (const source of ['refinery-terminal', 'refinery-processor', 'refinery-pipe-rack', 'refinery-cable-tray', 'refinery-service-conduit', 'refinery-smelter-gantry']) assert(isRefineryBloomAssetLabel(source), `authored machinery emissive must remain an explicit bloom source: ${source}`);",
          )

          replace_once(
              'package.json',
              'node tests/refinery-cover-crate-premium-surfaces.mjs\"',
              'node tests/refinery-cover-crate-premium-surfaces.mjs && node tests/refinery-machinery-premium-surfaces.mjs\"',
          )

          Path('tests/refinery-machinery-premium-surfaces.mjs').write_text(r'''import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import {
            REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS,
            upgradeRefineryPremiumSurfaceGlb,
          } from '../scripts/prepare-refinery-premium-surfaces.mjs';

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          function parseGlb(buffer, label) {
            assert(buffer.toString('ascii', 0, 4) === 'glTF', `${label}: invalid GLB magic`);
            assert(buffer.readUInt32LE(4) === 2, `${label}: expected glTF 2.0`);
            assert(buffer.readUInt32LE(8) === buffer.length, `${label}: byte length mismatch`);
            const jsonLength = buffer.readUInt32LE(12);
            assert(buffer.readUInt32LE(16) === 0x4e4f534a, `${label}: missing JSON chunk`);
            return JSON.parse(buffer.subarray(20, 20 + jsonLength).toString('utf8').trim());
          }

          const expectedFamilies = ['processor', 'pipeRack', 'cableTray', 'serviceConduit', 'gantry', 'terminal'];
          const expectedMaterials = [
            'refinery-structural',
            'refinery-shell',
            'refinery-hazard-emissive',
            'refinery-screen-emissive',
          ];
          const representativeNodes = {
            processor: { name: 'refinery-processor-core', translation: [0, 1.55, 0], scale: [1.9, 2.5, 1.55] },
            pipeRack: { name: 'refinery-pipe-main-a', translation: [0, 1.12, 0.38], scale: [3.7, 0.18, 0.18] },
            cableTray: { name: 'refinery-cable-tray-spine', translation: [0, 1.34, 0], scale: [0.14, 0.16, 3.2] },
            serviceConduit: { name: 'refinery-service-conduit-trunk', translation: [0, 0.30, 0], scale: [2.8, 0.18, 0.22] },
            gantry: { name: 'refinery-smelter-gantry-beam', translation: [0, 3.46, 0], scale: [5.8, 0.46, 0.82] },
            terminal: { name: 'refinery-terminal-console', translation: [0.20, 1.34, 0], scale: [0.72, 0.24, 0.88] },
          };

          assert(REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS.length === expectedFamilies.length * 2, `Expected 12 machinery LOD targets, got ${REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS.length}`);
          assert(JSON.stringify([...new Set(REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS.map(target => target.family))]) === JSON.stringify(expectedFamilies), 'Machinery target families changed');

          for (const target of REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS) {
            const path = resolve(process.cwd(), 'public/assets/models', target.relativePath);
            const bytes = await readFile(path);
            const gltf = parseGlb(bytes, target.relativePath);
            const rebuilt = upgradeRefineryPremiumSurfaceGlb(bytes, target);
            assert(bytes.equals(rebuilt), `${target.relativePath}: P28-B4 geometry upgrade is not deterministic/idempotent`);
            const marker = gltf.extras?.ironshadeP28B4MachinerySurfaceGeometry;
            assert(marker?.family === target.family, `${target.relativePath}: P28-B4 machinery marker is missing`);
            assert(marker?.gameplayBoundsChanged === false, `${target.relativePath}: gameplay bounds must remain unchanged`);
            assert(JSON.stringify(gltf.accessors?.[0]?.min) === JSON.stringify([-0.5, -0.5, -0.5]), `${target.relativePath}: position minimum changed`);
            assert(JSON.stringify(gltf.accessors?.[0]?.max) === JSON.stringify([0.5, 0.5, 0.5]), `${target.relativePath}: position maximum changed`);
            for (const mesh of gltf.meshes ?? []) {
              for (const primitive of mesh.primitives ?? []) {
                assert(primitive.attributes?.TANGENT === 2, `${target.relativePath}: TANGENT is missing`);
                assert(primitive.attributes?.TEXCOORD_0 === 3, `${target.relativePath}: TEXCOORD_0 is missing`);
                assert(primitive.indices === 4, `${target.relativePath}: index topology changed`);
              }
            }
            assert(JSON.stringify((gltf.materials ?? []).map(material => material.name)) === JSON.stringify(expectedMaterials), `${target.relativePath}: authored material slots changed`);
            const expected = representativeNodes[target.family];
            const node = (gltf.nodes ?? []).find(candidate => candidate.name === expected.name);
            assert(node, `${target.relativePath}: representative machinery node ${expected.name} is missing`);
            assert(JSON.stringify(node.translation) === JSON.stringify(expected.translation), `${target.relativePath}: ${expected.name} translation changed`);
            assert(JSON.stringify(node.scale) === JSON.stringify(expected.scale), `${target.relativePath}: ${expected.name} scale changed`);
          }

          const renderer = await readFile(resolve(process.cwd(), 'src/game/babylonCombatRenderer.ts'), 'utf8');
          const library = await readFile(resolve(process.cwd(), 'src/game/babylonPremiumPbrSurfaceLibrary.ts'), 'utf8');
          const post = await readFile(resolve(process.cwd(), 'src/game/babylonRefineryPostProcessing.ts'), 'utf8');
          const verifier = await readFile(resolve(process.cwd(), 'scripts/verify-authored-refinery.mjs'), 'utf8');
          const telemetry = 'floor:bare-metal+deck-plate|floor-grate:bare-metal+painted-metal|bulkhead:painted-metal|processor:bare-metal+emissive-fixture+painted-metal|pipe-rack:bare-metal+emissive-fixture+painted-metal|wall-panel:bare-metal+painted-metal|cable-tray:bare-metal+emissive-fixture+painted-metal|service-conduit:bare-metal+emissive-fixture+painted-metal|gantry:bare-metal+emissive-fixture+painted-metal|crate:bare-metal+painted-metal+polymer-rubber|terminal:bare-metal+emissive-fixture+painted-metal';
          for (const family of ['processor', 'pipeRack', 'cableTray', 'serviceConduit', 'gantry', 'terminal']) {
            assert(renderer.includes(`${family}: {`), `Renderer premium surface assignment is missing ${family}`);
          }
          assert(renderer.includes("'refinery-structural': 'painted-metal'") && renderer.includes("'refinery-shell': 'bare-metal'"), 'Machinery metal separation is missing');
          assert(renderer.includes("'refinery-hazard-emissive': 'emissive-fixture'") && renderer.includes("'refinery-screen-emissive': 'emissive-fixture'"), 'Machinery emissive slots are not using the shared emissive fixture');
          assert(renderer.includes(telemetry) && verifier.includes(telemetry), 'P28-B4 live machinery material telemetry is incomplete');
          assert(library.includes("id: 'emissive-fixture'") && library.includes('emissiveUrl:'), 'Shared emissive fixture material lost its emissive texture');
          assert(post.includes('refinery-(terminal|processor|pipe|cable-tray|service-conduit|smelter-gantry)'), 'Selective bloom does not include P28-B4 machinery emissive families');
          assert(post.includes('excludeByDefault: true'), 'Selective bloom protection contract changed');

          console.log(`REFINERY_MACHINERY_PREMIUM_SURFACES_PASS targets=${REFINERY_MACHINERY_PREMIUM_SURFACE_TARGETS.length} families=${expectedFamilies.join('+')} surfaces=painted-metal+bare-metal+emissive-fixture bounds=unchanged bloom=selective`);
          ''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate authored graphics assets
        run: npm run prepare:graphics-assets

      - name: Run P28-B4 targeted checks
        run: |
          set -euo pipefail
          node tests/refinery-machinery-premium-surfaces.mjs
          npm run test:refinery-bloom
          npm run test:graphics:content
          npx tsc --noEmit
          npm run build:prod
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/game/babylonCombatRenderer.ts \
            src/game/babylonRefineryPostProcessing.ts \
            src/game/refineryBloomProfile.ts \
            scripts/prepare-refinery-premium-surfaces.mjs \
            scripts/verify-authored-refinery.mjs \
            tests/refinery-bloom.ts \
            tests/refinery-machinery-premium-surfaces.mjs \
            package.json \
            public/assets/models/environments/refinery-processor-lod1.glb \
            public/assets/models/environments/refinery-processor-lod2.glb \
            public/assets/models/environments/refinery-pipe-rack-lod1.glb \
            public/assets/models/environments/refinery-pipe-rack-lod2.glb \
            public/assets/models/environments/refinery-cable-tray-lod1.glb \
            public/assets/models/environments/refinery-cable-tray-lod2.glb \
            public/assets/models/environments/refinery-service-conduit-lod1.glb \
            public/assets/models/environments/refinery-service-conduit-lod2.glb \
            public/assets/models/environments/refinery-smelter-gantry-lod1.glb \
            public/assets/models/environments/refinery-smelter-gantry-lod2.glb \
            public/assets/models/environments/refinery-terminal-lod1.glb \
            public/assets/models/environments/refinery-terminal-lod2.glb
          git diff --cached --check
          git commit -m 'Apply premium PBR to refinery machinery'
          git push origin HEAD:p28-b4-refinery-machinery-materials
