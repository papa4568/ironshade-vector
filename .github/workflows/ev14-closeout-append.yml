name: EV-14 Closeout Archive Append

on:
  push:
    branches:
      - agent/ev14-promote-candidate-artifact-antibody

permissions:
  contents: write

jobs:
  append-and-remove-self:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch head
        uses: actions/checkout@v7
        with:
          ref: agent/ev14-promote-candidate-artifact-antibody
          fetch-depth: 0

      - name: Append EV-14 archive record without rewriting prior history
        run: |
          set -euo pipefail
          if grep -q '^## EV-14 — Promote One Accepted Antibody$' docs/experimental-verification-archive.md; then
            echo 'EV-14 archive record already exists; refusing duplicate append.' >&2
            exit 1
          fi
          cat >> docs/experimental-verification-archive.md <<'EOF'

## EV-14 — Promote One Accepted Antibody

Completed 2026-10-14 as the first narrow enforced promotion of an EV-4 repository-immune-system antibody. The original EV-4 prototype, EV-12 recurrence calibration, and EV-13 governance records above remain unchanged history.

