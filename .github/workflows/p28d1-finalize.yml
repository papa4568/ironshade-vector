name: P28-D1 finalize source

on:
  push:
    branches: [chatgpt/p28-d1-vanguard-lod0]
    paths:
      - 'scripts/p28d1-finalize-source.mjs'
      - '.github/workflows/p28d1-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d1-vanguard-lod0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - run: node scripts/p28d1-finalize-source.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/graphicsAssetManifest.ts scripts/prepare-vanguard-operator-lod0.mjs scripts/browser-runtime-smoke.mjs scripts/p28a5-image-grade-capture.mjs public/assets/models/operators/operator-vanguard-lod0.glb
          git diff --cached --check
          git commit -m 'P28-D1 finalize Vanguard LOD0 candidate source'
          git push origin HEAD:${GITHUB_REF_NAME}
