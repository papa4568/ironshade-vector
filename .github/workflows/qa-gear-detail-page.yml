name: QA dedicated gear detail page

on:
  push:
    branches:
      - fix/gear-detail-page

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply dedicated gear page change
        run: python .github/scripts/apply-gear-detail.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full production validation
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start client
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/ironshade-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ironshade-vite.log
          exit 1
      - name: Verify dedicated gear page
        run: node .github/scripts/qa-gear-detail.mjs
      - name: Commit verified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Armory.tsx src/part12.css tests/ui-readability.ts
          git diff --cached --check
          git commit -m 'Replace gear inspector with dedicated detail page'
          git push origin HEAD:fix/gear-detail-page
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gear-detail-page-qa
          path: qa-artifacts/gear-detail-page
          if-no-files-found: warn
