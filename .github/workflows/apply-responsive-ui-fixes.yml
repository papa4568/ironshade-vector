name: Apply responsive UI fixes

on:
  push:
    branches:
      - fix/responsive-overlays
    paths:
      - 'scripts/apply-responsive-ui-fixes.mjs'
      - '.github/workflows/apply-responsive-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply responsive UI patch
        run: node scripts/apply-responsive-ui-fixes.mjs

      - name: Validate full production build
        run: npm run build

      - name: Verify focused UI diff
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- package.json src/components tests/client-bundle-budget.mjs
          git diff --name-only
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/equipmentBay.css src/part4.css tests/ui-readability.ts | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected files changed:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit responsive UI fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/equipmentBay.css src/part4.css tests/ui-readability.ts
          git commit -m 'Fix responsive mission and gear overlays'
          git push origin HEAD:fix/responsive-overlays
