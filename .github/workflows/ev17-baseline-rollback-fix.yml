name: EV-17 Baseline Rollback Fix

on:
  push:
    branches:
      - agent/ev17-proof-cache-calibration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev17-proof-cache-calibration
          fetch-depth: 0
      - name: Apply exact-head baseline rollback correction
        run: python3 agent/ev17-fix-baseline-rollback.py
      - name: Validate and commit correction
        run: |
          set -euo pipefail
          git diff --check
          node agent/tests/proof-cache-calibration-evidence.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore exact candidate after EV-17 baseline proof'
          git push origin HEAD:agent/ev17-proof-cache-calibration
