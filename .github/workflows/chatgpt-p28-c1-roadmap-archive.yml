name: ChatGPT P28-C1 Roadmap Archive

on:
  push:
    branches:
      - chatgpt/p28-c1-refinery-floor-lod0

permissions:
  contents: write

jobs:
  archive-roadmap:
    if: github.ref == 'refs/heads/chatgpt/p28-c1-refinery-floor-lod0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move verified C1 to archive
        shell: python
        run: |
          from pathlib import Path

          roadmap_path = Path('docs/content-roadmap.md')
          archive_path = Path('docs/content-roadmap-archive.md')
          roadmap = roadmap_path.read_text()
          archive = archive_path.read_text()

          c1_active = """- [ ] **P28-C1 — Add LOD0 refinery floor modules** — Author and register full-detail LOD0 variants for the refinery floor panel and service grate families. Keep LOD1/LOD2 only as optional recovery assets. **Done when:** Flagship selects the LOD0 assets, panel/bevel/grate depth is visibly improved, asset bounds/loading/compression tests pass, and standard build/APK gates pass.\n\n"""

          c1_archive = """- [x] **P28-C1 — Add LOD0 refinery floor modules** — added deterministic Flagship LOD0 floor panel and service-grate assets with non-box hard-surface depth while preserving the existing refinery gameplay footprint, pivot, lower-LOD recovery path, and premium material/decal contracts.\n  - Added `scripts/refineryFloorLod0.mjs` and wired it through `scripts/prepare-graphics-assets.mjs`. `refinery-floor-panel-lod0.glb` uses chamfered/inset geometry with four panel-seam details; `refinery-floor-service-grate-lod0.glb` adds true frame/slat depth and support framing. Both retain the 3.8×3.8 footprint and identity root/pivot.\n  - Updated the model manifest so Flagship/high detail selects LOD0 before LOD1/LOD2, while lower tiers retain existing LOD1/LOD2 recovery. Carried the B6 Deep Salvage route decals onto LOD0 and preserved premium PBR material slot names so the shared KTX2 PBR library binds unchanged.\n  - Extended `tests/babylon-graphics-assets.ts` and `tests/refinery-premium-surfaces.mjs` plus live authored-refinery/browser assertions to verify deterministic rebuilds, bounds/pivots, indexed POSITION/NORMAL/TANGENT/TEXCOORD_0 payloads, premium material bindings, LOD0 selection, C1 detail density, asset byte budgets, `lod=0,1` runtime residency, and Flagship's required LOD0 presence.\n  - Exact implementation head `41e989dfb4d835646433a2b4708327a9f29ba7a7` passed Browser E2E run `37549034933` on desktop and mobile-landscape, P28 Image Grade Visual run `37549034958`, and PR Android APK run `37549034909` including full repository verification, native Android generation, APK build/sign/delivery checks, API 35 product smoke, API 36 large-screen smoke, and aggregate Android verification.\n  - Deterministic content evidence: the final decal-bearing floor panel/grate are 38,068 / 44,928 bytes and 194 / 228 triangles respectively; `BABYLON_GRAPHICS_ASSETS_PASS` selects `refinery-floor-panel-lod0` and `refinery-floor-service-grate-lod0` for Flagship; the live browser reports `lod=0,1` with `p28-c1-refinery-floor-lod0`.\n  - Verified PR artifact `ironshade-vector-pr-android-apk` (artifact `11451674281`, artifact digest `sha256:542a86895bd710e55fba099d4a3cfc1ed734109b1eb3a8741d6c2661b98527cf`) contains `Ironshade-Vector-Android-Debug.apk` (10,329,991 bytes; package `app.ironshade.vector`; version `0.0.1-pr.108 (108)`; min SDK 24; target/compile SDK 36; APK Signature Scheme v2 verified; signer SHA-256 `80344ee22df6c834b7135039bdf8127b015b860bf84bf2aa4c05fcd929709055`; APK SHA-256 `ce64a032b48f8c222e5d09beb8a012b6d7c5464e5e865765fd06b6b7b8996a46`).\n  - **Next: P28-C2 — Add LOD0 refinery wall modules.**\n\n"""

          if c1_active in roadmap:
              roadmap = roadmap.replace(c1_active, '', 1)
          elif '**P28-C1 — Add LOD0 refinery floor modules**' in roadmap:
              raise SystemExit('C1 is present in active roadmap but exact verified block did not match')

          marker = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          if c1_archive not in archive:
              if archive.count(marker) != 1:
                  raise SystemExit(f'expected one P28 archive marker, found {archive.count(marker)}')
              archive = archive.replace(marker, marker + c1_archive, 1)

          roadmap_path.write_text(roadmap)
          archive_path.write_text(archive)

      - name: Commit roadmap archive
        run: |
          if git diff --quiet -- docs/content-roadmap.md docs/content-roadmap-archive.md; then
            echo "C1 roadmap bookkeeping already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content-roadmap.md docs/content-roadmap-archive.md
          git commit -m "docs: archive verified P28-C1"
          git push origin HEAD:chatgpt/p28-c1-refinery-floor-lod0
