name: EV-21 Proof Cache Closure Calibration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agent/proof-cache.json'
      - 'agent/proof-cache-history.json'
      - 'agent/proof-cache-closure-calibration-corpus.json'
      - 'agent/tools/causal-proof-cache.mjs'
      - 'agent/tools/proof-cache-closure-calibration-evidence.mjs'
      - 'agent/tests/causal-proof-cache.mjs'
      - 'agent/tests/proof-cache-calibration-evidence.mjs'
      - 'agent/tests/proof-cache-closure-calibration-evidence.mjs'
      - 'scripts/prepare-full-repository-build-proof-closed.sh'
      - 'scripts/run-full-repository-build-proof-closed.sh'
      - '.github/workflows/ev21-proof-cache-closure-calibration.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - 'agent/proof-cache.json'
      - 'agent/proof-cache-history.json'
      - 'agent/proof-cache-closure-calibration-corpus.json'
      - 'agent/tools/causal-proof-cache.mjs'
      - 'agent/tools/proof-cache-closure-calibration-evidence.mjs'
      - 'agent/tests/causal-proof-cache.mjs'
      - 'agent/tests/proof-cache-calibration-evidence.mjs'
      - 'agent/tests/proof-cache-closure-calibration-evidence.mjs'
      - 'scripts/prepare-full-repository-build-proof-closed.sh'
      - 'scripts/run-full-repository-build-proof-closed.sh'
      - '.github/workflows/ev21-proof-cache-closure-calibration.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  calibrate:
    name: Exact Candidate Proof Cache Closure Calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run proof-cache contract regressions
        run: |
          node agent/tests/causal-proof-cache.mjs
          node agent/tests/proof-cache-calibration-evidence.mjs
          node agent/tests/proof-cache-closure-calibration-evidence.mjs
          node agent/tools/causal-proof-cache.mjs history-check

      - name: Generate exact-SHA EV-21 closure evidence
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p .agent-proof-cache-closure-evidence-ev21
          node agent/tools/proof-cache-closure-calibration-evidence.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-proof-cache-closure-evidence-ev21/calibration.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.agent-proof-cache-closure-evidence-ev21/calibration.json', 'utf8'));
          const fail = message => { throw new Error(`EV21_EXACT_EVIDENCE_FAIL ${message}`); };
          if (report.schema !== 'ironshade-proof-cache-closure-calibration:v1' || report.schemaVersion !== 1) fail('report schema drifted');
          if (report.taskId !== 'EV-21' || report.promotionTarget !== 'EV-18' || report.candidateSha !== process.env.CANDIDATE_SHA) fail('task/promotion/candidate binding mismatch');
          if (report.mode !== 'advisory' || report.acceptedForReuse !== false || report.acceptedForEnforcement !== false || report.candidatePassGranted !== false) fail('EV-21 must remain advisory and grant no acceptance');
          if (report.proofId !== 'full-repository-build-closed') fail('unexpected proof class');
          if (JSON.stringify(report.eligibleProofClasses) !== JSON.stringify(['full-repository-build-closed']) || report.unresolvedProofClasses.length !== 0) fail('EV-21 did not identify exactly one eligible class');
          if (report.trials.length !== 4 || report.metrics.falseHits !== 0 || report.metrics.falseMisses !== 1 || report.metrics.sameClosureRunCount !== 2 || report.metrics.sameClosureDisagreements !== 0 || report.metrics.historicalSameClosureDisagreements !== 0) fail('false-hit/false-miss/same-closure metrics drifted');
          if (report.metrics.invalidationDefectCount !== 1 || report.metrics.detectedInvalidationDefectCount !== 1) fail('representative defect invalidation was not detected');
          const audit = report.closureAudit;
          const expectedBound = ['docker-base-image-identity','prepared-toolchain-image-identity','npm-cli-artifact-identity','docker-engine-version','installed-dependency-tree-identity'];
          if (JSON.stringify(audit.boundInputs.map(entry => entry.id)) !== JSON.stringify(expectedBound) || !audit.boundInputs.every(entry => entry.captured === true) || audit.requiredBoundInputsClosed !== true || audit.missingBoundInputs.length !== 0) fail('runtime identity binding incomplete');
          if (audit.identityInvalidationControls.length !== 5 || !audit.identityInvalidationControls.every(entry => entry.invalidatesClosure === true) || audit.identityInvalidationControlsPass !== true) fail('identity dimensions do not all invalidate the closure');
          if (audit.eliminatedInputs.externalNetworkAvailability !== true || audit.eliminatedInputs.npmRegistryResponseIdentity !== true) fail('EV-17 external closure gaps were not eliminated');
          if (audit.profilesInRepositoryClosurePass !== true || audit.authoritativeProducerUnchanged !== true) fail('profile closure or calibration-only boundary failed');
          if (audit.preflightManifest.networkPhase !== 'completed-before-cache-decision' || audit.preflightManifest.buildNetwork !== 'none' || !/^sha256:[a-f0-9]{64}$/.test(audit.preflightManifest.preparedImageId) || JSON.stringify(audit.preflightManifest.registryResultBoundBy) !== JSON.stringify(['npmCliTreeSha256','dependencyTreeSha256'])) fail('preflight/build causal boundary drifted');
          const sameClosure = report.trials.find(entry => entry.kind === 'same-closure-control');
          if (!sameClosure || sameClosure.targetPaths.length !== 7 || sameClosure.prediction !== 'hit' || sameClosure.outcome !== 'success' || sameClosure.proofActuallyRerun !== true) fail('same-closure control incomplete');
          const defect = report.trials.find(entry => entry.kind === 'invalidation-defect');
          if (!defect || defect.prediction !== 'miss' || defect.outcome !== 'failure' || defect.classification !== 'correct-invalidation') fail('defect invalidation control incomplete');
          if (report.rollback.proofReuseEnabled !== false || report.rollback.authoritativeProducerChanged !== false || report.rollback.closedProofClassShadowOnly !== true || report.rollback.sourceMutationsRestored !== true || report.rollback.exactHeadRestored !== true || report.rollback.trackedStateClean !== true || report.rollback.preparedStateRemoved !== true) fail('rollback/exact-head contract failed');
          console.log(`EV21_EXACT_EVIDENCE_PASS candidate=${report.candidateSha} proof=${report.proofId} fp=${report.metrics.falseHits} fn=${report.metrics.falseMisses} disagreements=${report.metrics.sameClosureDisagreements} eligible=${report.eligibleProofClasses.join(',')} reuse=false`);
          NODE

      - name: Upload exact-SHA EV-21 closure evidence
        uses: actions/upload-artifact@v7
        with:
          name: proof-cache-closure-calibration-ev21-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-proof-cache-closure-evidence-ev21/calibration.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
