name: Apply Operations trace race fix

on:
  push:
    paths:
      - '.github/workflows/fix-operations-trace-race.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Operations trace race fix
        run: node scripts/apply-operations-trace-race.mjs
      - name: Install dependencies
        run: npm install
      - name: Validate complete production build
        run: npm run build
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Remove migration helpers
        run: rm scripts/apply-operations-trace-race.mjs .github/workflows/fix-operations-trace-race.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prevent stale Operations trace responses'
          git push
