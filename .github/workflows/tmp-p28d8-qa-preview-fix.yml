name: P28-D8 QA Preview Maintenance

on:
  push:
    branches:
      - chatgpt/p28-d8-refinery-boss-lod0
    paths:
      - 'scripts/tmp-p28d8-qa-preview-fix.mjs'
      - '.github/workflows/tmp-p28d8-qa-preview-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d8-refinery-boss-lod0
          fetch-depth: 0

      - name: Apply D8 QA preview fix
        run: node scripts/tmp-p28d8-qa-preview-fix.mjs

      - name: Commit fix
        run: |
          set -euo pipefail
          git diff --check
          git add src/game/babylonRefineryBossPresentation.ts scripts/p28d8-boss-capture.mjs tests/refinery-boss-lod0.mjs
          if git diff --cached --quiet; then
            echo 'P28-D8 QA preview fix already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: lock D8 QA preview to flagship boss asset'
          git push origin HEAD:chatgpt/p28-d8-refinery-boss-lod0
