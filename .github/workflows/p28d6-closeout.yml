name: P28-D6 roadmap closeout

# Retry after tightening the completed-entry assertion.
on:
  push:
    branches:
      - chatgpt/p28-d6-technician-enemy-lod0
    paths:
      - .github/workflows/p28d6-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive verified task
        run: python scripts/p28d6-closeout.py
      - name: Synchronize roadmap metadata
        run: node agent/tools/sync-roadmap-metadata.mjs --write
      - name: Commit closeout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git diff --cached --check
          git commit -m 'P28-D6 archive verified technician LOD0'
          git push origin HEAD:${GITHUB_REF_NAME}
