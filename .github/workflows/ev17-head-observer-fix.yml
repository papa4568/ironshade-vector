name: EV-17 Shared Proof Observer Correction

on:
  push:
    branches:
      - agent/ev17-proof-cache-calibration
    paths:
      - '.github/workflows/ev17-head-observer-fix.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev17-proof-cache-calibration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Apply observer correction
        run: |
          python3 agent/ev17-fix-head-observer.py
          node agent/tests/pr-candidate-head-observer.mjs
          node agent/tests/evidence-independence-promotion.mjs
          git diff --check
      - name: Commit observer correction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/tools/pr-candidate-head-observer.mjs
          git diff --cached --check
          git commit -m 'Teach exact-head observer the shared build proof'
          git push origin HEAD:agent/ev17-proof-cache-calibration
