name: Apply objective guidance playtest fix

on:
  push:
    branches:
      - beta/playthrough-1-20
    paths:
      - 'scripts/patch-objective-guidance-playtest.mjs'
      - '.github/workflows/patch-objective-guidance-playtest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply objective guidance fix
        run: node scripts/patch-objective-guidance-playtest.mjs
      - name: Verify and commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/GameCanvas.tsx tests/ui-readability.ts scripts/browser-level1-20-playtest.mjs
          git diff --cached --check
          git commit -m 'Add off-screen objective guidance for cleared encounters'
          git push origin HEAD:beta/playthrough-1-20
