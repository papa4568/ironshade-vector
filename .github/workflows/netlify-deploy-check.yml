name: Netlify deploy check

on:
  push:
    branches:
      - ops/netlify-deploy-check

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a1f0efbb4844d1f692d963a009c3d87701e22f2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Netlify credential
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not configured in GitHub Actions."
            exit 78
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production build
        run: npm run build
      - name: Deploy verified build to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 10807c8b-065f-4c2f-a602-8ed65065aa70
        run: npx -y netlify-cli@latest deploy --prod --dir=dist --functions=netlify/functions --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Verified level 15 beta 5a1f0ef"
