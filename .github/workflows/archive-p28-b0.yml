name: Archive P28-B0 bookkeeping

on:
  push:
    branches:
      - chatgpt/p28-b0-textured-pbr

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Move P28-B0 to completed archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path('docs/content-roadmap.md')
          archive_path = Path('docs/content-roadmap-archive.md')
          workflow_path = Path('.github/workflows/archive-p28-b0.yml')

          roadmap = roadmap_path.read_text()
          lines = roadmap.splitlines(keepends=True)
          matches = [index for index, line in enumerate(lines) if line.startswith('- [ ] **P28-B0 —')]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one active P28-B0 line, found {len(matches)}')
          del lines[matches[0]]
          roadmap_path.write_text(''.join(lines))

          archive = archive_path.read_text()
          heading = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          if heading not in archive:
              raise SystemExit('P28 archive heading not found')
          if '**P28-B0 — Add textured PBR support to the deterministic GLB build path**' in archive:
              raise SystemExit('P28-B0 already archived')

          entry = '''- [x] **P28-B0 — Add textured PBR support to the deterministic GLB build path** — Extended the deterministic authored-asset preparation path with a premium textured-PBR reference that preserves UV0/tangents plus local base-color, normal, packed ORM, and emissive maps through glTF/Babylon while retaining existing fallback assets.\n  - Added `scripts/prepare-premium-pbr-reference.mjs` and wired it into `prepare:graphics-assets`; the generated panel carries `POSITION`, `NORMAL`, `TANGENT`, and `TEXCOORD_0` plus embedded base-color, normal, shared packed ORM, and emissive textures with metallic-roughness bindings.\n  - Kept local KTX2/BasisU runtime compatibility intact and documented the premium source boundary in `docs/graphics-asset-pipeline.md`; the committed reference asset is `public/assets/models/environments/refinery-wall-service-panel-pbr-reference-lod0.glb`.\n  - Made texture generation byte-stable across Node/zlib environments with an explicit stored-zlib PNG stream. The final reference deterministically regenerates to `4,288` bytes.\n  - Fixed glTF buffer-view compliance after CI exposed a Babylon loader failure by explicitly assigning every `bufferView` to `buffer: 0`, then regenerated the committed reference.\n  - Added `tests/premium-pbr-reference.mjs` and wired it into `test:graphics:content`; coverage verifies deterministic rebuilds, UV0/tangents, all four texture channels, shared ORM semantics, and Babylon `PBRMaterial` loading without regressing the existing graphics-content/fallback contract.\n  - Exact product revision `1ded925474a272ff41a34211cd62efb11f6e77a1` passed the full production build, Browser E2E run `37411029844`, Build Android APK run `37411029813`, and PR Android APK run `37411029809` including API 35 product smoke and API 36 large-screen smoke.\n  - Verified PR debug APK SHA-256: `da4aa92175e57881c613a7ecfb8bbf479ce533677513b72779b3423e9dbb67b3`.\n  - **Next: P28-B1 — Build a reusable premium PBR surface library.**\n\n'''
          archive_path.write_text(archive.replace(heading, heading + entry, 1))
          workflow_path.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content-roadmap.md docs/content-roadmap-archive.md .github/workflows/archive-p28-b0.yml
          git diff --cached --check
          git commit -m "Archive verified P28-B0 completion"
          git push origin "HEAD:${GITHUB_REF_NAME}"
