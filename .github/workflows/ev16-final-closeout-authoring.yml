name: EV-16 Final Closeout Authoring

on:
  push:
    branches:
      - agent/ev16-impact-widening

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev16-impact-widening
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Apply EV-16 archive transition
        run: python3 agent/ev16-closeout-final.py

      - name: Validate closeout task selection
        run: |
          set -euo pipefail
          git diff --check
          node agent/tools/select-review-task.mjs --base 3e3f7a062d5a7f93bceecd613ec8cbee12287c13 --head HEAD --json | tee /tmp/review-task.json
          jq -e '.taskId == "EV-16" and .mode == "experimental-closeout" and .source == "docs/experimental-verification-roadmap.md"' /tmp/review-task.json >/dev/null

      - name: Commit EV-16 closeout state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Archive corrected EV-16 promotion'
          git push origin HEAD:agent/ev16-impact-widening
