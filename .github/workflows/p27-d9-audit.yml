name: P27 D9 Audit

on:
  push:
    branches:
      - p27-d9-babylon-cleanup
    paths:
      - '.github/workflows/p27-d9-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify Three runtime is retired
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/game/threeCombatRenderer.ts
          test ! -e src/game/webGpuRefineryRenderer.ts
          test ! -e src/game/hardSciFiVisuals.ts
          test ! -e src/game/mapVisuals.ts
          test ! -e src/game/refineryBloom.ts
          test ! -e src/game/refineryIbl.ts
          ! grep -Eq '"(three|@types/three)"[[:space:]]*:' package.json package-lock.json
          ! git grep -n -E "from ['\"]three|import\(['\"]three|from ['\"][^'\"]*three/examples|import\(['\"][^'\"]*three/examples" -- src tests vite.config.ts
          ! git grep -n -E "node_modules/three|node_modules/@types/three|assets/codecs/basis" -- scripts/prepare-graphics-codecs.mjs src package.json package-lock.json vite.config.ts
          grep -q "public/assets/codecs/babylon" scripts/prepare-graphics-codecs.mjs
          grep -q "verify-no-three-delivery.mjs" .github/workflows/android-apk.yml
          grep -q "measure-babylon-delivery-cost.mjs" .github/workflows/android-apk.yml
          grep -q "Babylon.js as the sole production 3D combat renderer" docs/graphics-engine-decision.md
          grep -q "Babylon.js owns production 3D rendering" docs/graphics-asset-pipeline.md
          echo 'P27_D9_SOURCE_AUDIT_PASS runtime=babylon-only codecs=babylon-local tests=no-three-imports docs=current'
