name: EV-22 Closeout Helper

on:
  push:
    branches:
      - agent/ev22-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev22-closeout
          fetch-depth: 0
      - name: Append reviewed EV-22 archive and remove helper
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> docs/experimental-verification-archive.md
          rm .github/workflows/ev22-closeout-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experimental-verification-archive.md .github/workflows/ev22-closeout-helper.yml
          git diff --cached --check
          git commit -m 'Archive EV-22 trusted observer bootstrap'
          git push origin HEAD:agent/ev22-closeout
