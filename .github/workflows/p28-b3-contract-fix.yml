name: P28 B3 Contract Fix

on:
  push:
    branches:
      - p28-b3-refinery-cover-crate-pbr

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: p28-b3-refinery-cover-crate-pbr

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = '10.9.8'

      - name: Patch shared world source contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/game/babylonWorldPresentation.ts')
          text = path.read_text()
          text = text.replace(
              "  private active = false;\n",
              "  private refineryScenario = false;\n  private active = false;\n",
              1,
          )
          text = text.replace(
              "    this.syncObjects(state, detailScale, mission.location === 'asteroid-refinery');",
              "    this.refineryScenario = mission.location === 'asteroid-refinery';\n    this.syncObjects(state, detailScale);",
              1,
          )
          text = text.replace(
              "  private syncObjects(state: SimState, detailScale: number, refineryScenario: boolean) {\n    const quality = worldMaterialQualityProfile(worldQualityName(detailScale));",
              "  private syncObjects(state: SimState, detailScale: number) {\n    const refineryScenario = this.refineryScenario;\n    const quality = worldMaterialQualityProfile(worldQualityName(detailScale));",
              1,
          )
          text = text.replace(
              "    this.active = false;\n    this.loadGeneration += 1;",
              "    this.active = false;\n    this.refineryScenario = false;\n    this.loadGeneration += 1;",
              1,
          )
          path.write_text(text)

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify shared world regression contracts
        run: |
          npm run test:babylon-orbital-station
          npm run test:babylon-damaged-vessel
          npx tsc --noEmit

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/p28-b3-contract-fix.yml
          git add src/game/babylonWorldPresentation.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve shared Babylon world sync contract'
          git push origin HEAD:p28-b3-refinery-cover-crate-pbr
