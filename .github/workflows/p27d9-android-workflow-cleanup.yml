name: P27-D9 Android Workflow Cleanup

on:
  push:
    branches:
      - p27d9-clean
    paths:
      - '.github/workflows/p27d9-android-workflow-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean D9 branch
        uses: actions/checkout@v7
        with:
          ref: p27d9-clean
          fetch-depth: 0

      - name: Retire stale Three Android release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/android-apk.yml')
          source = path.read_text()

          old_chunks = """          find android/app/src/main/assets/public/assets -name 'three-core-*.js' -print -quit | grep -q .
          find android/app/src/main/assets/public/assets -name 'three-webgl-*.js' -print -quit | grep -q .
"""
          new_chunks = """          if find android/app/src/main/assets/public/assets \\( -name 'three-core-*.js' -o -name 'three-webgl-*.js' -o -name 'three.webgpu-*.js' -o -name 'three.tsl-*.js' \\) -print -quit | grep -q .; then
            echo '::error::Retired Three runtime chunk found in Android assets.'
            exit 1
          fi
          test -s android/app/src/main/assets/public/assets/codecs/babylon/manifest.json
          ! test -e android/app/src/main/assets/public/assets/codecs/basis
"""
          if old_chunks not in source:
              raise SystemExit('stale Three chunk assertions not found')
          source = source.replace(old_chunks, new_chunks, 1)

          old_measure = """      - name: Measure P21-F3 WebGPU delivery cost
        env:
          P21F3_APK_PATH: Ironshade-Vector-Android-Debug.apk
          P21F3_REPORT_PATH: p21f3-webgpu-delivery.json
        run: node scripts/measure-webgpu-delivery-cost.mjs

"""
          if old_measure not in source:
              raise SystemExit('obsolete P21-F3 delivery step not found')
          source = source.replace(old_measure, '', 1)

          for stale in (
              '            android-p21f3-webgpu.json\n',
              '            p21f3-webgpu-delivery.json\n',
          ):
              if stale not in source:
                  raise SystemExit(f'obsolete P21 artifact entry not found: {stale.strip()}')
              source = source.replace(stale, '', 1)

          path.write_text(source)
          PY

          rm .github/workflows/p27d9-android-workflow-cleanup.yml

      - name: Commit corrected Android release gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/android-apk.yml .github/workflows/p27d9-android-workflow-cleanup.yml
          git diff --cached --check
          git commit -m 'Retire stale Three Android release gates'
          git push origin HEAD:p27d9-clean
