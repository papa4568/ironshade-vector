name: P27-D9 Android Workflow Cleanup

on:
  push:
    branches:
      - p27d9-clean
    paths:
      - '.github/workflows/p27d9-android-workflow-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean D9 branch
        uses: actions/checkout@v7
        with:
          ref: p27d9-clean
          fetch-depth: 0

      - name: Build and store corrected Android workflow blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/android-apk.yml')
          source = path.read_text()
          old_chunks = "          find android/app/src/main/assets/public/assets -name 'three-core-*.js' -print -quit | grep -q .\n          find android/app/src/main/assets/public/assets -name 'three-webgl-*.js' -print -quit | grep -q .\n"
          new_chunks = "          if find android/app/src/main/assets/public/assets \\( -name 'three-core-*.js' -o -name 'three-webgl-*.js' -o -name 'three.webgpu-*.js' -o -name 'three.tsl-*.js' \\) -print -quit | grep -q .; then\n            echo '::error::Retired Three runtime chunk found in Android assets.'\n            exit 1\n          fi\n          test -s android/app/src/main/assets/public/assets/codecs/babylon/manifest.json\n          ! test -e android/app/src/main/assets/public/assets/codecs/basis\n"
          if old_chunks not in source:
              raise SystemExit('stale Three chunk assertions not found')
          source = source.replace(old_chunks, new_chunks, 1)
          old_measure = "      - name: Measure P21-F3 WebGPU delivery cost\n        env:\n          P21F3_APK_PATH: Ironshade-Vector-Android-Debug.apk\n          P21F3_REPORT_PATH: p21f3-webgpu-delivery.json\n        run: node scripts/measure-webgpu-delivery-cost.mjs\n\n"
          if old_measure not in source:
              raise SystemExit('obsolete P21-F3 delivery step not found')
          source = source.replace(old_measure, '', 1)
          for stale in ('            android-p21f3-webgpu.json\n', '            p21f3-webgpu-delivery.json\n'):
              if stale not in source:
                  raise SystemExit(f'obsolete P21 artifact entry not found: {stale.strip()}')
              source = source.replace(stale, '', 1)
          path.write_text(source)
          PY
          jq -Rs '{content: ., encoding: "utf-8"}' .github/workflows/android-apk.yml > /tmp/blob.json
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob.json)"
          echo "$response"
          echo "ANDROID_WORKFLOW_BLOB_SHA=$(jq -r '.sha' <<<"$response")"
