name: P28-D7 verified closeout

on:
  push:
    branches:
      - chatgpt/p28-d7-elite-enemy-lod0

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified closeout once
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "chore: retry P28-D7 verified closeout native sync" ]; then
            echo "Skipping closeout for non-trigger commit."
            exit 0
          fi
          python scripts/p28d7-closeout.py
          node agent/tools/sync-roadmap-metadata.mjs --write
          git rm .github/workflows/p28d7-closeout.yml scripts/p28d7-closeout.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git diff --cached --check
          git commit -m 'P28-D7 archive verified completion'
          git push origin HEAD:${GITHUB_REF_NAME}
