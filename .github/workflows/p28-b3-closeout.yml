name: P28 B3 Closeout

on:
  push:
    branches:
      - p28-b3-refinery-cover-crate-pbr

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: p28-b3-refinery-cover-crate-pbr

      - name: Archive verified completion
        shell: python
        run: |
          from pathlib import Path

          roadmap_path = Path('docs/content-roadmap.md')
          roadmap = roadmap_path.read_text()
          lines = roadmap.splitlines(keepends=True)
          kept = []
          removed = 0
          for line in lines:
              if line.startswith('- [ ] **P28-B3 — Apply P28 materials to refinery cover and crates**'):
                  removed += 1
                  continue
              kept.append(line)
          if removed != 1:
              raise SystemExit(f'expected exactly one active P28-B3 line, removed={removed}')
          roadmap = ''.join(kept)
          if '- [ ] **P28-B4 — Apply P28 materials to refinery machinery**' not in roadmap:
              raise SystemExit('P28-B4 must remain the next active machinery item')
          roadmap_path.write_text(roadmap)

          archive_path = Path('docs/content-roadmap-archive.md')
          archive = archive_path.read_text()
          if '**P28-B3 — Apply P28 materials to refinery cover and crates**' in archive:
              raise SystemExit('P28-B3 is already archived')
          anchor = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          if anchor not in archive:
              raise SystemExit('P28 archive heading not found')
          entry = '''- [x] **P28-B3 — Apply P28 materials to refinery cover and crates** — Applied the shared P28 premium PBR language to refinery cover and crates while preserving simulation-owned dimensions, placement, interaction behavior, and near-player cover readability.\n  - Extended `scripts/prepare-refinery-premium-surfaces.mjs` so both refinery crate LOD1/LOD2 GLBs receive deterministic UV0/tangent geometry for premium normal mapping without changing unit bounds or authored shell/band/marker transforms. Crate runtime binding now separates painted metal, bare metal, and polymer/rubber and exposes `crate:bare-metal+painted-metal+polymer-rubber` telemetry.\n  - Upgraded refinery cover presentation in `BabylonRefineryWorldPresentation`: the simulation-sized cover body uses painted metal with a bare-metal cap and polymer/rubber bumpers only in the Asteroid Refinery presentation. Existing simulation footprint sizing and near-player transparency remain authoritative and unchanged.\n  - Added `tests/refinery-cover-crate-premium-surfaces.mjs`, extended the existing premium-surface regression and authored-refinery live verifier, and preserved shared-world source contracts across non-refinery Babylon locations. Targeted B3 material validation and TypeScript checks passed before full verification.\n  - Exact code candidate `262794776194e59ddb026ad9fb4a3af389469930` passed Browser E2E run `37477447179` on desktop and mobile-landscape, including the full repository regression/production build and live player journeys. Build Android APK run `37477446982` passed. PR Android APK run `37477446926` passed full repository verification, native Android generation, APK build/sign/delivery checks, API 35 product smoke, API 36 Android 16 large-screen smoke, and aggregate Android verification.\n  - Verified PR artifact `ironshade-vector-pr-android-apk` (artifact `11420176236`) has artifact digest `sha256:5918eca99c188052810cb68fe4bfd427bfdf14d63385d47d79fb624cf5e31e3a`. `Ironshade-Vector-Android-Debug.apk` is 10,256,999 bytes, package `app.ironshade.vector`, version `0.0.1-pr.61 (61)`, min SDK 24 / target+compile SDK 36, APK Signature Scheme v2 verified, signer SHA-256 `30312cc99d73e73bdf47a03a378e43a672aa85ee454dc1f0c505d25686406817`, and APK SHA-256 `8c7e41f20eb1e29e48be788c7e43e8a37dcd9e1fbeb6f0351cb4f99e6d8ba415`.\n  - **Next: P28-B4 — Apply P28 materials to refinery machinery.**\n\n'''
          archive_path.write_text(archive.replace(anchor, anchor + entry, 1))

      - name: Verify roadmap hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '^\- \[ \] \*\*P28-B3' docs/content-roadmap.md
          grep -q '^\- \[ \] \*\*P28-B4 — Apply P28 materials to refinery machinery\*\*' docs/content-roadmap.md
          grep -q '^\- \[x\] \*\*P28-B3 — Apply P28 materials to refinery cover and crates\*\*' docs/content-roadmap-archive.md

      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/p28-b3-closeout.yml
          git add docs/content-roadmap.md docs/content-roadmap-archive.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive verified P28-B3 completion [skip ci]'
          git push origin HEAD:p28-b3-refinery-cover-crate-pbr
