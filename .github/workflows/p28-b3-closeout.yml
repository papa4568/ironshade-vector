name: P28 B3 Closeout

on:
  push:
    branches:
      - p28-b3-refinery-cover-crate-pbr

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: p28-b3-refinery-cover-crate-pbr

      - name: Update active roadmap and archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap_path = Path('docs/content-roadmap.md')
          roadmap = roadmap_path.read_text()
          completed = """- [ ] **P28-B3 — Apply P28 materials to refinery cover and crates.**
            - Scope: move cover and crate surfaces off generic flat materials.
            - Acceptance: painted/bare-metal/polymer separation is intentional and readable at gameplay zoom.
            - Acceptance: simulation dimensions and readability remain unchanged.
            - Acceptance: standard build/APK gates pass.
          """
          if roadmap.count(completed) != 1:
              raise SystemExit('P28-B3 active roadmap block was not found exactly once')
          roadmap = roadmap.replace(completed, '')
          roadmap_path.write_text(roadmap)

          archive_path = Path('docs/content-roadmap-archive.md')
          archive = archive_path.read_text()
          anchor = '### P28-B2 — Upgrade refinery floor, grating, bulkhead, and wall geometry for proper PBR textures — COMPLETE\n'
          if archive.count(anchor) != 1:
              raise SystemExit('P28-B2 archive anchor was not found exactly once')
          entry = """### P28-B3 — Apply P28 materials to refinery cover and crates — COMPLETE

**Status:** Complete on 2026-10-06.

**Implemented:**
- Upgraded both refinery crate LODs with deterministic UV/tangent geometry while preserving authored transforms and gameplay bounds.
- Bound crate shell, structural banding, and marker slots to the shared P28 painted-metal, bare-metal, and polymer/rubber material library.
- Added refinery-only premium cover presentation using painted metal, a bare-metal cap, and polymer/rubber bumpers while preserving simulation-owned footprint dimensions and near-player transparency/readability behavior.
- Extended refinery premium-surface telemetry and live verification to require crate material separation plus at least one rendered premium cover.
- Added focused regression coverage for crate LOD geometry/material slots and the cover premium-surface/readability contract.

**Validated:**
- Targeted asset preparation, refinery premium-surface tests, P28-B3 cover/crate contract test, and TypeScript checks passed.
- Browser E2E run `37477447179` passed full regression/build plus headed desktop and mobile-landscape player journeys.
- PR Android run `37477446926` passed full repository verification, installable debug APK build, API 35 product smoke, API 36 large-screen smoke, and aggregate Android PR verification.
- Verified APK artifact: `ironshade-vector-pr-android-apk`; debug APK size `82,532,612` bytes; SHA-256 `8c7e41f20eb1e29e48be788c7e43e8a37dcd9e1fbeb6f0351cb4f99e6d8ba415`.

**Expected next active item:** P28-B4 — Apply P28 materials to breach objects and wreck chunks.

---

"""
          archive = archive.replace(anchor, entry + anchor)
          archive_path.write_text(archive)
          PY

      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/p28-b3-closeout.yml
          git add docs/content-roadmap.md docs/content-roadmap-archive.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive completed P28-B3 roadmap item'
          git push origin HEAD:p28-b3-refinery-cover-crate-pbr
