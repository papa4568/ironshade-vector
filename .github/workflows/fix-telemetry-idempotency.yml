name: Apply telemetry idempotency fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-telemetry-idempotency.yml'
      - 'scripts/apply-telemetry-idempotency.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply telemetry idempotency fix
        run: node scripts/apply-telemetry-idempotency.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate complete production build
        run: npm run build
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit verified fix
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- netlify/functions/api.ts src/game/network.ts src/App.tsx tests/service-regressions.mjs scripts/apply-telemetry-idempotency.mjs .github/workflows/fix-telemetry-idempotency.yml
          git commit -m 'Make telemetry ingestion idempotent and repairable'
          git push origin HEAD:main
