name: Trusted Review Browser Evidence Fix

on:
  push:
    branches:
      - fix/trusted-review-reusable-browser-jobs
    paths:
      - '.github/workflows/fix-trusted-review-browser-job-names.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/trusted-review-reusable-browser-jobs
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Patch trusted browser evidence recognition
        run: |
          python3 agent/fix-trusted-review-browser-job-names.py
          node agent/tools/trusted-independent-review-v4.mjs self-test
          node agent/tools/trusted-independent-review-v3.mjs self-test
          git diff --check
      - name: Commit trusted verifier fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/tools/trusted-independent-review-v4.mjs
          git diff --cached --check
          git commit -m 'Recognize reusable browser verification jobs'
          git push origin HEAD:fix/trusted-review-reusable-browser-jobs
