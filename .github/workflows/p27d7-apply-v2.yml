name: P27-D7 Apply Cutover v2

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/p27d7-cutover-v2.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Apply P27-D7 Android lifecycle finalizer
        run: python3 .github/scripts/apply-p27d7.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify graphics cutover boundary
        run: npm run test:graphics-backend

      - name: Verify Android smoke contract
        run: npm run test:android-fast-smoke

      - name: Run production build gate
        run: npm run build

      - name: Commit verified D7 finalizer to main
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/android-fast-smoke.sh tests/android-fast-smoke-contract.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(android): verify Babylon cutover lifecycle recovery'
          git push origin HEAD:main
