name: Fix 9 network timeout handling v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrected network migration
        run: python scripts/fix9-migration.py
      - name: Install dependencies
        run: npm install
      - name: Validate complete production build
        run: npm run build
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f scripts/fix9-migration.py \
            .github/workflows/fix9-network-timeouts.yml \
            .github/workflows/fix9-network-timeouts-v2.yml \
            .github/workflows/fix9-network-timeouts-v3.yml
          git add src/game/network.ts src/App.tsx src/components/ShipHub.tsx tests/network-regressions.ts package.json scripts/fix9-migration.py .github/workflows/fix9-network-timeouts.yml .github/workflows/fix9-network-timeouts-v2.yml .github/workflows/fix9-network-timeouts-v3.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bound network requests and classify failures"
          git push
