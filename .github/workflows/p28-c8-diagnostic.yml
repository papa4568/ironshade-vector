name: P28 C8 Diagnostic

on:
  push:
    branches:
      - chatgpt/p28-c8-diagnostic
    paths:
      - .github/workflows/p28-c8-diagnostic.yml

permissions:
  contents: read

jobs:
  exact-head-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 276f9d9c3b9fb1ef1f4a7ce9e35fa7590ad6790b
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install -g npm@10.9.8
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Build exact candidate client
        run: |
          npm run prepare:graphics-codecs
          npm run prepare:graphics-assets
          npx vite build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > p28-mobile-preview.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat p28-mobile-preview.log
          exit 1
      - name: Launch exact mobile Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          chrome_dir="$(dirname "$CHROME_PATH")"
          swiftshader_icd="$(find "$chrome_dir" -maxdepth 4 -name vk_swiftshader_icd.json -print -quit)"
          export VK_ICD_FILENAMES="$swiftshader_icd"
          export LD_LIBRARY_PATH="$(dirname "$swiftshader_icd"):${LD_LIBRARY_PATH:-}"
          "$CHROME_PATH" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-unsafe-webgpu \
            --use-webgpu-adapter=swiftshader \
            --use-vulkan=swiftshader \
            --enable-dawn-features=allow_unsafe_apis \
            --disable-dawn-features=use_dxc \
            --enable-webgpu-developer-features \
            --use-gpu-in-tests \
            --enable-accelerated-2d-canvas \
            --enable-unsafe-swiftshader \
            --window-size=851,360 \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9223 \
            --user-data-dir="$RUNNER_TEMP/ironshade-p28-c8-mobile" \
            http://127.0.0.1:4173/ > p28-mobile-chrome.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null && exit 0
            sleep 0.5
          done
          cat p28-mobile-chrome.log
          exit 1
      - name: Replay mobile journey with command boundaries
        id: journey
        continue-on-error: true
        env:
          CDP_ENDPOINT: http://127.0.0.1:9223
          BROWSER_E2E_APP_URL: http://127.0.0.1:4173/
          BROWSER_E2E_VIEWPORT: mobile-landscape
          BROWSER_E2E_GRAPHICS_PATH: babylon
          BROWSER_E2E_SKIP_SYNTHETIC_CONTROLLER: '0'
          BROWSER_E2E_SCREENSHOT: p28-c8-mobile.png
          BROWSER_E2E_COMMAND_SCREENSHOT: p28-c8-mobile-command.png
          BROWSER_E2E_CLASS_SCREENSHOT: p28-c8-mobile-class.png
          BROWSER_E2E_ACCESSIBILITY_SCREENSHOT: p28-c8-mobile-accessibility.png
          BROWSER_E2E_PERFORMANCE_REPORT: p28-c8-mobile.performance.json
        shell: bash
        run: |
          set -o pipefail
          run_one() {
            label="$1"; shift
            echo "=== P28_C8_MOBILE_BEGIN $label ==="
            "$@" 2>&1 | tee -a p28-c8-mobile-journey.log
            status=${PIPESTATUS[0]}
            echo "=== P28_C8_MOBILE_END $label status=$status ===" | tee -a p28-c8-mobile-journey.log
            return "$status"
          }
          run_one operator node scripts/verify-authored-operator.mjs || exit $?
          run_one enemies node scripts/verify-authored-enemies.mjs || exit $?
          run_one weapons node scripts/verify-authored-weapons.mjs || exit $?
          run_one interactables node scripts/verify-authored-interactables.mjs || exit $?
          run_one refinery node scripts/verify-authored-refinery.mjs || exit $?
          echo "=== P28_C8_MOBILE_BEGIN browser-runtime-smoke ===" | tee -a p28-c8-mobile-journey.log
          node scripts/browser-runtime-smoke.mjs 2>&1 | tee -a p28-c8-mobile-journey.log
          status=${PIPESTATUS[0]}
          echo "=== P28_C8_MOBILE_END browser-runtime-smoke status=$status ===" | tee -a p28-c8-mobile-journey.log
          exit "$status"
      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p28-c8-mobile-diagnostics
          path: |
            p28-c8-mobile-journey.log
            p28-mobile-preview.log
            p28-mobile-chrome.log
            p28-c8-mobile*.png
            p28-c8-mobile.performance.json
          if-no-files-found: warn
      - name: Preserve mobile result
        if: steps.journey.outcome != 'success'
        run: exit 1
