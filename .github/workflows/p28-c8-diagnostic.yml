name: P28 C8 Diagnostic

on:
  push:
    branches:
      - chatgpt/p28-c8-diagnostic
    paths:
      - .github/workflows/p28-c8-diagnostic.yml

permissions:
  contents: read

jobs:
  exact-head-verifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba1628eb160f7845bc527bf72d42a9256ac13ed3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install -g npm@10.9.8
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Build exact candidate client
        run: |
          npm run prepare:graphics-codecs
          npm run prepare:graphics-assets
          npx vite build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > p28-preview.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          exit 1
      - name: Launch mobile Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          chrome_dir="$(dirname "$CHROME_PATH")"
          swiftshader_icd="$(find "$chrome_dir" -maxdepth 4 -name vk_swiftshader_icd.json -print -quit)"
          export VK_ICD_FILENAMES="$swiftshader_icd"
          export LD_LIBRARY_PATH="$(dirname "$swiftshader_icd"):${LD_LIBRARY_PATH:-}"
          "$CHROME_PATH" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-webgpu --use-webgpu-adapter=swiftshader --use-vulkan=swiftshader --enable-dawn-features=allow_unsafe_apis --disable-dawn-features=use_dxc --enable-webgpu-developer-features --use-gpu-in-tests --enable-accelerated-2d-canvas --enable-unsafe-swiftshader --window-size=851,360 --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --user-data-dir="$RUNNER_TEMP/ironshade-p28-c8-verifiers" http://127.0.0.1:4173/ > p28-chrome.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null && exit 0
            sleep 0.5
          done
          exit 1
      - name: Verify authored operator
        env: &browser_env
          CDP_ENDPOINT: http://127.0.0.1:9223
          BROWSER_E2E_APP_URL: http://127.0.0.1:4173/
          BROWSER_E2E_VIEWPORT: mobile-landscape
          BROWSER_E2E_GRAPHICS_PATH: babylon
          BROWSER_E2E_SKIP_SYNTHETIC_CONTROLLER: '0'
        run: node scripts/verify-authored-operator.mjs
      - name: Verify authored enemies
        env: *browser_env
        run: node scripts/verify-authored-enemies.mjs
      - name: Verify authored weapons
        env: *browser_env
        run: node scripts/verify-authored-weapons.mjs
      - name: Verify authored interactables
        env: *browser_env
        run: node scripts/verify-authored-interactables.mjs
      - name: Verify authored refinery
        env: *browser_env
        run: node scripts/verify-authored-refinery.mjs
