name: P28 C8 Diagnostic

on:
  push:
    branches:
      - chatgpt/p28-c8-diagnostic
    paths:
      - .github/workflows/p28-c8-diagnostic.yml

permissions:
  contents: read

jobs:
  exact-head-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7aa9e706ec0114c23ba0463cf3a85e38feef3df
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install -g npm@10.9.8
      - run: npm ci
      - name: Run full exact-head verification with diagnostics
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee p28-c8-build.log
      - name: Upload exact-head diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p28-c8-build-log
          path: p28-c8-build.log
          if-no-files-found: error
      - name: Preserve verification result
        if: steps.verify.outcome != 'success'
        run: exit 1
