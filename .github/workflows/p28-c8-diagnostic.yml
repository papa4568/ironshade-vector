name: P28 C8 Diagnostic

on:
  push:
    branches:
      - chatgpt/p28-c8-diagnostic
    paths:
      - .github/workflows/p28-c8-diagnostic.yml

permissions:
  contents: read

jobs:
  exact-head-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2443bdca51b6f8d8987a68567f339a6c62126b61
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install -g npm@10.9.8
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - name: Build exact candidate client
        run: |
          npm run prepare:graphics-codecs
          npm run prepare:graphics-assets
          npx vite build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > p28-preview.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat p28-preview.log
          exit 1
      - name: Launch Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          chrome_dir="$(dirname "$CHROME_PATH")"
          swiftshader_icd="$(find "$chrome_dir" -maxdepth 4 -name vk_swiftshader_icd.json -print -quit)"
          export VK_ICD_FILENAMES="$swiftshader_icd"
          export LD_LIBRARY_PATH="$(dirname "$swiftshader_icd"):${LD_LIBRARY_PATH:-}"
          "$CHROME_PATH" --headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-webgpu --use-webgpu-adapter=swiftshader --use-vulkan=swiftshader --enable-dawn-features=allow_unsafe_apis --disable-dawn-features=use_dxc --enable-webgpu-developer-features --use-gpu-in-tests --enable-accelerated-2d-canvas --enable-unsafe-swiftshader --window-size=1280,720 --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --user-data-dir="$RUNNER_TEMP/ironshade-p28-c8-diagnostic" http://127.0.0.1:4173/ > p28-chrome.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null && exit 0
            sleep 0.5
          done
          cat p28-chrome.log
          exit 1
      - name: Run browser smoke and image-grade capture with logs
        id: visual
        continue-on-error: true
        env:
          CDP_ENDPOINT: http://127.0.0.1:9223
          BROWSER_E2E_APP_URL: http://127.0.0.1:4173/
          BROWSER_E2E_VIEWPORT: desktop
          BROWSER_E2E_GRAPHICS_PATH: babylon
          BROWSER_E2E_SKIP_SYNTHETIC_CONTROLLER: '1'
          BROWSER_E2E_SCREENSHOT: browser-p28a5-normal.png
          BROWSER_E2E_P28A5_LOW_VISIBILITY_SCREENSHOT: browser-p28a5-low-visibility.png
          BROWSER_E2E_P28A5_REPORT: browser-p28a5-image-grade.json
        shell: bash
        run: |
          set +e
          set -o pipefail
          node scripts/browser-runtime-smoke.mjs 2>&1 | tee browser-smoke.log
          smoke_status=${PIPESTATUS[0]}
          node scripts/p28a5-image-grade-capture.mjs 2>&1 | tee p28-capture.log
          capture_status=${PIPESTATUS[0]}
          exit $(( smoke_status != 0 || capture_status != 0 ))
      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p28-c8-visual-diagnostics
          path: |
            browser-smoke.log
            p28-capture.log
            p28-preview.log
            p28-chrome.log
            browser-p28a5-normal.png
            browser-p28a5-low-visibility.png
            browser-p28a5-image-grade.json
          if-no-files-found: warn
      - name: Preserve visual result
        if: steps.visual.outcome != 'success'
        run: exit 1
