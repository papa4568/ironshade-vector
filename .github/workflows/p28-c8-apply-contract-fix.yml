name: P28 C8 Apply Contract Fix

on:
  push:
    branches:
      - chatgpt/p28-c8-diagnostic
    paths:
      - .github/workflows/p28-c8-apply-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p28-c8-refinery-world-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install -g npm@10.9.8
      - run: npm ci
      - name: Update C8 browser parity contract
        run: |
          python - <<'PY'
          from pathlib import Path

          browser_path = Path('scripts/browser-runtime-smoke.mjs')
          browser = browser_path.read_text()
          old = "!interactableAssets.every(asset => /^interactable-(control-terminal|salvage-tag-node)-lod[12]$/.test(asset))"
          new = "!interactableAssets.every(asset => /^(?:interactable-(?:control-terminal|salvage-tag-node)-lod[12]|refinery-(?:terminal|crate)-lod[012])$/.test(asset))"
          if old not in browser:
            raise SystemExit('P28-C8 browser interactable asset parity anchor missing')
          browser = browser.replace(old, new, 1)
          old_cache = "Number(worldRuntimeMatch[1]) < 20"
          new_cache = "Number(worldRuntimeMatch[1]) < 19"
          if old_cache not in browser:
            raise SystemExit('P28-C8 browser world runtime cache floor anchor missing')
          browser = browser.replace(old_cache, new_cache, 1)
          browser_path.write_text(browser)

          test_path = Path('tests/refinery-world-authored-mappings.mjs')
          test = test_path.read_text()
          old_imports = "const verifier = await readFile(resolve(process.cwd(), 'scripts/verify-authored-refinery.mjs'), 'utf8');"
          new_imports = old_imports + "\nconst runtimeSmoke = await readFile(resolve(process.cwd(), 'scripts/browser-runtime-smoke.mjs'), 'utf8');"
          if old_imports not in test:
            raise SystemExit('P28-C8 runtime smoke test import anchor missing')
          test = test.replace(old_imports, new_imports, 1)
          anchor = "assert(imageGrade.includes(\"visualDetail: 'p28-c8-refinery-world-authored-mappings'\"), 'P28-C8 Flagship image-grade capture is not tagged for the world-mapping candidate');"
          addition = anchor + "\nassert(runtimeSmoke.includes('refinery-(?:terminal|crate)-lod[012]'), 'P28-C8 browser parity must accept mapped refinery interactable families');\nassert(runtimeSmoke.includes('Number(worldRuntimeMatch[1]) < 19'), 'P28-C8 browser parity must allow refinery-family cache reuse without requiring a duplicate interactable asset');"
          if anchor not in test:
            raise SystemExit('P28-C8 runtime smoke test assertion anchor missing')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test)
          PY
      - name: Verify C8 mapping and browser contracts
        run: node tests/refinery-world-authored-mappings.mjs
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify clean patch
        run: git diff --check
      - name: Commit verified browser parity fix to task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-runtime-smoke.mjs tests/refinery-world-authored-mappings.mjs
          git commit -m "P28-C8 align browser parity with mapped families"
          git push origin HEAD:chatgpt/p28-c8-refinery-world-assets
