name: P28 C8 Apply Contract Fix

on:
  push:
    branches:
      - chatgpt/p28-c8-diagnostic
    paths:
      - .github/workflows/p28-c8-apply-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p28-c8-refinery-world-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install -g npm@10.9.8
      - run: npm ci
      - name: Restore established world-material source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/babylonWorldPresentation.ts')
          source = path.read_text()
          start = source.index('  private syncObjects(')
          end = source.index('  private ensureObjective()', start)
          section = source[start:end]
          replacements = {
              'const fallback = this.objectVisuals.get(object.id);': 'const visual = this.objectVisuals.get(object.id);',
              'if (fallback) {': 'if (visual) {',
              'fallback.mesh': 'visual.mesh',
              'fallback.height': 'visual.height',
              'fallback.premiumDetailMeshes': 'visual.premiumDetailMeshes',
              'fallback.premiumCover': 'visual.premiumCover',
              'fallback.material': 'visual.material',
          }
          for old, new in replacements.items():
              if old not in section:
                  raise SystemExit(f'P28-C8 sync fallback token not found: {old}')
              section = section.replace(old, new)
          updated = source[:start] + section + source[end:]
          if updated == source or 'visual.material.metallic =' not in section or 'visual.material.roughness =' not in section:
              raise SystemExit('P28-C8 world-material contract patch did not apply')
          if "refineryScenario ? 'authored-family-mapped' : 'procedural-fallback-babylon'" not in section:
              raise SystemExit('P28-C8 telemetry string changed unexpectedly')
          path.write_text(updated)
          PY
      - name: Verify refinery lighting source contract
        run: npm run test:babylon-refinery-lighting
      - name: Verify graphics content contracts
        id: graphics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:graphics:content 2>&1 | tee p28-c8-graphics-content.log
      - name: Upload graphics content diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p28-c8-graphics-content-log
          path: p28-c8-graphics-content.log
          if-no-files-found: error
      - name: Preserve graphics verification result
        if: steps.graphics.outcome != 'success'
        run: exit 1
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify clean patch
        run: git diff --check
      - name: Commit verified fix to task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/babylonWorldPresentation.ts
          git commit -m "P28-C8 preserve refinery world material fallback contract"
          git push origin HEAD:chatgpt/p28-c8-refinery-world-assets
