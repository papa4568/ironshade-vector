name: P28 C8 Apply Contract Fix

on:
  push:
    branches:
      - chatgpt/p28-c8-diagnostic
    paths:
      - .github/workflows/p28-c8-apply-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/p28-c8-refinery-world-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install -g npm@10.9.8
      - run: npm ci
      - name: Integrate mapped interactable verification contract
        run: |
          python - <<'PY'
          from pathlib import Path

          world_path = Path('src/game/babylonWorldPresentation.ts')
          world = world_path.read_text()
          old = "        this.canvas.dataset.interactableVisual = 'authored-babylon';\n      }"
          new = "        this.canvas.dataset.interactableVisual = 'authored-babylon';\n        this.canvas.dataset.interactableMode = 'refinery-family-mapped';\n      }"
          if old not in world:
            raise SystemExit('P28-C8 authored interactable readiness anchor missing')
          world = world.replace(old, new, 1)
          world_path.write_text(world)

          verifier_path = Path('scripts/verify-authored-interactables.mjs')
          verifier = verifier_path.read_text()
          old = "    const controlAsset = `interactable-control-terminal-lod${expectedLod}`;\n    if (lastState?.visual === 'authored-babylon' && assets.has(controlAsset)) {\n      if (lastState.mode !== 'control-terminal+salvage-tag-node') {\n        throw new Error(`Unexpected authored interactable mode: ${JSON.stringify(lastState)}`);\n      }"
          new = "    const legacyControlAsset = `interactable-control-terminal-lod${expectedLod}`;\n    const refineryControlAsset = `refinery-terminal-lod${expectedLod}`;\n    const controlAsset = assets.has(refineryControlAsset) ? refineryControlAsset : legacyControlAsset;\n    const validMode = controlAsset === refineryControlAsset\n      ? lastState.mode === 'refinery-family-mapped'\n      : lastState.mode === 'control-terminal+salvage-tag-node';\n    if (lastState?.visual === 'authored-babylon' && assets.has(controlAsset)) {\n      if (!validMode) {\n        throw new Error(`Unexpected authored interactable mode: ${JSON.stringify(lastState)}`);\n      }"
          if old not in verifier:
            raise SystemExit('P28-C8 interactable verifier success anchor missing')
          verifier = verifier.replace(old, new, 1)
          old = "  if (lastState?.visual !== 'authored-babylon'\n    || !['high', 'balanced', 'performance'].includes(lastState?.renderTier)\n    || !assets.has(`interactable-control-terminal-lod${expectedLod}`)) {"
          new = "  const expectedControlAssets = [\n    `interactable-control-terminal-lod${expectedLod}`,\n    `refinery-terminal-lod${expectedLod}`,\n  ];\n  if (lastState?.visual !== 'authored-babylon'\n    || !['high', 'balanced', 'performance'].includes(lastState?.renderTier)\n    || !expectedControlAssets.some(asset => assets.has(asset))) {"
          if old not in verifier:
            raise SystemExit('P28-C8 interactable verifier timeout anchor missing')
          verifier = verifier.replace(old, new, 1)
          verifier_path.write_text(verifier)

          test_path = Path('tests/refinery-world-authored-mappings.mjs')
          test = test_path.read_text()
          old = "const runtimeSmoke = await readFile(resolve(process.cwd(), 'scripts/browser-runtime-smoke.mjs'), 'utf8');"
          new = old + "\nconst interactableVerifier = await readFile(resolve(process.cwd(), 'scripts/verify-authored-interactables.mjs'), 'utf8');"
          if old not in test or 'interactableVerifier' in test:
            raise SystemExit('P28-C8 interactable verifier test import anchor missing or already applied')
          test = test.replace(old, new, 1)
          anchor = "assert(runtimeSmoke.includes('Number(worldRuntimeMatch[1]) < 19'), 'P28-C8 browser parity must allow refinery-family cache reuse without requiring a duplicate interactable asset');"
          addition = anchor + "\nassert(world.includes(\"this.canvas.dataset.interactableMode = 'refinery-family-mapped'\"), 'P28-C8 mapped refinery interactables must publish an explicit verifier mode');\nassert(interactableVerifier.includes('refineryControlAsset') && interactableVerifier.includes(\"lastState.mode === 'refinery-family-mapped'\"), 'P28-C8 authored-interactable verifier must accept mapped refinery terminal families while preserving legacy mode checks');"
          if anchor not in test:
            raise SystemExit('P28-C8 verifier test assertion anchor missing')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test)
          PY
      - name: Verify C8 mapping/verifier contracts
        run: node tests/refinery-world-authored-mappings.mjs
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify clean patch
        run: git diff --check
      - name: Commit verified interactable verifier fix to task branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/babylonWorldPresentation.ts scripts/verify-authored-interactables.mjs tests/refinery-world-authored-mappings.mjs
          git commit -m "P28-C8 align authored interactable verifier"
          git push origin HEAD:chatgpt/p28-c8-refinery-world-assets
