name: EV-17 External Closure Correction

on:
  push:
    branches:
      - agent/ev17-proof-cache-calibration
    paths:
      - '.github/workflows/ev17-external-closure-fix.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev17-proof-cache-calibration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Apply external closure correction
        run: |
          python3 agent/ev17-fix-external-closure.py
          node agent/tests/proof-cache-calibration-evidence.mjs
          node agent/tests/causal-proof-cache.mjs
          git diff --check
      - name: Commit permanent correction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md agent/proof-cache-calibration-corpus.json agent/tools/proof-cache-calibration-evidence.mjs agent/tests/proof-cache-calibration-evidence.mjs docs/experimental-verification-roadmap.md docs/experimental-verification-archive.md
          git diff --cached --check
          git commit -m 'Account for EV-17 external proof dependencies'
          git push origin HEAD:agent/ev17-proof-cache-calibration
