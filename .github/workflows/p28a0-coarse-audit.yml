name: P28-A0 Coarse Quality Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-coarse-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Find every coarse-device production branch
        shell: bash
        run: |
          set -euo pipefail
          echo '=== all coarse references in game source ==='
          grep -RIn --include='*.ts' -E '\bcoarse\b|pointer: coarse' src/game || true
          echo '=== mobile render-profile references ==='
          grep -RIn --include='*.ts' -E "name: 'mobile'|profileName = .*mobile|mobile-lod2" src/game || true
