name: P28-A0 Quality Ceiling Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p28a0-coarse-audit.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use npm 10.9.8
        run: npm install --global npm@10.9.8
      - name: Remove device-class quality ceilings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=None):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              if count == 0:
                  raise SystemExit(f'{path}: anchor not found: {old!r}')
              p.write_text(s.replace(old, new))

          replace('src/game/babylonCombatRenderer.ts', 'new Engine(renderCanvas, !coarse, {', 'new Engine(renderCanvas, true, {', 1)
          replace('src/game/babylonCombatRenderer.ts', 'const assetDetailScale = this.coarse ? Math.min(detailScale, 0.55) : detailScale;', 'const assetDetailScale = detailScale;', 3)
          replace('src/game/babylonCombatRenderer.ts', "const qualityCap = quality < 0.55 ? 1.12 : this.coarse || quality < 0.8 ? 1.35 : 1.8;", "const qualityCap = quality < 0.55 ? 1.12 : quality < 0.8 ? 1.35 : 1.8;", 1)

          replace('src/game/babylonWorldPresentation.ts', 'selectGraphicsAssetSpec(family, this.coarse ? Math.min(detailScale, 0.55) : detailScale)', 'selectGraphicsAssetSpec(family, detailScale)', 1)
          replace('src/game/babylonWorldPresentation.ts', 'selectGraphicsAssetSpec(PICKUP_ASSET_FAMILY, this.coarse ? Math.min(detailScale, 0.55) : detailScale)', 'selectGraphicsAssetSpec(PICKUP_ASSET_FAMILY, detailScale)', 1)

          for path in [
              'src/game/babylonWeaponVfx.ts',
              'src/game/babylonAbilityVfx.ts',
              'src/game/babylonEnemyTelegraphs.ts',
              'src/game/babylonProtocolStatusVisuals.ts',
          ]:
              replace(path, 'const effectiveDetail = coarse ? Math.min(detailScale, 0.55) : detailScale;', 'const effectiveDetail = detailScale;', 1)
          replace('src/game/babylonEnemyLifecycleVisuals.ts', "return coarse || detailScale < 0.72 ? 'reduced' : 'full';", "return detailScale < 0.72 ? 'reduced' : 'full';", 1)

          for p in Path('src/game').glob('babylon*Presentation.ts'):
              s = p.read_text()
              s = s.replace("renderBudget.tierName === 'performance' || this.coarse ? 1 : 2", "renderBudget.tierName === 'performance' ? 1 : 2")
              s = s.replace('this.coarse || renderBudget.vfxDensity < 0.55', 'renderBudget.vfxDensity < 0.55')
              p.write_text(s)

          replace('src/game/babylonSpinHabitatPresentation.ts', 'tessellation: this.coarse ? 32 : 48,', 'tessellation: 48,', 1)
          replace('src/game/babylonSpinHabitatPresentation.ts', 'tessellation: this.coarse ? 28 : 40,', 'tessellation: 40,', 1)
          replace('src/game/babylonIceMinePresentation.ts', "const profileName = this.coarse ? 'mobile' : renderBudget.tierName;", 'const profileName = renderBudget.tierName;', 1)
          replace('src/game/babylonIceMinePresentation.ts', 'const reduced = coarse || vfxDensity < 0.55;', 'const reduced = vfxDensity < 0.55;', 1)

          profile_files = [
              'src/game/babylonCryoReservePresentation.ts',
              'src/game/babylonMomentumExchangePresentation.ts',
              'src/game/babylonLatticeAnnexPresentation.ts',
              'src/game/babylonParallaxArrayPresentation.ts',
              'src/game/spinHabitatArchitecture.ts',
              'src/game/jovianHarvesterVisualLanguage.ts',
              'src/game/solarYardVisualProfile.ts',
              'src/game/hecateCapstone.ts',
              'src/game/orphelineCapstone.ts',
              'src/game/perseidCapstone.ts',
              'src/game/k91Capstone.ts',
          ]
          for path in profile_files:
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              out = []
              removed = 0
              i = 0
              while i < len(lines):
                  stripped = lines[i].strip()
                  if stripped.startswith('if (coarse) return {') and "name: 'mobile'" in stripped:
                      removed += 1
                      i += 1
                      continue
                  if stripped == 'if (coarse) {':
                      block = [lines[i]]
                      depth = lines[i].count('{') - lines[i].count('}')
                      i += 1
                      while i < len(lines) and depth > 0:
                          block.append(lines[i])
                          depth += lines[i].count('{') - lines[i].count('}')
                          i += 1
                      if "name: 'mobile'" in ''.join(block):
                          removed += 1
                          continue
                      out.extend(block)
                      continue
                  out.append(lines[i])
                  i += 1
              if removed != 1:
                  raise SystemExit(f'{path}: expected one legacy coarse mobile profile, removed={removed}')
              p.write_text(''.join(out))

          helper_functions = {
              'src/game/babylonAbilityVfx.ts': 'babylonAbilityEffectsMode',
              'src/game/babylonCryoReservePresentation.ts': 'cryoReserveRenderProfile',
              'src/game/babylonEnemyLifecycleVisuals.ts': 'babylonEnemyLifecycleEffectsMode',
              'src/game/babylonEnemyTelegraphs.ts': 'babylonEnemyTelegraphEffectsMode',
              'src/game/babylonIceMinePresentation.ts': 'iceMineFractureBudget',
              'src/game/babylonLatticeAnnexPresentation.ts': 'latticeAnnexRenderProfile',
              'src/game/babylonMomentumExchangePresentation.ts': 'momentumExchangeRenderProfile',
              'src/game/babylonParallaxArrayPresentation.ts': 'parallaxArrayRenderProfile',
              'src/game/babylonProtocolStatusVisuals.ts': 'babylonProtocolStatusEffectsMode',
              'src/game/babylonWeaponVfx.ts': 'babylonWeaponEffectsMode',
              'src/game/hecateCapstone.ts': 'hecateRenderProfile',
              'src/game/jovianHarvesterVisualLanguage.ts': 'jovianHarvesterRenderProfile',
              'src/game/k91Capstone.ts': 'k91RenderProfile',
              'src/game/orphelineCapstone.ts': 'orphelineRenderProfile',
              'src/game/perseidCapstone.ts': 'perseidRenderProfile',
              'src/game/solarYardVisualProfile.ts': 'solarYardRenderProfile',
              'src/game/spinHabitatArchitecture.ts': 'spinHabitatRenderProfile',
          }
          for path, fn in helper_functions.items():
              p = Path(path)
              s = p.read_text()
              pattern = rf'(export function {re.escape(fn)}\([^)]*)\bcoarse: boolean'
              updated, count = re.subn(pattern, r'\1_coarse: boolean', s, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: could not rename unused coarse parameter for {fn}')
              p.write_text(updated)

          for path in [
              'src/game/babylonDamagedVesselPresentation.ts',
              'src/game/babylonOrbitalStationPresentation.ts',
              'src/game/babylonSpinHabitatPresentation.ts',
          ]:
              replace(path, 'private readonly coarse: boolean,', '_coarse: boolean,', 1)

          world = Path('src/game/babylonWorldPresentation.ts')
          s = world.read_text()
          if s.count('  private readonly coarse: boolean;') != 1 or s.count('    this.coarse = coarse;') != 1:
              raise SystemExit('babylonWorldPresentation coarse property anchors changed')
          s = s.replace('  private readonly coarse: boolean;\n', '', 1)
          s = s.replace('constructor(scene: Scene, canvas: HTMLCanvasElement, coarse: boolean)', 'constructor(scene: Scene, canvas: HTMLCanvasElement, _coarse: boolean)', 1)
          s = s.replace('    this.coarse = coarse;\n', '', 1)
          world.write_text(s)

          replace('scripts/browser-runtime-smoke.mjs', 'const expectedPlayerLod = pointerProbe.coarse ? 2 : 1;', "const expectedPlayerLod = state.renderTier === 'performance' ? 2 : 1;", 1)

          replace('tests/babylon-weapon-vfx.ts', "assert.equal(babylonWeaponEffectsMode(1, true), 'reduced', 'Coarse/mobile presentation should keep primary cues while reducing secondary sparks.');", "assert.equal(babylonWeaponEffectsMode(1, true), 'full', 'Coarse/mobile input alone must not reduce weapon effects; measured/explicit quality controls that budget.');", 1)
          replace('tests/babylon-ability-vfx.ts', "assert.equal(babylonAbilityEffectsMode(1, true), 'reduced');", "assert.equal(babylonAbilityEffectsMode(1, true), 'full');", 1)
          replace('tests/babylon-enemy-lifecycle-visuals.ts', "assert.equal(babylonEnemyLifecycleEffectsMode(1, true), 'reduced');", "assert.equal(babylonEnemyLifecycleEffectsMode(1, true), 'full');", 1)
          replace('tests/babylon-enemy-lifecycle-visuals.ts', "assert.equal(canvas.dataset.babylonEnemyLifecycleEffectsMode, 'reduced');", "assert.equal(canvas.dataset.babylonEnemyLifecycleEffectsMode, 'full');", 1)
          replace('tests/babylon-protocol-status-visuals.ts', "  'reduced',\n  'Phone/coarse mode must retain critical shapes while reducing secondary presentation cost.',", "  'full',\n  'Phone/coarse input alone must not lower protocol/status presentation quality.',", 1)
          replace('tests/babylon-enemy-telegraphs.ts', "  'reduced',\n  'Phone/coarse mode should reduce secondary cost without removing attack tells.',", "  'full',\n  'Phone/coarse input alone must not lower telegraph presentation quality.',", 1)
          replace('tests/babylon-enemy-telegraphs.ts', "assert.equal(canvas.dataset.babylonEnemyTelegraphEffectsMode, 'reduced');", "assert.equal(canvas.dataset.babylonEnemyTelegraphEffectsMode, 'full');", 2)

          replace('tests/babylon-jovian-harvester.ts', 'const mobileProfile = jovianHarvesterRenderProfile(1, true);', "const coarseProfile = jovianHarvesterRenderProfile(1, true);\nconst performanceProfile = jovianHarvesterRenderProfile(0.55, true);", 1)
          replace('tests/babylon-jovian-harvester.ts', '&& mobileProfile.deckInstances === 4', '&& coarseProfile.deckInstances === 6', 1)
          replace('tests/babylon-jovian-harvester.ts', '&& mobileProfile.towerInstances === 5', '&& coarseProfile.towerInstances === 5', 1)
          replace('tests/babylon-jovian-harvester.ts', '&& mobileProfile.bridgeInstances === 2', '&& coarseProfile.bridgeInstances === 4', 1)
          replace('tests/babylon-jovian-harvester.ts', "&& mobileProfile.ballastInstances === 2,\n  'P27-C4 Babylon environment must preserve the shared Jovian adaptive structure budget.',", "&& coarseProfile.ballastInstances === 4\n    && performanceProfile.name === 'performance'\n    && performanceProfile.deckInstances === 4\n    && performanceProfile.bridgeInstances === 2\n    && performanceProfile.ballastInstances === 2,\n  'P27-C4 Babylon environment must preserve flagship structure density for coarse input and degrade only with the adaptive render budget.',", 1)

          replace('tests/babylon-ice-mine.ts', 'const mobileFracture = iceMineFractureBudget(true, 1);', "const coarseFracture = iceMineFractureBudget(true, 1);\nconst reducedFracture = iceMineFractureBudget(true, 0.54);", 1)
          replace('tests/babylon-ice-mine.ts', "&& mobileFracture.shardBudget === 4\n    && mobileFracture.crackBudget === 2\n    && mobileFracture.detail === '4-shards+2-cracks+frost-pulse',\n  'P27-C5 Babylon fracture cues must preserve the Three desktop/mobile budgets.',", "&& coarseFracture.shardBudget === 8\n    && coarseFracture.crackBudget === 3\n    && coarseFracture.detail === '8-shards+3-cracks+frost-pulse'\n    && reducedFracture.shardBudget === 4\n    && reducedFracture.crackBudget === 2\n    && reducedFracture.detail === '4-shards+2-cracks+frost-pulse',\n  'P27-C5 Babylon fracture cues must retain flagship density for coarse input and reduce only under the adaptive VFX budget.',", 1)

          replace('tests/babylon-solar-yard.ts', 'const mobile = solarYardRenderProfile(1, true);', 'const coarse = solarYardRenderProfile(1, true);', 1)
          replace('tests/babylon-solar-yard.ts', "assert.equal(mobile.name, 'mobile');\nassert.equal(mobile.ceramicDeckInstances, 4);\nassert.equal(mobile.gantryCraneInstances, 2);\nassert.equal(mobile.sunPatchInstances, 2);", "assert.equal(coarse.name, 'full');\nassert.equal(coarse.ceramicDeckInstances, 6);\nassert.equal(coarse.trussFrameInstances, 5);\nassert.equal(coarse.radiatorTowerInstances, 4);\nassert.equal(coarse.gantryCraneInstances, 2);\nassert.equal(coarse.sunPatchInstances, 3);", 1)

          replace('tests/babylon-lattice-annex.ts', 'const mobile = latticeAnnexRenderProfile(1, true);', 'const coarse = latticeAnnexRenderProfile(1, true);', 1)
          replace('tests/babylon-lattice-annex.ts', "assert.equal(mobile.name, 'mobile');\nassert.equal(mobile.referencePylonInstances, 7);\nassert.equal(mobile.surveyFrameInstances, 4);", "assert.equal(coarse.name, 'full');\nassert.equal(coarse.referencePylonInstances, 9);\nassert.equal(coarse.surveyFrameInstances, 6);\nassert.equal(coarse.massBandInstances, 3);", 1)

          replace('tests/babylon-momentum-exchange.ts', 'const mobile = momentumExchangeRenderProfile(1, true);', 'const coarse = momentumExchangeRenderProfile(1, true);', 1)
          replace('tests/babylon-momentum-exchange.ts', "assert.equal(mobile.name, 'mobile');\nassert.equal(mobile.serviceFrameInstances, 4);\nassert.equal(mobile.impulseBandInstances, 2);", "assert.equal(coarse.name, 'full');\nassert.equal(coarse.flywheelInstances, 3);\nassert.equal(coarse.serviceFrameInstances, 6);\nassert.equal(coarse.transferRailInstances, 4);\nassert.equal(coarse.captureCradleInstances, 3);\nassert.equal(coarse.impulseBandInstances, 3);", 1)

          replace('tests/babylon-cryo-reserve.ts', 'const mobile = cryoReserveRenderProfile(1, true);', 'const coarse = cryoReserveRenderProfile(1, true);', 1)
          replace('tests/babylon-cryo-reserve.ts', "assert.equal(mobile.name, 'mobile');\nassert.equal(mobile.galleryFrameInstances, 4);\nassert.equal(mobile.plumeInstances, 2);", "assert.equal(coarse.name, 'full');\nassert.equal(coarse.tankInstances, 7);\nassert.equal(coarse.galleryFrameInstances, 6);\nassert.equal(coarse.pipeRunInstances, 4);\nassert.equal(coarse.plumeInstances, 3);", 1)

          replace('tests/babylon-parallax-array.ts', "assert.equal(parallaxArrayRenderProfile(1, true).name, 'mobile');", "assert.deepEqual(parallaxArrayRenderProfile(1, true), parallaxArrayRenderProfile(1, false), 'Coarse input alone must preserve the full Parallax Array profile.');", 1)
          replace('tests/babylon-perseid-capstone.ts', "assert.equal(perseidRenderProfile(1, true).name, 'mobile');", "assert.deepEqual(perseidRenderProfile(1, true), perseidRenderProfile(1, false), 'Coarse input alone must preserve the full Perseid capstone profile.');", 1)

          print('P28_A0_COARSE_QUALITY_CEILINGS_REMOVED')
          PY
          git diff --check
          echo '=== remaining coarse production branches (UX/layout/readability references are expected) ==='
          grep -RIn --include='*.ts' -E '\bcoarse\b' src/game | grep -E 'babylon|renderQuality|graphics|runtimeScalability|Capstone|Visual|Architecture' || true
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify full regression and production build
        run: npm run build
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game scripts/browser-runtime-smoke.mjs tests
          git commit -m 'P28-A0 remove remaining coarse render ceilings'
          git push origin HEAD:main
