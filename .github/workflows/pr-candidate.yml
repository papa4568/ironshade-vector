name: PR Candidate Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  candidate-build:
    name: Candidate Build and Full Verification
    concurrency:
      group: pr-candidate-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      browser-required: ${{ steps.scope.outputs.browser-required }}
      candidate-sha: ${{ steps.identity.outputs.candidate-sha }}
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = '10.9.8'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify candidate artifact integrity contract
        run: node agent/tests/candidate-artifact.mjs

      - name: Verify single-producer CI reuse contract
        run: node agent/tests/ci-proof-reuse.mjs

      - name: Enforce mechanical architecture invariants
        run: |
          node agent/tools/check-architecture-invariants.mjs
          node agent/tests/architecture-invariants.mjs

      - name: Verify independent-review contracts
        run: |
          node agent/tools/select-review-task.mjs --json
          node agent/tests/independent-review.mjs

      - name: Audit runtime dependencies once
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if grep -Eq '503 Service Unavailable|performing maintenance|audit endpoint returned an error' <<<"$output"; then
              if [[ "$attempt" -lt 4 ]]; then
                sleep $((attempt * 5))
                continue
              fi
              echo "::warning::npm advisory service unavailable after retries; lockfile remains pinned and this gate will run again on the next candidate."
              exit 0
            fi
            exit "$status"
          done

      - name: Capture EV-7 roadmap shadow simulator advisory evidence
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node agent/tools/roadmap-shadow-simulator.mjs \
            --candidate "$CANDIDATE_SHA" \
            --compile \
            --output .agent-roadmap-shadow/report.json

      - name: Upload EV-7 roadmap shadow simulator advisory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-shadow-simulator-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .agent-roadmap-shadow/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Predict EV-6 causal proof reuse in shadow mode
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          mkdir -p .agent-proof-cache
          node agent/tools/causal-proof-cache.mjs predict \
            --proof full-repository-build \
            --candidate "$CANDIDATE_SHA" \
            --output .agent-proof-cache/prediction.json

      - name: Run full repository verification and production build once
        id: full-verification
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -o pipefail
          mkdir -p .agent-impact-calibration
          npm run build 2>&1 | tee .agent-impact-calibration/full-verification.log

      - name: Capture EV-5 impact-map calibration shadow evidence
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_VERIFICATION_OUTCOME: ${{ steps.full-verification.outcome }}
        run: |
          node agent/tools/impact-map-calibration.mjs observe \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --candidate-sha "$HEAD_SHA" \
            --outcome "$FULL_VERIFICATION_OUTCOME" \
            --log .agent-impact-calibration/full-verification.log \
            --output .agent-impact-calibration/report.json

      - name: Upload EV-5 impact-map calibration advisory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: impact-map-calibration-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .agent-impact-calibration/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Compare EV-6 reuse prediction with the real rerun
        if: always()
        continue-on-error: true
        env:
          FULL_VERIFICATION_OUTCOME: ${{ steps.full-verification.outcome }}
        run: |
          if [[ -f .agent-proof-cache/prediction.json ]]; then
            node agent/tools/causal-proof-cache.mjs observe \
              --prediction .agent-proof-cache/prediction.json \
              --outcome "$FULL_VERIFICATION_OUTCOME" \
              --run-id "$GITHUB_RUN_ID" \
              --output .agent-proof-cache/report.json
          else
            echo "EV6_PROOF_CACHE_PREDICTION_MISSING shadow-only prediction unavailable"
          fi

      - name: Upload EV-6 causal proof cache advisory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: causal-proof-cache-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .agent-proof-cache/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Capture EV-3 behavioral genome shadow evidence
        id: behavioral-genome-shadow
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/run-behavioral-genome-shadow.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --output-dir .agent-genome

      - name: Upload EV-3 behavioral genome advisory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behavioral-genome-shadow-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .agent-genome/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Record candidate identity
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          artifact_name="ironshade-vector-pr-candidate-web-${CANDIDATE_SHA}"
          echo "candidate-sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Create exact candidate web artifact manifest
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node agent/tools/candidate-artifact.mjs create \
            --candidate "$CANDIDATE_SHA" \
            --root dist \
            --build-command 'npm run build' \
            --output .candidate-artifact/candidate-web.json
          node agent/tools/candidate-artifact.mjs validate \
            --candidate "$CANDIDATE_SHA" \
            --root dist \
            --manifest .candidate-artifact/candidate-web.json

      - name: Detect browser validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          browser_required=false
          while IFS= read -r path; do
            case "$path" in
              src/*|tests/*|scripts/*|package.json|package-lock.json|.nvmrc|vite.config.ts|index.html|.github/workflows/browser-e2e.yml|.github/workflows/pr-candidate.yml)
                browser_required=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "browser-required=$browser_required" >> "$GITHUB_OUTPUT"
          echo "PR_CANDIDATE_BROWSER_REQUIRED value=$browser_required"

      - name: Upload exact candidate web bundle
        uses: actions/upload-artifact@v7
        with:
          name: ironshade-vector-pr-candidate-web-${{ github.event.pull_request.head.sha }}
          path: |
            dist/
            .candidate-artifact/candidate-web.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  independent-review-context:
    name: Independent Review Context
    needs: candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate read-only
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-build.outputs.candidate-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Resolve independent-review task
        id: review-task
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { selectReviewTask } from './agent/tools/select-review-task.mjs';
          const selection = await selectReviewTask();
          appendFileSync(process.env.GITHUB_OUTPUT, `task=${selection.taskId}\n`);
          console.log(`INDEPENDENT_REVIEW_TASK task=${selection.taskId} mode=${selection.mode} source=${selection.source}`);
          NODE

      - name: Generate exact candidate review packet
        env:
          TASK_ID: ${{ steps.review-task.outputs.task }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ needs.candidate-build.outputs.candidate-sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p .independent-review
          node agent/tools/candidate-evidence.mjs manifest \
            --task "$TASK_ID" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$HEAD_BRANCH" \
            --output .independent-review/candidate-manifest.json
          node agent/tools/independent-review.mjs packet \
            --manifest .independent-review/candidate-manifest.json \
            --output .independent-review/review-packet.json \
            --verify-git

      - name: Upload read-only independent review context
        uses: actions/upload-artifact@v7
        with:
          name: independent-review-context-${{ github.event.pull_request.number }}-${{ needs.candidate-build.outputs.candidate-sha }}
          path: .independent-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  browser-e2e:
    name: Browser E2E
    needs: candidate-build
    if: needs.candidate-build.outputs.browser-required == 'true'
    uses: ./.github/workflows/browser-e2e.yml
    with:
      candidate_sha: ${{ needs.candidate-build.outputs.candidate-sha }}
      candidate_artifact_name: ${{ needs.candidate-build.outputs.artifact-name }}

  android:
    name: Android PR
    needs: candidate-build
    uses: ./.github/workflows/pr-android-apk.yml
    with:
      candidate_sha: ${{ needs.candidate-build.outputs.candidate-sha }}
      candidate_artifact_name: ${{ needs.candidate-build.outputs.artifact-name }}

  candidate-verification:
    name: PR Candidate Verification
    if: always()
    needs:
      - candidate-build
      - independent-review-context
      - browser-e2e
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require exact candidate technical gates
        env:
          BUILD_RESULT: ${{ needs.candidate-build.result }}
          REVIEW_CONTEXT_RESULT: ${{ needs.independent-review-context.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          BROWSER_REQUIRED: ${{ needs.candidate-build.outputs.browser-required }}
          CANDIDATE_SHA: ${{ needs.candidate-build.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = 'success'
          test "$REVIEW_CONTEXT_RESULT" = 'success'
          test "$ANDROID_RESULT" = 'success'
          if [[ "$BROWSER_REQUIRED" == 'true' ]]; then
            test "$BROWSER_RESULT" = 'success'
          else
            test "$BROWSER_RESULT" = 'skipped'
          fi
          echo "PR_CANDIDATE_TECHNICAL_GATES_PASS candidate=$CANDIDATE_SHA fullVerification=once reviewContext=$REVIEW_CONTEXT_RESULT browser=$BROWSER_RESULT android=$ANDROID_RESULT"

      - name: Check out exact candidate revision for final evidence
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22 for final evidence
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Download exact candidate independent-review packet
        uses: actions/download-artifact@v7
        with:
          name: independent-review-context-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .independent-review

      - name: Fetch trusted PR conversation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq 'add // []' > .independent-review/pr-comments.json

      - name: Require actual exact-SHA independent-review pass
        run: |
          node agent/tools/review-comment-gate.mjs gate \
            --packet .independent-review/review-packet.json \
            --comments .independent-review/pr-comments.json \
            --output .independent-review/review-result.json
          node agent/tools/independent-review.mjs validate-result \
            --packet .independent-review/review-packet.json \
            --result .independent-review/review-result.json

      - name: Generate complete exact-candidate evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          TASK_ID="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('.independent-review/review-packet.json', 'utf8')).taskId)")"
          node agent/tools/candidate-evidence.mjs manifest \
            --task "$TASK_ID" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$HEAD_BRANCH" \
            --output .agent-evidence/candidate-manifest.json
          node agent/tools/candidate-evidence.mjs ledger \
            --manifest .agent-evidence/candidate-manifest.json \
            --pass-kinds test,build,ci,artifact,review,invariant \
            --workflow 'PR Candidate Verification' \
            --run-id "$GITHUB_RUN_ID" \
            --job 'candidate-verification' \
            --output .agent-evidence/verification-ledger.json
          node agent/tools/candidate-evidence.mjs validate \
            --manifest .agent-evidence/candidate-manifest.json \
            --ledger .agent-evidence/verification-ledger.json \
            --verify-git
          echo "PR_CANDIDATE_VERIFICATION_PASS candidate=$HEAD_SHA task=$TASK_ID independentReview=pass"

      - name: Upload complete candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: agent-candidate-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            .agent-evidence/
            .independent-review/review-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
