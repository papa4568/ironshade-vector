name: Temporary C7 verifier patch

on:
  push:
    branches: [p28a0-c7-fix-work]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: p28a0-c7-fix-work
          fetch-depth: 0

      - name: Apply scoped verifier fix and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-runtime-smoke.mjs')
          text = path.read_text()
          old = (
              "  if (viewportMode === 'mobile-landscape') {\n"
              "    await waitFor(\"document.querySelector('canvas')?.dataset.environmentCalibrationMass === 'near-zero-g'\", 'P27-C7 Lattice Annex calibration mass shift', 16_000);\n"
              "  }\n\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one transient C7 mobile wait, found {count}')
          path.write_text(text.replace(old, '', 1))
          PY
          rm .github/workflows/tmp-c7-verifier-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-runtime-smoke.mjs .github/workflows/tmp-c7-verifier-patch.yml
          git diff --cached --check
          git commit -m "Harden Lattice Annex mobile smoke timing"
          git push origin HEAD:p28a0-c7-fix-work
