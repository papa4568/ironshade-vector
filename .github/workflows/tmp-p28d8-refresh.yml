name: P28-D8 Refresh Maintenance

on:
  push:
    branches:
      - chatgpt/p28-d8-refinery-boss-lod0
    paths:
      - 'scripts/tmp-p28d8-refresh.mjs'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out D8 branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d8-refinery-boss-lod0
          fetch-depth: 0

      - name: Apply AO-6 backend-core refresh
        run: node scripts/tmp-p28d8-refresh.mjs

      - name: Commit refresh
        run: |
          set -euo pipefail
          git diff --check
          git add src/game/combatGraphicsBackendCore.ts tests/graphics-asset-pipeline.ts
          if git diff --cached --quiet; then
            echo 'P28-D8 refresh already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P28-D8 adapt boss presentation to backend core'
          git push origin HEAD:chatgpt/p28-d8-refinery-boss-lod0
