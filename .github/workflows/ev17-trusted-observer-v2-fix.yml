name: EV-17 Trusted Observer V2 Correction

on:
  push:
    branches:
      - agent/ev17-proof-cache-calibration
    paths:
      - '.github/workflows/ev17-trusted-observer-v2-fix.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ev17-proof-cache-calibration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Apply trusted observer correction
        run: |
          python3 agent/ev17-fix-trusted-observer-v2.py
          node agent/tools/ev9-trusted-pr-candidate-observer-v2.mjs self-test
          node agent/tools/ev9-trusted-pr-candidate-observer-v8.mjs self-test
          node agent/tests/independent-review.mjs
          node agent/tests/trusted-main-review-gate.mjs
          git diff --check
      - name: Commit trusted observer correction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/tools/ev9-trusted-pr-candidate-observer-v2.mjs
          git diff --cached --check
          git commit -m 'Teach trusted observer the shared build proof'
          git push origin HEAD:agent/ev17-proof-cache-calibration
