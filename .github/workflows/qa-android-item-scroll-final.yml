name: QA Android item inspector final

on:
  push:
    branches:
      - fix/android-item-scroll

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full production validation
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start client
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/ironshade-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ironshade-vite.log
          exit 1
      - name: Touch-scroll and viewport QA
        run: |
          mkdir -p qa-artifacts/android-item-scroll-final
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const report = [];
          try {
            for (const viewport of [{ width: 844, height: 390 }, { width: 740, height: 360 }]) {
              const context = await browser.newContext({ viewport, deviceScaleFactor: 1, hasTouch: true, isMobile: true });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
              page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
              await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
              await page.getByRole('button', { name: 'Equipment' }).click();
              await page.locator('.equipped-card').first().click();
              await page.waitForSelector('.item-inspector.open');
              const inspector = page.locator('.item-inspector.open');
              const body = page.locator('.inspector-scroll');
              const header = page.locator('.inspector-header');
              const actions = page.locator('.inspector-actions');
              const close = page.getByRole('button', { name: 'Back to ship storage' });
              const box = await inspector.boundingBox();
              if (!box) throw new Error('Inspector box unavailable');
              const initial = await inspector.evaluate(el => ({ scrollTop: el.scrollTop, scrollHeight: el.scrollHeight, clientHeight: el.clientHeight, overflowY: getComputedStyle(el).overflowY, touchAction: getComputedStyle(el).touchAction }));
              const bodyStyle = await body.evaluate(el => ({ overflowY: getComputedStyle(el).overflowY, touchAction: getComputedStyle(el).touchAction }));
              const headerStyle = await header.evaluate(el => ({ position: getComputedStyle(el).position, backgroundColor: getComputedStyle(el).backgroundColor }));
              const actionStyle = await actions.evaluate(el => getComputedStyle(el).position);
              if (box.x > 2 || box.y > 2 || box.x + box.width < viewport.width - 2 || box.y + box.height < viewport.height - 2) throw new Error(`Inspector not full-screen: ${JSON.stringify(box)}`);
              if (!['auto', 'scroll'].includes(initial.overflowY) || initial.scrollHeight <= initial.clientHeight) throw new Error(`Inspector not native scroll surface: ${JSON.stringify(initial)}`);
              if (bodyStyle.overflowY !== 'visible' || bodyStyle.touchAction !== 'auto') throw new Error(`Nested scroll still active: ${JSON.stringify(bodyStyle)}`);
              if (headerStyle.position !== 'sticky' || headerStyle.backgroundColor !== 'rgb(7, 16, 14)') throw new Error(`Header is not sticky/opaque: ${JSON.stringify(headerStyle)}`);
              if (actionStyle !== 'fixed') throw new Error(`Action dock is not fixed: ${actionStyle}`);
              await page.screenshot({ path: `qa-artifacts/android-item-scroll-final/before-${viewport.width}x${viewport.height}.png`, fullPage: false });
              const client = await context.newCDPSession(page);
              const x = Math.round(box.x + box.width * 0.55);
              const startY = Math.round(box.y + box.height * 0.72);
              const endY = Math.round(box.y + box.height * 0.28);
              await client.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x, y: startY, radiusX: 4, radiusY: 4, force: 1 }] });
              for (let step = 1; step <= 8; step++) {
                const y = Math.round(startY + (endY - startY) * step / 8);
                await client.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x, y, radiusX: 4, radiusY: 4, force: 1 }] });
                await page.waitForTimeout(25);
              }
              await client.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
              await page.waitForTimeout(350);
              const after = await inspector.evaluate(el => ({ scrollTop: el.scrollTop, scrollHeight: el.scrollHeight, clientHeight: el.clientHeight }));
              if (after.scrollTop < 20) throw new Error(`Finger swipe did not scroll: ${JSON.stringify(after)}`);
              const closeBox = await close.boundingBox();
              const actionsBox = await actions.boundingBox();
              if (!closeBox || closeBox.y < -1 || closeBox.y + closeBox.height > viewport.height + 1) throw new Error('Back control left viewport');
              if (!actionsBox || actionsBox.y < 0 || actionsBox.y + actionsBox.height > viewport.height + 1) throw new Error('Action dock left viewport');
              if (errors.length) throw new Error(errors.join(' | '));
              await page.screenshot({ path: `qa-artifacts/android-item-scroll-final/after-${viewport.width}x${viewport.height}.png`, fullPage: false });
              report.push({ viewport, initial, bodyStyle, headerStyle, after, closeBox, actionsBox });
              await context.close();
            }
            writeFileSync('qa-artifacts/android-item-scroll-final/report.json', JSON.stringify(report, null, 2));
            console.log('ANDROID_ITEM_FINAL_QA_PASS', JSON.stringify(report.map(x => ({ viewport: x.viewport, scrollTop: x.after.scrollTop, scrollHeight: x.after.scrollHeight }))));
          } finally {
            await browser.close();
          }
          JS
      - name: Upload QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-item-scroll-final-qa
          path: qa-artifacts/android-item-scroll-final
          if-no-files-found: warn
