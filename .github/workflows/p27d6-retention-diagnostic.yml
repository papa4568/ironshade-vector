name: P27-D6 Retention Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p27d6-retention-diagnostic.yml'

permissions:
  contents: read

jobs:
  retention-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 0.0.1-d6diag.${{ github.run_number }}
      ANDROID_P27D6_SOAK_MINUTES: '6'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate native Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Build diagnostic APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run short retention diagnostic
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          script: ANDROID_P27D6_SOAK_MINUTES="${{ env.ANDROID_P27D6_SOAK_MINUTES }}" bash scripts/android-babylon-resource-soak.sh

      - name: Upload retention evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ironshade-vector-p27d6-retention-diagnostic
          path: |
            android-p27d6-babylon-soak.json
            android-p27d6-retention-census.jsonl
            android-p27d6-memory.txt
            android-p27d6-memory-summary.json
            android-p27d6-logcat.txt
            android-p27d6-final.png
          if-no-files-found: warn
          retention-days: 14
