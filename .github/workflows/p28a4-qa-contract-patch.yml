name: P28-A4 QA contract patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p28a4-qa-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update browser shadow expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/browser-runtime-smoke.mjs')
          text = path.read_text()
          old_budget = "const lightingBudgetMatch = /^tier:(high|balanced|performance)\\|ibl:(1\\.00|0\\.70|0\\.38)\\|shadow:(0|512|1024)\\|practical:(1|2)\\|max-lights:(3|5|6)$/.exec(state.lightingBudget);"
          new_budget = "const lightingBudgetMatch = /^tier:(high|balanced|performance)\\|ibl:(1\\.00|0\\.70|0\\.38)\\|shadow:(0|1024|2048)\\|practical:(1|2)\\|max-lights:(3|5|6)$/.exec(state.lightingBudget);"
          old_shadow = "|| !/^key:(512|1024):pcf-low:casters-\\d+$|^key:off$/.test(state.environmentShadowBudget)"
          new_shadow = "|| !/^key:(1024|2048):pcf-high:bias-0\\.00035:normal-0\\.012:coverage-34:snap-1\\.5:casters-\\d+$|^key:off$/.test(state.environmentShadowBudget)"
          if text.count(old_budget) != 1:
              raise SystemExit(f'expected one old lighting budget contract, found {text.count(old_budget)}')
          if text.count(old_shadow) != 1:
              raise SystemExit(f'expected one old shadow budget contract, found {text.count(old_shadow)}')
          text = text.replace(old_budget, new_budget).replace(old_shadow, new_shadow)
          path.write_text(text)
          PY
      - name: Commit QA contract correction
        run: |
          git diff --check
          git diff -- scripts/browser-runtime-smoke.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/browser-runtime-smoke.mjs
          git commit -m "Update browser shadow QA contract for P28-A4"
          git push origin HEAD:main
