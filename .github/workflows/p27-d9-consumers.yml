name: P27 D9 Consumer Audit

on:
  push:
    branches:
      - p27-d9-babylon-cleanup
    paths:
      - '.github/workflows/p27-d9-consumers.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enumerate legacy helper consumers
        shell: bash
        run: |
          set -euo pipefail
          for symbol in hardSciFiVisuals mapVisuals refineryBloom refineryIbl threeCombatRenderer webGpuRefineryRenderer; do
            echo "=== ${symbol} ==="
            git grep -n -C 2 "$symbol" -- ':!docs/content-roadmap-archive.md' ':!docs/content-roadmap.md' || true
          done
