name: Temporary P28-PLOAD1 Closeout Helper

on:
  push:
    branches:
      - agent/p28-pload1-batched-refinery-instantiation

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message == 'Add temporary P28-PLOAD1 closeout helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/p28-pload1-batched-refinery-instantiation
          fetch-depth: 0

      - name: Archive verified P28-PLOAD1 and sync roadmap metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/content-roadmap.md')
          roadmap_text = roadmap.read_text()
          task_line = "- [ ] **P28-PLOAD1 — Remove serialized map-instantiation bottlenecks** — Replace the refinery environment's nested serial `await runtime.instantiate(...)` placement loop with bounded parallel/batched instantiation that reuses each preloaded family container and existing Babylon native instancing where valid, without changing placement transforms, LOD selection, collision ownership, or visible Flagship quality. Keep expensive texture/material initialization shared instead of repeating work per placement. **Done when:** deterministic cold-load profiling shows placement creation no longer scales as one awaited chain across the full refinery placement count, source-family loads remain deduplicated, final placement/asset counts and transforms are unchanged, cancellation/teardown releases partial batches correctly, and standard production/CI/APK gates pass.\n"
          if roadmap_text.count(task_line) != 1:
              raise SystemExit(f'expected exactly one active P28-PLOAD1 entry, found {roadmap_text.count(task_line)}')
          roadmap_text = roadmap_text.replace(task_line + '\n', '', 1)
          roadmap.write_text(roadmap_text)

          archive = Path('docs/content-roadmap-archive.md')
          archive_text = archive.read_text()
          anchor = '## P28 — Babylon flagship visual-quality overhaul\n\n'
          if archive_text.count(anchor) != 1:
              raise SystemExit('P28 archive anchor mismatch')
          entry = '''- [x] **P28-PLOAD1 — Remove serialized map-instantiation bottlenecks** — Completed 2026-10-10 by replacing the refinery environment's per-placement serial await chain with deterministic bounded batches of four while preserving source-family reuse, Babylon native instancing, placement transforms, LOD choice, and existing presentation ownership.\n  - The production refinery loader preloads the 11 selected source families once, then creates the established 73 authored placements as 19 ordered batches (`4 × 18 + 1`) with a measured peak of four in-flight instantiations. Placement mounting remains in original order, and the same loaded family containers continue to back native Babylon instances rather than repeating source/material initialization per placement.\n  - `tests/p28-pload1-refinery-placement-runtime.ts` executes the real private refinery load path under Babylon NullEngine and proves two deterministic cold-load profiles, exact 73-placement accounting, 19 batches, peak concurrency 4, source-family deduplication, normal teardown, instantiate-rejection recovery, fulfilled-batch mount/premium-surface failure recovery, and in-flight cancellation via `releaseRefineryEnvironment`. The exact implementation proof emits `P28_PLOAD1_RUNTIME_PROFILE_PASS placements=73 batches=19 batchSize=4 peak=4 sourceFamilies=11 failureRecovery=fulfilled+mounted-release mountFailure=fulfilled-batch-release cancellation=releaseRefineryEnvironment deterministicRuns=2`.\n  - An adversarial trusted-main review found and drove closure of one fulfilled-batch ownership gap: if mounting a fulfilled instance threw after `Promise.allSettled`, current/later fulfilled instances could escape the outer mounted-instance list. The final implementation tracks unmounted fulfilled batch instances explicitly and releases them before propagating the mount error; the runtime regression fails inside the second fulfilled batch and proves all eight fulfilled instances are released.\n  - Exact implementation head `207274334514594547afe5eca8530cdea02f3687` on PR #345 passed Agent Orchestration run `38115851732` and PR Candidate Verification run `38115851910`, including full repository verification/production build, desktop and mobile-landscape browser journeys, APK build/delivery verification, API 35 product smoke, Android 16/API 36 large-screen smoke, aggregate Android verification, and complete exact-candidate evidence. Trusted independent review run `38115878477` passed the same exact SHA with no findings (comment `6106050197`).\n  - Candidate web artifact `ironshade-vector-pr-candidate-web-207274334514594547afe5eca8530cdea02f3687` is `11692934261` (digest `sha256:985e07423ed1fb2f0d8f140695188fe3da80e4950fef5fc8116a4c1242954871`). Browser evidence artifacts are desktop `11692684952` (digest `sha256:37c6ba045dca0376da94262089abbcca5e9bdec0be6b49b8c7d0526186582734`) and mobile-landscape `11693473696` (digest `sha256:8fe473fbd1d3e245a33d212867f613ca9e8036e4e527ec053a03a221c661c991`). Candidate evidence artifact `11693810459` has digest `sha256:fde8f972dd5d7ade91d21a5699b4fa932fbabd8ad966b74ccc00d9153a57ef92`.\n  - Verified implementation APK artifact `ironshade-vector-pr-android-apk` is `11693815272` (artifact digest `sha256:577630b30046a8430c6d89de766eaa52f9a9a2c5c1585432828b53d96b3d645a`) and contains `Ironshade-Vector-Android-Debug.apk` (10,593,963 bytes; package `app.ironshade.vector`; version `0.0.1-pr.305 (305)`; min SDK 24; target SDK 36; APK SHA-256 `40bb511d17eca3aec2a8cc628a43b83d5aba9fcf9470e5afb5146fe9954c73df`; APK Signature Scheme v2 verified). API 35 evidence artifact `11693364037` (digest `sha256:e86e27ec4496b66b5785653f8054796fbd868d60a65eef4aed20a537abce0c91`) and API 36 artifact `11693109372` (digest `sha256:3799073a133d5597617e58d363e1326e2c775efdd90816283d47a32147595e1e`) preserve emulator evidence for the same exact implementation APK. The final closeout head reruns the same exact-candidate gates before merge.\n  - **Next: P28-PLOAD2 — Add cold/warm map-load timing and readiness regression coverage.**\n\n'''
          archive.write_text(archive_text.replace(anchor, anchor + entry, 1))
          PY

          node agent/tools/sync-roadmap-metadata.mjs --write
          git diff --check
          node agent/tools/sync-roadmap-metadata.mjs --check
          git diff -- docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json

      - name: Commit closeout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git commit -m 'Archive verified P28-PLOAD1'
          git push origin HEAD:agent/p28-pload1-batched-refinery-instantiation
