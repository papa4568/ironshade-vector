name: P28 B3 Bootstrap

on:
  push:
    branches:
      - p28-b3-refinery-cover-crate-pbr

permissions:
  contents: write

concurrency:
  group: p28-b3-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: p28-b3-refinery-cover-crate-pbr

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = '10.9.8'

      - name: Apply P28-B3 implementation
        run: |
          node scripts/p28-b3-bootstrap-fix.mjs
          node scripts/p28-b3-bootstrap.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare graphics assets
        run: npm run prepare:graphics-assets

      - name: Run P28-B3 targeted content tests
        run: |
          node tests/refinery-premium-surfaces.mjs
          node tests/refinery-cover-crate-premium-surfaces.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/p28-b3-bootstrap.mjs .github/workflows/p28-b3-bootstrap.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement P28-B3 premium cover and crate materials'
          git push origin HEAD:p28-b3-refinery-cover-crate-pbr
