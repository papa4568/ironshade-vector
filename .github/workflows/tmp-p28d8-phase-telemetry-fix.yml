name: P28-D8 Phase Telemetry Maintenance

on:
  push:
    branches:
      - chatgpt/p28-d8-refinery-boss-lod0
    paths:
      - 'scripts/tmp-p28d8-phase-telemetry-fix.mjs'
      - '.github/workflows/tmp-p28d8-phase-telemetry-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d8-refinery-boss-lod0
          fetch-depth: 0
      - run: node scripts/tmp-p28d8-phase-telemetry-fix.mjs
      - run: |
          set -euo pipefail
          git diff --check
          git add src/game/babylonRefineryBossPresentation.ts scripts/p28d8-boss-capture.mjs tests/refinery-boss-lod0.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate boss presentation phase telemetry'
          git push origin HEAD:chatgpt/p28-d8-refinery-boss-lod0
