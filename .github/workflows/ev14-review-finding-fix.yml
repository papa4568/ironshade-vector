name: EV-14 Review Finding Fix

on:
  push:
    branches:
      - agent/ev14-promote-candidate-artifact-antibody

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out branch head
        uses: actions/checkout@v7
        with:
          ref: agent/ev14-promote-candidate-artifact-antibody
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply and verify trusted-review finding fix
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new, 1))

          governance = 'agent/tools/antibody-governance.mjs'
          replace_once(
              governance,
              """async function countDecisionRecords(directory) {
            try {
              const entries = await readdir(resolve(directory), { withFileTypes: true });
              return entries.filter(entry => entry.isFile() && entry.name.endsWith('.json')).length;
            } catch (error) {
              if (error && typeof error === 'object' && error.code === 'ENOENT') return 0;
              throw error;
            }
          }
          """,
              """async function inspectDecisionRecords(directory) {
            try {
              const entries = await readdir(resolve(directory), { withFileTypes: true });
              const jsonEntries = entries.filter(entry => entry.isFile() && entry.name.endsWith('.json'));
              const records = [];
              for (const entry of jsonEntries) {
                let record;
                try {
                  record = JSON.parse(await readFile(resolve(directory, entry.name), 'utf8'));
                } catch {
                  throw new Error(`committed antibody decision record is not valid JSON: ${entry.name}`);
                }
                assertObject(record, `committed antibody decision ${entry.name}`);
                assertObject(record.review, `committed antibody decision ${entry.name}.review`);
                assert(/^EV-\\d+$/.test(record.review.taskId ?? ''), `committed antibody decision ${entry.name}.review.taskId must be an EV task`);
                records.push(record);
              }
              const decisionTaskIds = records.map(record => record.review.taskId).sort((left, right) => left.localeCompare(right));
              return {
                decisionRecordCount: records.length,
                ev13DecisionRecordCount: decisionTaskIds.filter(taskId => taskId === 'EV-13').length,
                decisionTaskIds,
              };
            } catch (error) {
              if (error && typeof error === 'object' && error.code === 'ENOENT') {
                return { decisionRecordCount: 0, ev13DecisionRecordCount: 0, decisionTaskIds: [] };
              }
              throw error;
            }
          }
          """,
          )
          replace_once(governance, "  decisionRecordCount = null,\n", "")
          replace_once(governance, "  const recordCount = decisionRecordCount ?? await countDecisionRecords(policy.decisions.directory);\n", "  const decisionState = await inspectDecisionRecords(policy.decisions.directory);\n")
          replace_once(governance, "    && (!policy.decisions.allowCommittedDecisionsInEv13 ? recordCount === 0 : true)\n", "    && (!policy.decisions.allowCommittedDecisionsInEv13 ? decisionState.ev13DecisionRecordCount === 0 : true)\n")
          replace_once(
              governance,
              "      decisionRecordCount: recordCount,\n",
              "      decisionRecordCount: decisionState.decisionRecordCount,\n      ev13DecisionRecordCount: decisionState.ev13DecisionRecordCount,\n      decisionTaskIds: decisionState.decisionTaskIds,\n",
          )

          Path('agent/tools/antibody-governance-evidence.mjs').write_text(r'''import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          import { canonicalJson } from './repository-immune-system.mjs';
          import { runAntibodyGovernanceAssessment } from './antibody-governance.mjs';

          const SHA_PATTERN = /^[a-f0-9]{40}$/;
          const METRIC_KEYS = [
            'transitionFalsePositives',
            'transitionFalseNegatives',
            'promotionFalsePositives',
            'promotionFalseNegatives',
          ];

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function readJson(path) {
            return JSON.parse(await readFile(resolve(path), 'utf8'));
          }

          export async function verifyAntibodyGovernanceEvidence(report, policy, calibration, ev12Corpus, memory, {
            candidateSha,
            requirePass = false,
            governanceOverride = null,
          } = {}) {
            assert(SHA_PATTERN.test(candidateSha ?? ''), 'candidateSha must be a full lowercase commit SHA');
            const expected = await runAntibodyGovernanceAssessment(policy, calibration, ev12Corpus, memory, {
              candidateSha,
              governanceOverride,
            });
            assert(canonicalJson(report) === canonicalJson(expected), 'antibody governance report does not match exact candidate policy/corpus/memory/repository-history recomputation');
            assert(report.enforcementEnabled === false, 'EV-13 must not enable antibody enforcement');
            assert(report.acceptedForEnforcement === false, 'EV-13 must not accept an antibody for enforcement');
            assert(report.candidatePassGranted === false, 'EV-13 evidence must never grant candidate acceptance');
            assert(report.lifecycle.trustedReviewProvenanceRequired === true, 'EV-13 must require GitHub-backed trusted review provenance');
            assert(report.lifecycle.reviewBoundToDecisionDigest === true, 'EV-13 must bind trusted review to the exact committed decision digest');
            assert(report.lifecycle.exactCommittedDecisionRequired === true, 'EV-13 authorization must load the exact committed decision from the reviewed candidate');
            assert(report.lifecycle.repositoryPinnedInputsRequired === true, 'EV-13 authorization must load pinned policy/calibration inputs from the reviewed candidate');
            assert(report.lifecycle.completeReviewHistoryRequired === true, 'EV-13 authorization must inspect complete PR review history');
            assert(report.lifecycle.canonicalSourceEntryRequired === true, 'EV-13 must verify the named canonical source entry exists');
            assert(report.lifecycle.canonicalSourceContractRequired === true, 'EV-13 must bind focused-regression and telemetry sources to the exact proposed target contract');
            assert(report.lifecycle.directDecisionEvaluatorExported === false, 'EV-13 must not expose a raw decision evaluator that bypasses trusted authorization');
            assert(report.ev12.pinnedCorpusDigestVerified === true, 'EV-13 must verify the policy-pinned EV-12 corpus digest');
            assert(report.ev12.pinnedFailureMemoryDigestVerified === true, 'EV-13 must verify the policy-pinned EV-4 failure-memory digest');
            assert(report.rollback.sourceFailureMemoryUnchanged === true, 'EV-13 must prove failure memory is unchanged');
            assert(report.rollback.ev4ModeRemainsAdvisory === true, 'EV-13 must leave EV-4 failure memory advisory');
            assert(report.rollback.existingEnforcementChanged === false, 'EV-13 rollback must not change existing enforcement');
            assert(report.rollback.disabledPromotionAuthorizations === 0, 'EV-13 rollback must disable every promotion authorization');
            assert(report.rollback.evidenceStillMeasured === true, 'EV-13 rollback must preserve the same measured governance evidence');

            if (requirePass) {
              assert(report.governancePass === true, 'EV-13 closeout requires exact-candidate governance validation to pass');
              assert(report.ev12.calibrationPass === true && report.ev12.eligibleScopeWithinBudget === true, 'EV-13 closeout requires exact-candidate EV-12 eligibility proof');
              assert(report.lifecycle.ev13DecisionRecordCount === 0, 'EV-13 closeout must prove EV-13 authored no committed antibody decisions');
              assert(report.calibration.withinBudget === true, 'EV-13 governance calibration must stay within its zero-error budget');
              for (const key of METRIC_KEYS) assert(report.calibration.measuredErrors[key] === 0, `EV-13 closeout ${key} must be zero`);
            }
            return report;
          }

          function parseArguments(argv) {
            const options = {
              candidateSha: null,
              policy: 'agent/antibody-governance-policy.json',
              calibration: 'agent/antibody-governance-calibration-corpus.json',
              ev12Corpus: 'agent/failure-recurrence-calibration-corpus.json',
              memory: 'agent/failure-memory.json',
              report: null,
              disabled: false,
              requirePass: false,
            };
            for (let index = 0; index < argv.length; index += 1) {
              const argument = argv[index];
              if (argument === '--candidate-sha') options.candidateSha = argv[++index] ?? null;
              else if (argument === '--policy') options.policy = argv[++index] ?? null;
              else if (argument === '--calibration') options.calibration = argv[++index] ?? null;
              else if (argument === '--ev12-corpus') options.ev12Corpus = argv[++index] ?? null;
              else if (argument === '--memory') options.memory = argv[++index] ?? null;
              else if (argument === '--report') options.report = argv[++index] ?? null;
              else if (argument === '--disabled') options.disabled = true;
              else if (argument === '--require-pass') options.requirePass = true;
              else throw new Error(`unknown argument ${argument}`);
            }
            assert(options.report, '--report is required');
            return options;
          }

          async function main() {
            const options = parseArguments(process.argv.slice(2));
            const [policy, calibration, ev12Corpus, memory, report] = await Promise.all([
              readJson(options.policy),
              readJson(options.calibration),
              readJson(options.ev12Corpus),
              readJson(options.memory),
              readJson(options.report),
            ]);
            await verifyAntibodyGovernanceEvidence(report, policy, calibration, ev12Corpus, memory, {
              candidateSha: options.candidateSha,
              requirePass: options.requirePass,
              governanceOverride: options.disabled ? false : null,
            });
            console.log(`ANTIBODY_GOVERNANCE_EVIDENCE_PASS candidate=${options.candidateSha} governancePass=${report.governancePass} requirePass=${options.requirePass} enforcement=${report.enforcementEnabled}`);
          }

          const isMain = process.argv[1] && resolve(process.argv[1]) === fileURLToPath(import.meta.url);
          if (isMain) {
            main().catch(error => {
              console.error(error instanceof Error ? error.message : String(error));
              process.exitCode = 1;
            });
          }
          '''.replace('\n          ', '\n').lstrip())

          tests = 'agent/tests/antibody-governance.mjs'
          replace_once(tests, "import { readFile } from 'node:fs/promises';", "import { readFile, readdir } from 'node:fs/promises';")
          replace_once(
              tests,
              """const report = await runAntibodyGovernanceAssessment(policy, calibration, ev12Corpus, memory, {
            candidateSha,
            decisionRecordCount: 0,
          });
          """,
              """let liveDecisionRecordCount = 0;
          try {
            liveDecisionRecordCount = (await readdir(new URL('../antibody-decisions/', import.meta.url), { withFileTypes: true }))
              .filter(entry => entry.isFile() && entry.name.endsWith('.json')).length;
          } catch (error) {
            if (!(error && typeof error === 'object' && error.code === 'ENOENT')) throw error;
          }
          const report = await runAntibodyGovernanceAssessment(policy, calibration, ev12Corpus, memory, { candidateSha });
          """,
          )
          replace_once(
              tests,
              "assert.equal(report.lifecycle.decisionRecordCount, 0, 'EV-13 must not commit an accepted antibody record');\n",
              "assert.equal(report.lifecycle.decisionRecordCount, liveDecisionRecordCount, 'governance evidence must report the actual committed antibody decision count');\nassert.equal(report.lifecycle.ev13DecisionRecordCount, 0, 'EV-13 itself must not author a committed antibody decision');\nassert.equal(report.lifecycle.decisionTaskIds.filter(taskId => taskId === 'EV-14').length, liveDecisionRecordCount, 'the current committed decision history must be attributed to EV-14 rather than hidden from EV-13 evidence');\n",
          )
          replace_once(tests, "  decisionRecordCount: 0,\n", "")
          replace_once(
              tests,
              "  () => runAntibodyGovernanceAssessment(policy, calibration, tamperedCorpus, memory, { candidateSha, decisionRecordCount: 0 }),\n",
              "  () => runAntibodyGovernanceAssessment(policy, calibration, tamperedCorpus, memory, { candidateSha }),\n",
          )
          replace_once(
              tests,
              "assert.equal(report.rollback.existingEnforcementChanged, false, 'EV-13 rollback must leave existing verification semantics intact');\n",
              "assert.equal(report.rollback.existingEnforcementChanged, false, 'EV-13 rollback must leave existing verification semantics intact');\nconst legacyOverrideAttempt = await runAntibodyGovernanceAssessment(policy, calibration, ev12Corpus, memory, { candidateSha, decisionRecordCount: 0 });\nassert.equal(legacyOverrideAttempt.lifecycle.decisionRecordCount, liveDecisionRecordCount, 'caller-supplied decision-count hints must not replace repository decision history');\n",
          )

          workflow = Path('.github/workflows/ev13-antibody-governance.yml')
          text = workflow.read_text()
          start_marker = '      - name: Generate and verify exact-SHA EV-13 governance evidence\n'
          end_marker = '      - name: Upload exact-SHA EV-13 governance evidence\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          dollar = '$'
          replacement = f'''      - name: Generate and verify exact-SHA EV-13 governance evidence
            env:
              CANDIDATE_SHA: {dollar}{{{{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}}}
            run: |
              set -euo pipefail
              test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
              mkdir -p .agent-antibody-governance
              node agent/tools/antibody-governance.mjs \\
                --candidate-sha "$CANDIDATE_SHA" \\
                --output .agent-antibody-governance/governance.json
              node agent/tools/antibody-governance-evidence.mjs \\
                --candidate-sha "$CANDIDATE_SHA" \\
                --report .agent-antibody-governance/governance.json \\
                --require-pass
              IRONSHADE_ANTIBODY_GOVERNANCE=0 node agent/tools/antibody-governance.mjs \\
                --candidate-sha "$CANDIDATE_SHA" \\
                --output .agent-antibody-governance/rollback.json
              node agent/tools/antibody-governance-evidence.mjs \\
                --candidate-sha "$CANDIDATE_SHA" \\
                --report .agent-antibody-governance/rollback.json \\
                --disabled

          '''
          workflow.write_text(text[:start] + replacement + text[end:])

          replace_once(
              'docs/experimental-verification-archive.md',
              "- Preserved EV-13 as the historical governance-only zero-decision calibration by making its evidence workflow explicitly recompute the EV-13 closeout state with `decisionRecordCount=0`; EV-14 authorization separately validates the actual complete live decision history from the reviewed candidate.\n",
              "- Preserved EV-13's historical no-decision guarantee without hiding later governance history: EV-13 evidence now reads the actual committed decision directory, requires that EV-13 itself authored zero decision records, and reports later EV-14 decision records instead of overriding the live count. EV-14 authorization separately validates the complete append-only lifecycle history from the reviewed candidate.\n",
          )

          Path('.github/workflows/ev14-review-finding-fix.yml').unlink()
          PY
          node agent/tests/antibody-governance.mjs
          node agent/tests/antibody-promotion.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/tools/antibody-governance.mjs agent/tools/antibody-governance-evidence.mjs agent/tests/antibody-governance.mjs .github/workflows/ev13-antibody-governance.yml docs/experimental-verification-archive.md .github/workflows/ev14-review-finding-fix.yml
          git diff --cached --check
          git commit -m 'Harden EV-13 live decision accounting'
          git push origin HEAD:agent/ev14-promote-candidate-artifact-antibody
