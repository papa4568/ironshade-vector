name: EV-19 Roadmap Shadow Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agent/roadmap-shadow-validation-corpus.json'
      - 'agent/tools/roadmap-shadow-validation.mjs'
      - 'agent/tests/roadmap-shadow-validation.mjs'
      - 'agent/tools/experimental-review-task.mjs'
      - 'agent/roadmap-shadow-simulator.json'
      - 'agent/roadmap-shadow-simulator.schema.json'
      - 'agent/tools/roadmap-shadow-simulator.mjs'
      - 'agent/tests/roadmap-shadow-simulator.mjs'
      - '.github/workflows/ev19-roadmap-shadow-validation.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - 'agent/roadmap-shadow-validation-corpus.json'
      - 'agent/tools/roadmap-shadow-validation.mjs'
      - 'agent/tests/roadmap-shadow-validation.mjs'
      - 'agent/tools/experimental-review-task.mjs'
      - 'agent/roadmap-shadow-simulator.json'
      - 'agent/roadmap-shadow-simulator.schema.json'
      - 'agent/tools/roadmap-shadow-simulator.mjs'
      - 'agent/tests/roadmap-shadow-simulator.mjs'
      - '.github/workflows/ev19-roadmap-shadow-validation.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Exact Candidate Roadmap Shadow Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Fetch pinned P28-PLOAD2 implementation outcome
        run: |
          set -euo pipefail
          expected=8215139c7146c25940f873dc038a85677952f201
          git fetch --no-tags origin "$expected"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git cat-file -e "$expected^{commit}"

      - name: Run EV-7 isolation and EV-19 classifier regressions
        run: |
          node agent/tests/roadmap-shadow-simulator.mjs
          node agent/tests/roadmap-shadow-validation.mjs

      - name: Generate exact-SHA EV-19 validation evidence
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p .agent-roadmap-shadow-validation-ev19
          node agent/tools/roadmap-shadow-validation.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-roadmap-shadow-validation-ev19/validation.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.agent-roadmap-shadow-validation-ev19/validation.json', 'utf8'));
          const fail = message => { throw new Error(`EV19_EXACT_EVIDENCE_FAIL ${message}`); };
          if (report.taskId !== 'EV-19' || report.candidateSha !== process.env.CANDIDATE_SHA) fail('task/candidate binding mismatch');
          if (report.mode !== 'advisory' || report.acceptedForEnforcement !== false || report.candidatePassGranted !== false || report.blocking !== false) fail('EV-19 must remain advisory and grant no acceptance');
          if (report.prediction.candidateSha !== 'd1ddb444ba86c9b23b97b0e1987486b6ebc6cca0' || report.prediction.configBlobSha !== '522efd6e86b0dfde647b3fbfc981c995c216e165') fail('EV-7 prediction provenance drifted');
          if (report.prediction.frictionScore !== 1 || report.prediction.rewritePressure !== 'low') fail('EV-7 frozen prediction metrics drifted');
          if (report.actualOutcome.pullRequest !== 366 || report.actualOutcome.baseSha !== '9cf041f1c26ee7050f7e5cc4cad3f320b8feefb8' || report.actualOutcome.headSha !== '8215139c7146c25940f873dc038a85677952f201') fail('P28-PLOAD2 outcome binding drifted');
          if (report.actualOutcome.revisionCount !== 10 || report.actualOutcome.productionSurfaceCount !== 4 || report.actualOutcome.testSurfaceCount !== 3) fail('P28-PLOAD2 measured implementation surface changed');
          if (report.metrics.evaluatedSignalCount !== 3 || report.metrics.usefulPredictionCount !== 2 || report.metrics.falsePositives !== 0 || report.metrics.falseNegatives !== 1) fail('EV-19 measured prediction matrix drifted');
          if (report.metrics.falsePositiveRate !== 0 || report.metrics.falseNegativeRate !== 1) fail('EV-19 error-rate accounting drifted');
          const expectedSupported = ['shared-readiness-boundary','renderer-boundary-independence'];
          if (JSON.stringify(report.supportedSignals) !== JSON.stringify(expectedSupported)) fail('EV-20 review-only signal set drifted');
          if (!report.signals.filter(signal => expectedSupported.includes(signal.id)).every(signal => signal.revisionObservations?.observedRevisionCount === 10 && signal.revisionObservations?.matchingPredictionCount === 10 && signal.revisionObservations?.repeatable === true)) fail('repeatable signal evidence incomplete');
          const surface = report.signals.find(signal => signal.id === 'surface-count-pressure');
          if (!surface || surface.classification !== 'false-negative' || surface.actualPressure !== true) fail('missed surface pressure is no longer visible');
          if (report.unsupportedScenarios.length !== 1 || report.unsupportedScenarios[0].taskId !== 'P28-G1') fail('unsupported P28-G1 scope must remain explicit');
          if (report.conclusion.repeatablePredictiveValueFound !== true || report.conclusion.lowFrictionScoreValidated !== false || report.conclusion.surfacePressurePredictionValidated !== false || report.conclusion.enforcementEligible !== false) fail('EV-19 conclusion boundary drifted');
          if (report.isolation.temporaryProbesPersisted !== false || report.isolation.productRuntimeMutated !== false || report.isolation.simulatorScoringChanged !== false || report.isolation.exactHeadRestored !== true || report.isolation.trackedStateRestored !== true) fail('EV-19 isolation/rollback contract failed');
          console.log(`EV19_EXACT_EVIDENCE_PASS candidate=${report.candidateSha} actual=${report.actualOutcome.headSha} revisions=${report.actualOutcome.revisionCount} useful=${report.metrics.usefulPredictionCount} fp=${report.metrics.falsePositives} fn=${report.metrics.falseNegatives} supported=${report.supportedSignals.join(',')} enforcement=false`);
          NODE

      - name: Upload exact-SHA EV-19 validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-shadow-validation-ev19-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-roadmap-shadow-validation-ev19/validation.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
