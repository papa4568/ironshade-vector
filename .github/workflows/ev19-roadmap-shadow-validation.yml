name: EV-19 Roadmap Shadow Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'agent/roadmap-shadow-validation-corpus.json'
      - 'agent/tools/roadmap-shadow-validation.mjs'
      - 'agent/tests/roadmap-shadow-validation.mjs'
      - 'agent/tools/experimental-review-task.mjs'
      - 'agent/roadmap-shadow-simulator.json'
      - 'agent/roadmap-shadow-simulator.schema.json'
      - 'agent/tools/roadmap-shadow-simulator.mjs'
      - 'agent/tests/roadmap-shadow-simulator.mjs'
      - '.github/workflows/ev19-roadmap-shadow-validation.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - 'agent/roadmap-shadow-validation-corpus.json'
      - 'agent/tools/roadmap-shadow-validation.mjs'
      - 'agent/tests/roadmap-shadow-validation.mjs'
      - 'agent/tools/experimental-review-task.mjs'
      - 'agent/roadmap-shadow-simulator.json'
      - 'agent/roadmap-shadow-simulator.schema.json'
      - 'agent/tools/roadmap-shadow-simulator.mjs'
      - 'agent/tests/roadmap-shadow-simulator.mjs'
      - '.github/workflows/ev19-roadmap-shadow-validation.yml'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Exact Candidate Roadmap Shadow Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Fetch pinned P28-PLOAD2 implementation outcome
        run: |
          set -euo pipefail
          expected=8215139c7146c25940f873dc038a85677952f201
          git fetch --no-tags origin "$expected"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git cat-file -e "$expected^{commit}"

      - name: Run EV-7 isolation and EV-19 classifier regressions
        run: |
          node agent/tests/roadmap-shadow-simulator.mjs
          node agent/tests/roadmap-shadow-validation.mjs

      - name: Generate exact-SHA EV-19 validation evidence
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p .agent-roadmap-shadow-validation-ev19
          node agent/tools/roadmap-shadow-validation.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-roadmap-shadow-validation-ev19/validation.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.agent-roadmap-shadow-validation-ev19/validation.json', 'utf8'));
          const fail = message => { throw new Error(`EV19_EXACT_EVIDENCE_FAIL ${message}`); };
          if (report.schema !== 'ironshade-roadmap-shadow-validation-report:v3' || report.schemaVersion !== 3) fail('report schema drifted');
          if (report.taskId !== 'EV-19' || report.candidateSha !== process.env.CANDIDATE_SHA) fail('task/candidate binding mismatch');
          if (report.mode !== 'advisory' || report.acceptedForEnforcement !== false || report.candidatePassGranted !== false || report.blocking !== false) fail('EV-19 must remain advisory and grant no acceptance');
          if (report.prediction.candidateSha !== 'd1ddb444ba86c9b23b97b0e1987486b6ebc6cca0' || report.prediction.configBlobSha !== '522efd6e86b0dfde647b3fbfc981c995c216e165') fail('EV-7 prediction provenance drifted');
          if (report.prediction.frictionScore !== 1 || report.prediction.rewritePressure !== 'low') fail('EV-7 frozen prediction metrics drifted');
          if (JSON.stringify(report.prediction.expectedSurfaces) !== JSON.stringify(['src/game/combatGraphicsBackend.ts','src/game/missionVisualReadinessGate.ts'])) fail('EV-7 frozen expected surfaces drifted');
          if (report.surfaceLineage.length !== 1 || report.surfaceLineage[0].migrationCommit !== '48c3d9539d408875d8887777cc45c8c94e956347' || report.surfaceLineage[0].resolvedPath !== 'src/game/combatGraphicsBackendCore.ts' || report.surfaceLineage[0].predatesOutcome !== true) fail('pre-outcome surface lineage drifted');
          if (report.actualOutcome.pullRequest !== 366 || report.actualOutcome.baseSha !== '9cf041f1c26ee7050f7e5cc4cad3f320b8feefb8' || report.actualOutcome.headSha !== '8215139c7146c25940f873dc038a85677952f201') fail('P28-PLOAD2 outcome binding drifted');
          if (report.actualOutcome.revisionCount !== 10 || report.actualOutcome.featureBearingRevisionCount !== 7 || report.actualOutcome.productionSurfaceCount !== 4 || report.actualOutcome.testSurfaceCount !== 3) fail('P28-PLOAD2 measured implementation surface/history changed');
          if (report.actualOutcome.behaviorTestBlobSha !== '05124268a0f25afbb0ef8ecfebc66edc2104ec5d' || report.actualOutcome.behaviorImplementationBlobSha !== '58063db28669f538dadf391085633e2153cce5ff') fail('P28-PLOAD2 executable ground-truth blobs drifted');

          const surface = report.surfacePrediction;
          if (JSON.stringify(surface.normalizedPredictedSurfaces) !== JSON.stringify(['src/game/combatGraphicsBackendCore.ts','src/game/missionVisualReadinessGate.ts'])) fail('normalized frozen surface prediction drifted');
          if (JSON.stringify(surface.truePositiveSurfaces) !== JSON.stringify(['src/game/combatGraphicsBackendCore.ts'])) fail('expected-surface hit drifted');
          if (JSON.stringify(surface.falsePositiveSurfaces) !== JSON.stringify(['src/game/missionVisualReadinessGate.ts'])) fail('expected-surface false alarm drifted');
          if (JSON.stringify(surface.falseNegativeSurfaces) !== JSON.stringify(['src/game/babylonCombatRenderer.ts','src/game/babylonRefineryMissionReadiness.ts','src/game/mapLoadReadinessTelemetry.ts'])) fail('missed integration surfaces drifted');
          if (surface.usefulPredictionCount !== 1 || surface.falseAlarmCount !== 1 || surface.missedIntegrationPressureCount !== 3 || surface.precision !== 0.5 || surface.recall !== 0.25) fail('surface prediction confusion matrix drifted');
          if (surface.preferredSurfaceCount !== 2 || surface.actualSurfaceCount !== 4 || surface.surfaceCountDelta !== 2) fail('EV-7 low-friction surface-count miss drifted');
          if (surface.featureIntroductionSha !== 'd5482d4d8a9f877800016273a94b06318a4e0b21' || !surface.featureIntroductionProductionSurfaces.includes('src/game/combatGraphicsBackendCore.ts')) fail('predicted surface was not directly changed by the real feature introduction');
          if (surface.featureBearingRevisionCount !== 7 || surface.featureRevisionObservations.length !== 7) fail('feature-bearing revision evidence drifted');

          if (report.supportedSignals.length !== 1) fail('EV-20 review-only supported signal count drifted');
          const supported = report.supportedSignals[0];
          if (supported.id !== 'expected-surface:src/game/combatGraphicsBackend.ts' || supported.predictionSource !== 'prediction.expectedSurfaces[0]' || supported.priorPath !== 'src/game/combatGraphicsBackend.ts' || supported.resolvedPath !== 'src/game/combatGraphicsBackendCore.ts' || supported.directFeatureIntroductionHit !== true || supported.observedRevisionCount !== 7 || supported.matchingPredictionCount !== 7 || supported.repeatable !== true) fail('frozen expected-surface predictive value is not repeatable');

          const unsupported = report.unsupportedSignals.map(signal => signal.id);
          if (JSON.stringify(unsupported) !== JSON.stringify(['extension-point:missionVisualReadiness-observer','forbidden-dependency:public-backend-no-static-babylon-import'])) fail('unsupported prior-signal boundary drifted');
          if (report.unsupportedScenarios.length !== 1 || report.unsupportedScenarios[0].taskId !== 'P28-G1') fail('unsupported P28-G1 scope must remain explicit');

          const control = report.outcomeControl;
          if (control.countedAsPredictiveSignal !== false || control.baselineRunCount !== 3 || control.baselinePassCount !== 3 || control.repeatable !== true || control.benignMutationAccepted !== true || control.dishonestMutationRejected !== true || control.detectorFalsePositives !== 0 || control.detectorFalseNegatives !== 0 || control.sandboxRemoteDetached !== true) fail('P28-PLOAD2 outcome/sensitivity control failed');
          if (report.conclusion.repeatablePredictiveValueFound !== true || report.conclusion.lowFrictionScoreValidated !== false || report.conclusion.completeExpectedSurfaceSetValidated !== false || report.conclusion.observerExtensionPointValidated !== false || report.conclusion.forbiddenDependencyPredictionValidated !== false || report.conclusion.enforcementEligible !== false) fail('EV-19 conclusion boundary drifted');
          if (report.isolation.temporaryProbesPersisted !== false || report.isolation.productRuntimeMutated !== false || report.isolation.simulatorScoringChanged !== false || report.isolation.disposableBehaviorCloneRemoteDetached !== true || report.isolation.exactHeadRestored !== true || report.isolation.trackedStateRestored !== true) fail('EV-19 isolation/rollback contract failed');
          console.log(`EV19_EXACT_EVIDENCE_PASS candidate=${report.candidateSha} actual=${report.actualOutcome.headSha} revisions=${report.actualOutcome.revisionCount} featureRevisions=${surface.featureBearingRevisionCount} useful=${surface.usefulPredictionCount} fp=${surface.falseAlarmCount} fn=${surface.missedIntegrationPressureCount} precision=${surface.precision} recall=${surface.recall} supported=${supported.id} outcomeControl=3/3+benign-pass+dishonest-caught enforcement=false`);
          NODE

      - name: Upload exact-SHA EV-19 validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-shadow-validation-ev19-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-roadmap-shadow-validation-ev19/validation.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
