name: P28-A5 Atomic Grade State Maintenance

on:
  push:
    branches:
      - chatgpt/p28-d8-refinery-boss-lod0
    paths:
      - 'scripts/tmp-p28a5-atomic-grade-state-fix.mjs'
      - '.github/workflows/tmp-p28a5-atomic-grade-state-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d8-refinery-boss-lod0
          fetch-depth: 0

      - name: Apply atomic grade-state fix
        run: node scripts/tmp-p28a5-atomic-grade-state-fix.mjs

      - name: Commit fix
        run: |
          set -euo pipefail
          git diff --check
          git add scripts/p28a5-image-grade-capture.mjs
          if git diff --cached --quiet; then
            echo 'P28-A5 atomic grade-state fix already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: capture P28 grade telemetry atomically'
          git push origin HEAD:chatgpt/p28-d8-refinery-boss-lod0
