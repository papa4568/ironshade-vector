name: Apply telemetry ingestion hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-telemetry-ingestion-hardening.yml'
      - 'scripts/apply-telemetry-ingestion-hardening.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply telemetry ingestion hardening
        run: node scripts/apply-telemetry-ingestion-hardening.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate service bundle
        run: npx esbuild netlify/functions/api.ts --bundle --platform=node --format=esm --external:@netlify/blobs --external:@netlify/functions --outfile=/tmp/ironshade-api.mjs
      - name: Validate complete production build
        run: npm run build
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit verified fix
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- netlify/functions/api.ts tests/service-regressions.mjs scripts/apply-telemetry-ingestion-hardening.mjs .github/workflows/fix-telemetry-ingestion-hardening.yml
          git commit -m 'Harden telemetry ingestion validation and rate limits'
          git push origin HEAD:main
