name: Apply playtest recommendations

on:
  push:
    branches:
      - fix/playtest-recommendations
    paths:
      - 'scripts/apply-playtest-recommendations.mjs'
      - '.github/workflows/apply-playtest-recommendations.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Remove temporary playtest patch machinery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply production fixes
        run: node scripts/apply-playtest-recommendations.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate full production build
        run: npm run build
      - name: Commit verified production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'Apply playtest progression and navigation fixes'
          git push origin HEAD:fix/playtest-recommendations
