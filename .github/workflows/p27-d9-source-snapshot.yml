name: P27 D9 Source Snapshot

on:
  push:
    branches:
      - p27-d9-babylon-cleanup
    paths:
      - '.github/workflows/p27-d9-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pack branch source
        run: tar --exclude=.git -czf /tmp/ironshade-vector-p27-d9-source.tgz .
      - uses: actions/upload-artifact@v7
        with:
          name: p27-d9-source-snapshot
          path: /tmp/ironshade-vector-p27-d9-source.tgz
          if-no-files-found: error
          retention-days: 1
