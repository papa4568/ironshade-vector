name: P28 Heavy Asset Roadmap

on:
  push:
    branches:
      - chatgpt/p28-heavy-asset-roadmap
    paths:
      - .github/workflows/p28-heavy-asset-roadmap.yml

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-heavy-asset-roadmap

      - name: Add explicit heavy asset phase
        env:
          HEAVY_PHASE_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('docs/content-roadmap.md')
          text = path.read_text()
          handoff = "- The authored-asset build path is itself a major visual blocker: `scripts/prepare-graphics-assets.mjs` currently emits GLBs from a single cube vertex/index primitive and assembles many operators, enemies, and environment assets from scaled box nodes with factor-only materials. P28 must upgrade that source/build path before treating new LOD0 assets as premium art.\n"
          heavy_handoff = "- P28 includes an explicit **heavy asset production phase** before campaign-wide rollout. Renderer-only improvements, placeholder-scale GLBs, or synthetic padding do not satisfy it: the shipped APK must contain materially richer authored texture and geometry payloads, with exact per-family size/quality telemetry proving the growth comes from real art content.\n"
          if heavy_handoff not in text:
              if handoff not in text:
                  raise SystemExit('handoff insertion marker not found')
              text = text.replace(handoff, handoff + heavy_handoff, 1)

          text = text.replace('#### G. Capstone visual refreshes', '#### H. Capstone visual refreshes', 1)
          for i in range(1, 5):
              text = text.replace(f'**P28-G{i} —', f'**P28-H{i} —', 1)
          text = text.replace('#### F. Campaign-location rollout of the shared visual stack', '#### G. Campaign-location rollout of the shared visual stack', 1)
          for i in range(1, 10):
              text = text.replace(f'**P28-F{i} —', f'**P28-G{i} —', 1)

          marker = '#### G. Campaign-location rollout of the shared visual stack\n'
          phase = base64.b64decode(os.environ['HEAVY_PHASE_B64']).decode('utf-8')
          if '#### F. Heavy authored-asset production and shipping gate' not in text:
              if marker not in text:
                  raise SystemExit('campaign rollout insertion marker not found')
              text = text.replace(marker, phase + marker, 1)
          path.write_text(text)
          PY

      - name: Commit roadmap and remove one-shot workflow
        run: |
          rm .github/workflows/p28-heavy-asset-roadmap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/content-roadmap.md .github/workflows/p28-heavy-asset-roadmap.yml
          git commit -m 'docs: add explicit P28 heavy asset phase'
          git push origin HEAD:chatgpt/p28-heavy-asset-roadmap
