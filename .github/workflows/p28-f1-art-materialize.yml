# P28-F1 one-shot ingestion of KTX2 bytes from the already verified exact-head
# CI candidate artifact. Removed once committed binaries are on the PR branch.
name: P28-F1 Materialize Authored Art
on:
  push:
    branches:
      - chatgpt/p28-f1-refinery-texture-payload
    paths:
      - '.github/workflows/p28-f1-art-materialize.yml'

permissions:
  contents: write
  actions: read

jobs:
  transfer-verified-kTX2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Download already verified P28-F1 candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/p28-f1-verified"
          gh run download 39097156601 \
            --repo "$GITHUB_REPOSITORY" \
            --name ironshade-vector-pr-candidate-web-01e44df448aad9da964675722d93f1579e802adc \
            --dir "$RUNNER_TEMP/p28-f1-verified"
      - name: Prove source hashes and stage authored standalone KTX2 assets
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          origin = Path(os.environ['RUNNER_TEMP']) / 'p28-f1-verified/dist/assets'
          manifest = json.loads((origin / 'heavy-asset-manifest.json').read_text())
          source = origin / 'materials/premium-pbr'
          target = Path('public/assets/materials/premium-pbr/p28f1')
          target.mkdir(parents=True, exist_ok=True)
          copied = 0
          total = 0
          for entry in manifest['assets']:
              if not entry['path'].startswith('assets/materials/premium-pbr/') or entry['type'] != 'ktx2':
                  continue
              if not entry['runtimeReferenced']:
                  raise SystemExit('unreferenced source art: ' + entry['path'])
              name = Path(entry['path']).name
              data = (source / name).read_bytes()
              if len(data) != entry['onDiskBytes'] or hashlib.sha256(data).hexdigest() != entry['fileSha256']:
                  raise SystemExit('candidate source integrity mismatch: ' + name)
              (target / name).write_bytes(data)
              copied += 1
              total += len(data)
          if copied != 16 or total != 92760002:
              raise SystemExit(f'expected 16 verified 2K maps / 92760002 bytes, got {copied} / {total}')
          print(f'P28_F1_AUTHORED_BINARY_IMPORT_PASS maps={copied} bytes={total}')
          PY
      - name: Commit and push intact packaged source textures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/materials/premium-pbr/p28f1/
          git diff --cached --quiet && { echo 'Expected new authored binary files'; exit 1; }
          git commit -m 'P28-F1 ship 16 measured offline-authored 2K KTX2 texture maps'
          git push origin HEAD:chatgpt/p28-f1-refinery-texture-payload
