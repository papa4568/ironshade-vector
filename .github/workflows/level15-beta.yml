name: Level 15 beta smoke

on:
  push:
    branches:
      - main
      - beta/level-15-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate level 15 beta and production build
        run: npm run build
      - name: Smoke test browser command deck
        run: BROWSER_E2E_SKIP_BUILD=1 npm run test:e2e
      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ironshade-vector-browser-e2e
          path: browser-e2e-combat.png
          if-no-files-found: warn
          retention-days: 30
