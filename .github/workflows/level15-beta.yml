name: Level 15 beta smoke

on:
  push:
    branches:
      - main
      - beta/level-15-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use npm 11
        run: |
          npm install --global npm@11.19.1
          npm --version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit runtime dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if grep -Eq '503 Service Unavailable|performing maintenance|audit endpoint returned an error' <<<"$output"; then
              if [[ "$attempt" -lt 4 ]]; then
                sleep $((attempt * 5))
                continue
              fi
              echo "::warning::npm advisory service unavailable after retries; dependency install remains lockfile-pinned and the audit gate will run again on the next CI execution."
              exit 0
            fi
            exit "$status"
          done
      - name: Validate level 15 beta and production build
        run: npm run build
