name: Level 15 beta smoke

on:
  push:
    branches:
      - main
      - beta/level-15-smoke
  workflow_dispatch:

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate level 15 beta and production build
        run: npm run build
      - name: Archive verified source
        uses: actions/upload-artifact@v4
        with:
          name: verified-source
          path: |
            .
            !node_modules
            !.git
            !.beta-dist
          include-hidden-files: true
          retention-days: 1
