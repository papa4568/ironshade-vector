name: P28-D1 affected verification selection

on:
  push:
    branches: [chatgpt/p28-d1-vanguard-lod0]
    paths: ['.github/workflows/p28d1-affected.yml']

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d1-vanguard-lod0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Select affected verification
        run: >-
          node agent/tools/select-affected-verification.mjs --json --files
          public/assets/models/operators/operator-vanguard-lod0.glb,scripts/browser-runtime-smoke.mjs,scripts/p28a5-image-grade-capture.mjs,scripts/prepare-premium-pbr-reference.mjs,scripts/prepare-vanguard-operator-lod0.mjs,src/game/graphicsAssetManifest.ts,tests/graphics-asset-pipeline.ts,tests/premium-pbr-reference.mjs,tests/vanguard-operator-lod0.mjs
