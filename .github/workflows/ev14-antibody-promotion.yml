name: EV-14 Antibody Promotion

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'agent/antibody-promotion-policy.json'
      - 'agent/antibody-decisions/**'
      - 'agent/tools/antibody-promotion.mjs'
      - 'agent/tools/ev14-governance-review-auth.mjs'
      - 'agent/tests/antibody-promotion.mjs'
      - 'agent/tests/candidate-artifact.mjs'
      - 'agent/tests/ev14-governance-review-auth.mjs'
      - '.github/workflows/ev14-antibody-promotion.yml'
      - 'AGENTS.md'
      - 'docs/experimental-verification-roadmap.md'
      - 'docs/experimental-verification-archive.md'

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  promotion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      governance-review-required: ${{ steps.governance-review-scope.outputs.required }}
      governance-review-task: ${{ steps.governance-review-scope.outputs.task }}
      promotion-authorization-required: ${{ steps.governance-review-scope.outputs.promotion-authorization-required }}
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Scope exact-SHA promotion governance review
        if: github.event_name == 'pull_request'
        id: governance-review-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          promotion_changed="$(git diff --name-only "$BASE_SHA...$CANDIDATE_SHA" -- \
            agent/antibody-promotion-policy.json \
            agent/antibody-decisions/)"
          mechanism_changed="$(git diff --name-only "$BASE_SHA...$CANDIDATE_SHA" -- \
            .github/workflows/ev14-antibody-promotion.yml \
            agent/tools/antibody-promotion.mjs \
            agent/tools/antibody-governance.mjs \
            agent/tools/repository-immune-system.mjs \
            agent/tools/review-comment-gate.mjs \
            agent/tools/independent-review.mjs \
            agent/tools/candidate-evidence.mjs \
            agent/tools/select-review-task.mjs \
            agent/tools/ev14-governance-review-auth.mjs \
            agent/tests/antibody-promotion.mjs \
            agent/tests/candidate-artifact.mjs \
            agent/tests/ev14-governance-review-auth.mjs)"

          if [ -n "$promotion_changed" ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo 'task=EV-14' >> "$GITHUB_OUTPUT"
            echo 'promotion-authorization-required=true' >> "$GITHUB_OUTPUT"
            echo 'EV14_GOVERNANCE_REVIEW_SCOPE required=true task=EV-14 mode=promotion'
          elif [ -n "$mechanism_changed" ]; then
            selection="$(node agent/tools/select-review-task.mjs --base "$BASE_SHA" --head "$CANDIDATE_SHA" --json)"
            task="$(printf '%s' "$selection" | node -e "let input='';process.stdin.on('data',chunk=>input+=chunk);process.stdin.on('end',()=>{const value=JSON.parse(input);if(!value.taskId)process.exit(2);process.stdout.write(value.taskId);});")"
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo "task=$task" >> "$GITHUB_OUTPUT"
            echo 'promotion-authorization-required=false' >> "$GITHUB_OUTPUT"
            echo "EV14_GOVERNANCE_REVIEW_SCOPE required=true task=$task mode=mechanism"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'task=' >> "$GITHUB_OUTPUT"
            echo 'promotion-authorization-required=false' >> "$GITHUB_OUTPUT"
            echo 'EV14_GOVERNANCE_REVIEW_SCOPE required=false'
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run EV-14 promotion regressions
        run: node agent/tests/antibody-promotion.mjs

      - name: Run EV-14 governance review authorization regressions
        run: node agent/tests/ev14-governance-review-auth.mjs

      - name: Enforce the single promoted antibody and prove rollback
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .agent-antibody-promotion
          node agent/tools/antibody-promotion.mjs gate \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-antibody-promotion/enforced.json
          IRONSHADE_ANTIBODY_ENFORCEMENT=0 node agent/tools/antibody-promotion.mjs gate \
            --candidate-sha "$CANDIDATE_SHA" \
            --output .agent-antibody-promotion/rollback.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const active = JSON.parse(readFileSync('.agent-antibody-promotion/enforced.json', 'utf8'));
          const rollback = JSON.parse(readFileSync('.agent-antibody-promotion/rollback.json', 'utf8'));
          if (!active.enforcementContractPass || active.calibration.measuredErrors.falsePositives !== 0 || active.calibration.measuredErrors.falseNegatives !== 0) {
            throw new Error('EV14_PROMOTION_EVIDENCE_FAIL active calibration or enforcement failed');
          }
          if (rollback.blocking !== false || rollback.rollback.failureHistoryUnchanged !== true || rollback.rollback.existingCandidateArtifactCheckStillRequired !== true) {
            throw new Error('EV14_PROMOTION_EVIDENCE_FAIL rollback did not preserve prior semantics');
          }
          console.log(`EV14_PROMOTION_EVIDENCE_PASS candidate=${active.candidateSha} truth=${active.selectedTruthId} falsePositives=0 falseNegatives=0 rollback=verified`);
          NODE

      - name: Upload exact-SHA EV-14 promotion evidence
        uses: actions/upload-artifact@v7
        with:
          name: antibody-promotion-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'push' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .agent-antibody-promotion/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  request-independent-governance-review:
    if: github.event_name == 'pull_request' && needs.promotion-gate.outputs.governance-review-required == 'true'
    needs: promotion-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Wait for exact-candidate producer workflows and dispatch trusted-main review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_TASK_ID: ${{ needs.promotion-gate.outputs.governance-review-task }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const candidateSha = process.env.CANDIDATE_SHA;
          const prNumber = Number(process.env.PR_NUMBER);
          const reviewTaskId = process.env.REVIEW_TASK_ID;
          if (!reviewTaskId) throw new Error('EV14_TRUSTED_REVIEW_DISPATCH_FAIL review task was not resolved');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const api = async (path, options = {}) => {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers ?? {}) },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub API ${options.method ?? 'GET'} ${path} failed ${response.status}: ${text}`);
            return text ? JSON.parse(text) : null;
          };
          const exactRun = async workflow => {
            const payload = await api(`actions/workflows/${workflow}/runs?event=pull_request&head_sha=${candidateSha}&per_page=30`);
            return (payload.workflow_runs ?? [])
              .filter(run => run.head_sha === candidateSha && (run.pull_requests ?? []).some(pull => pull.number === prNumber))
              .sort((left, right) => Date.parse(left.created_at) - Date.parse(right.created_at))
              .at(-1) ?? null;
          };

          let producerReady = false;
          for (let attempt = 0; attempt < 105; attempt += 1) {
            const [candidate, orchestration] = await Promise.all([
              exactRun('pr-candidate.yml'),
              exactRun('agent-orchestration.yml'),
            ]);
            if (candidate?.status === 'completed' && orchestration?.status === 'completed') {
              producerReady = true;
              console.log(`EV14_REVIEW_PRODUCERS_READY candidateRun=${candidate.id} candidateConclusion=${candidate.conclusion} orchestrationRun=${orchestration.id} orchestrationConclusion=${orchestration.conclusion}`);
              break;
            }
            await sleep(15000);
          }
          if (!producerReady) throw new Error('EV14_TRUSTED_REVIEW_DISPATCH_FAIL exact-candidate producer workflows did not complete');

          await api('actions/workflows/ao6-trusted-independent-review.yml/dispatches', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ref: 'main',
              inputs: {
                pr_number: String(prNumber),
                candidate_sha: candidateSha,
                task_id: reviewTaskId,
              },
            }),
          });
          console.log(`EV14_TRUSTED_REVIEW_DISPATCHED candidate=${candidateSha} pr=${prNumber} task=${reviewTaskId}`);
          NODE

  authorize-after-trusted-review:
    if: github.event_name == 'pull_request' && needs.promotion-gate.outputs.governance-review-required == 'true'
    needs:
      - promotion-gate
      - request-independent-governance-review
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reconstruct exact governance review packet
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_TASK_ID: ${{ needs.promotion-gate.outputs.governance-review-task }}
        run: |
          set -euo pipefail
          AUTH_DIR="$RUNNER_TEMP/ev14-antibody-authorization"
          rm -rf "$AUTH_DIR"
          mkdir -p "$AUTH_DIR"
          node agent/tools/candidate-evidence.mjs manifest \
            --task "$REVIEW_TASK_ID" \
            --base "$BASE_SHA" \
            --head "$CANDIDATE_SHA" \
            --branch "$HEAD_BRANCH" \
            --output "$AUTH_DIR/candidate-manifest.json"
          node agent/tools/independent-review.mjs packet \
            --manifest "$AUTH_DIR/candidate-manifest.json" \
            --output "$AUTH_DIR/review-packet.json" \
            --verify-git

      - name: Wait for authenticated exact governance review pass
        id: trusted-review
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_TASK_ID: ${{ needs.promotion-gate.outputs.governance-review-task }}
          PROMOTION_AUTHORIZATION_REQUIRED: ${{ needs.promotion-gate.outputs.promotion-authorization-required }}
        run: |
          set -euo pipefail
          AUTH_DIR="$RUNNER_TEMP/ev14-antibody-authorization"
          for attempt in $(seq 1 125); do
            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              | jq 'add // []' > "$AUTH_DIR/pr-comments.json"

            set +e
            gate_output="$(node agent/tools/ev14-governance-review-auth.mjs bind \
              --packet "$AUTH_DIR/review-packet.json" \
              --comments "$AUTH_DIR/pr-comments.json" \
              --review-output "$AUTH_DIR/review-result.json" \
              --authorization-output "$AUTH_DIR/authorization.json" \
              --pr-author "$PR_AUTHOR" \
              --promotion-authorization-required "$PROMOTION_AUTHORIZATION_REQUIRED" 2>&1)"
            gate_status=$?
            set -e

            if [ "$gate_status" -eq 0 ]; then
              printf '%s\n' "$gate_output"
              node agent/tools/independent-review.mjs validate-result \
                --packet "$AUTH_DIR/review-packet.json" \
                --result "$AUTH_DIR/review-result.json"
              exit 0
            fi

            if grep -Fq "latest independent review verdict for candidate $CANDIDATE_SHA is fail" <<< "$gate_output"; then
              printf '%s\n' "$gate_output" >&2
              exit 1
            fi
            if [ "$attempt" -eq 125 ]; then
              printf '%s\n' "$gate_output" >&2
              echo 'EV14_TRUSTED_REVIEW_WAIT_FAIL authenticated exact-candidate governance review did not become available' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Require trusted EV-14 promotion governance authorization
        if: needs.promotion-gate.outputs.promotion-authorization-required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          AUTH_DIR="$RUNNER_TEMP/ev14-antibody-authorization"
          node agent/tools/antibody-promotion.mjs authorize \
            --candidate-sha "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --review-packet "$AUTH_DIR/review-packet.json" \
            --output "$AUTH_DIR/authorization.json"

      - name: Validate trusted EV-14 review-mechanism authorization
        if: needs.promotion-gate.outputs.promotion-authorization-required != 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          AUTH_DIR="$RUNNER_TEMP/ev14-antibody-authorization"
          node agent/tools/ev14-governance-review-auth.mjs validate-authorization \
            --packet "$AUTH_DIR/review-packet.json" \
            --result "$AUTH_DIR/review-result.json" \
            --authorization "$AUTH_DIR/authorization.json" \
            --pr-author "$PR_AUTHOR"

      - name: Upload trusted EV-14 governance authorization
        uses: actions/upload-artifact@v7
        with:
          name: antibody-promotion-authorization-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ev14-antibody-authorization/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
