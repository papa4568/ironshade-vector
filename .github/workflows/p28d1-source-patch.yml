name: P28-D1 source patch

on:
  push:
    branches:
      - chatgpt/p28-d1-vanguard-lod0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Apply exact P28-D1 source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          replace_once(
              'src/game/graphicsAssetManifest.ts',
              "/assets/models/interactables/spin-habitat-spin-bus-isolator-lod2.glb",
              "/assets/models/interactables/jovian-harvester-storm-bus-isolator-lod2.glb",
          )
          replace_once(
              'src/game/graphicsAssetManifest.ts',
              "// Hero-quality LOD0 will be added after the animation and socket contract is proven.\n",
              "// The generic field suit remains LOD1/LOD2; class families may add proven hero LOD0 assets.\n",
          )

          generator = Path('scripts/prepare-vanguard-operator-lod0.mjs')
          text = generator.read_text()
          old = "import { deflateSync } from 'node:zlib';\n"
          if text.count(old) != 1:
              raise SystemExit('Vanguard generator zlib import drifted')
          text = text.replace(old, '', 1)
          marker = "function crc32(buffer) {\n  let crc = 0xffffffff;\n  for (const byte of buffer) {\n    crc ^= byte;\n    for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));\n  }\n  return (crc ^ 0xffffffff) >>> 0;\n}\n"
          helper = marker + "\nfunction adler32(buffer) {\n  let a = 1;\n  let b = 0;\n  for (const value of buffer) {\n    a = (a + value) % 65521;\n    b = (b + a) % 65521;\n  }\n  return ((b << 16) | a) >>> 0;\n}\n\nfunction encodeStoredZlib(buffer) {\n  if (buffer.length > 0xffff) throw new Error(`Stored zlib payload is too large: ${buffer.length}`);\n  const blockHeader = Buffer.alloc(5);\n  blockHeader[0] = 0x01;\n  blockHeader.writeUInt16LE(buffer.length, 1);\n  blockHeader.writeUInt16LE((~buffer.length) & 0xffff, 3);\n  const checksum = Buffer.alloc(4);\n  checksum.writeUInt32BE(adler32(buffer), 0);\n  return Buffer.concat([Buffer.from([0x78, 0x01]), blockHeader, buffer, checksum]);\n}\n"
          if text.count(marker) != 1:
              raise SystemExit('Vanguard generator crc32 marker drifted')
          text = text.replace(marker, helper, 1)
          old_idat = "pngChunk('IDAT', deflateSync(Buffer.concat(rows), { level: 9 })),"
          if text.count(old_idat) != 1:
              raise SystemExit('Vanguard generator IDAT encoder drifted')
          text = text.replace(old_idat, "pngChunk('IDAT', encodeStoredZlib(Buffer.concat(rows))),", 1)
          generator.write_text(text)

          browser = 'scripts/browser-runtime-smoke.mjs'
          replace_once(browser, '/^authored-[12]-babylon$/.test(canvas?.dataset.operatorVisual ?? \'\')', '/^authored-[012]-babylon$/.test(canvas?.dataset.operatorVisual ?? \'\')')
          replace_once(
              browser,
              "  const expectedPlayerLod = state.renderTier === 'performance' ? 2 : 1;\n  const expectedOperatorAsset = state.operatorClass && state.operatorClass !== 'generic'\n    ? `operator-${state.operatorClass}-lod${expectedPlayerLod}`\n    : `operator-field-suit-lod${expectedPlayerLod}`;",
              "  const expectedSharedLod = state.renderTier === 'performance' ? 2 : 1;\n  const expectedOperatorLod = state.operatorClass === 'vanguard' && state.renderTier === 'high' ? 0 : expectedSharedLod;\n  const expectedOperatorAsset = state.operatorClass && state.operatorClass !== 'generic'\n    ? `operator-${state.operatorClass}-lod${expectedOperatorLod}`\n    : `operator-field-suit-lod${expectedSharedLod}`;",
          )
          replace_once(browser, "state.operatorVisual !== `authored-${expectedPlayerLod}-babylon`", "state.operatorVisual !== `authored-${expectedOperatorLod}-babylon`")
          replace_once(browser, "state.weaponAsset !== `weapon-${state.weaponActive}-lod${expectedPlayerLod}`", "state.weaponAsset !== `weapon-${state.weaponActive}-lod${expectedSharedLod}`")
          replace_once(browser, "const expectedEnemyAssets = expectedEnemyRoles.map(role => `enemy-${role}-lod${expectedPlayerLod}`);", "const expectedEnemyAssets = expectedEnemyRoles.map(role => `enemy-${role}-lod${expectedSharedLod}`);")
          replace_once(browser, "state.enemyCatalogLod !== String(expectedPlayerLod)", "state.enemyCatalogLod !== String(expectedSharedLod)")
          replace_once(
              browser,
              "  const expectedCombatLod = coarseCombatSurface ? '2' : '1';\n  await waitFor(`(() => {\n    const canvas = document.querySelector('canvas');\n    return canvas?.dataset.operatorClassAsset === 'vanguard'\n      && canvas?.dataset.operatorVisual === 'authored-${expectedCombatLod}'\n      && (canvas?.dataset.operatorAsset ?? '').includes('operator-vanguard-lod${expectedCombatLod}')\n      && (canvas?.dataset.weaponAsset ?? '').includes('weapon-breacher-lod${expectedCombatLod}');\n  })()`, 'Vanguard authored mobile combat assets', 20_000);\n  console.log(`BROWSER_MOBILE_ASSET_PASS viewport=${viewportMode} icons=loaded operatorLod=${expectedCombatLod} weaponLod=${expectedCombatLod}`);",
              "  const expectedOperatorLod = coarseCombatSurface ? '2' : '0';\n  const expectedWeaponLod = coarseCombatSurface ? '2' : '1';\n  await waitFor(`(() => {\n    const canvas = document.querySelector('canvas');\n    return canvas?.dataset.operatorClassAsset === 'vanguard'\n      && canvas?.dataset.operatorVisual === 'authored-${expectedOperatorLod}'\n      && (canvas?.dataset.operatorAsset ?? '').includes('operator-vanguard-lod${expectedOperatorLod}')\n      && (canvas?.dataset.weaponAsset ?? '').includes('weapon-breacher-lod${expectedWeaponLod}');\n  })()`, 'Vanguard authored mobile combat assets', 20_000);\n  console.log(`BROWSER_MOBILE_ASSET_PASS viewport=${viewportMode} icons=loaded operatorLod=${expectedOperatorLod} weaponLod=${expectedWeaponLod}`);",
          )

          capture = 'scripts/p28a5-image-grade-capture.mjs'
          replace_once(
              capture,
              "// Historical proof markers retained for completed candidates: visualDetail: 'p28-c5-refinery-processor-lod0'; visualDetail: 'p28-c6-refinery-terminal-lod0'; visualDetail: 'p28-c7-refinery-crate-lod0'; visualDetail: 'p28-c8-refinery-world-authored-mappings'; visualDetail: 'p28-c9-refinery-geometry-reuse'",
              "// Historical proof markers retained for completed candidates: visualDetail: 'p28-c5-refinery-processor-lod0'; visualDetail: 'p28-c6-refinery-terminal-lod0'; visualDetail: 'p28-c7-refinery-crate-lod0'; visualDetail: 'p28-c8-refinery-world-authored-mappings'; visualDetail: 'p28-c9-refinery-geometry-reuse'; visualDetail: 'p28-d0-premium-character-source'",
          )
          replace_once(
              capture,
              "    refineryWorldFallbackCount: Number(canvas.dataset.refineryWorldFallbackCount ?? 0),\n    assetRuntime: canvas.dataset.babylonWorldRuntime ?? '',",
              "    refineryWorldFallbackCount: Number(canvas.dataset.refineryWorldFallbackCount ?? 0),\n    operatorVisual: canvas.dataset.operatorVisual ?? '',\n    operatorAsset: canvas.dataset.operatorAsset ?? '',\n    operatorClassAsset: canvas.dataset.operatorClassAsset ?? '',\n    operatorRig: canvas.dataset.operatorRig ?? '',\n    operatorSocket: canvas.dataset.operatorSocket ?? '',\n    assetRuntime: canvas.dataset.babylonWorldRuntime ?? '',",
          )
          replace_once(
              capture,
              "      && canvas?.dataset.environmentImageGradeMode === 'normal';",
              "      && canvas?.dataset.environmentImageGradeMode === 'normal'\n      && canvas?.dataset.operatorVisual === 'authored-0-babylon'\n      && canvas?.dataset.operatorAsset === 'operator-vanguard-lod0';",
          )
          replace_once(
              capture,
              "    || normal.refineryWorldFallbackCount !== 0\n    || !normal.assetRuntime.includes('cached:')",
              "    || normal.refineryWorldFallbackCount !== 0\n    || normal.operatorVisual !== 'authored-0-babylon'\n    || normal.operatorAsset !== 'operator-vanguard-lod0'\n    || normal.operatorClassAsset !== 'vanguard'\n    || normal.operatorRig !== 'articulated'\n    || normal.operatorSocket !== 'weapon-socket'\n    || !normal.assetRuntime.includes('cached:')",
          )
          replace_once(
              capture,
              "    || lowVisibility.mode !== 'low-visibility'\n    || !/^aces-exposure-\\d+\\.\\d{2}\\+contrast-\\d+\\.\\d{2}$/.test(lowVisibility.tone)",
              "    || lowVisibility.mode !== 'low-visibility'\n    || lowVisibility.operatorVisual !== 'authored-0-babylon'\n    || lowVisibility.operatorAsset !== 'operator-vanguard-lod0'\n    || !/^aces-exposure-\\d+\\.\\d{2}\\+contrast-\\d+\\.\\d{2}$/.test(lowVisibility.tone)",
          )
          replace_once(capture, "    visualDetail: 'p28-d0-premium-character-source',", "    visualDetail: 'p28-d1-vanguard-operator-lod0',")
          replace_once(capture, 'detail=p28-d0-premium-character-source', 'detail=p28-d1-vanguard-operator-lod0')
          PY

          node --check scripts/prepare-vanguard-operator-lod0.mjs
          node --check scripts/browser-runtime-smoke.mjs
          node --check scripts/p28a5-image-grade-capture.mjs
          node scripts/prepare-vanguard-operator-lod0.mjs
          test -s public/assets/models/operators/operator-vanguard-lod0.glb

          rm .github/workflows/p28d1-source-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/graphicsAssetManifest.ts scripts/prepare-vanguard-operator-lod0.mjs scripts/browser-runtime-smoke.mjs scripts/p28a5-image-grade-capture.mjs public/assets/models/operators/operator-vanguard-lod0.glb .github/workflows/p28d1-source-patch.yml
          git diff --cached --check
          git commit -m 'P28-D1 finalize Vanguard LOD0 candidate source'
          git push origin HEAD:${GITHUB_REF_NAME}
