name: Validate Three.js objective beacon fix

on:
  push:
    branches:
      - fix/three-objective-beacon

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/three-objective-beacon
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 3D objective beacon
        run: |
          node scripts/apply-three-objective-beacon.mjs
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression and production build
        run: npm run build
      - name: Commit validated fix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/threeCombatRenderer.ts
          git commit -m 'Restore 3D objective beacon navigation'
          git push origin HEAD:main
