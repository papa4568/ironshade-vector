name: P28-D6 maintenance patch

on:
  push:
    branches:
      - chatgpt/p28-d6-technician-enemy-lod0
    paths:
      - .github/workflows/p28d6-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact asserted replacements
        run: python scripts/p28d6-maintenance.py
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare-premium-pbr-reference.mjs src/game/graphicsAssetManifest.ts scripts/browser-runtime-smoke.mjs scripts/p28a5-image-grade-capture.mjs
          git diff --cached --check
          git commit -m 'P28-D6 register technician LOD0 and runtime proof'
          git push origin HEAD:${GITHUB_REF_NAME}
