name: Temporary P28-D5 roadmap closeout

on:
  push:
    branches:
      - chatgpt/p28-d5-suppressor-enemy-lod0

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/p28-d5-suppressor-enemy-lod0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Archive verified P28-D5 delivery
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/content-roadmap.md')
          text = roadmap.read_text()
          item = "- [ ] **P28-D5 — Ship suppressor enemy LOD0** — Add a full-detail LOD0 for the suppressor family with stronger weapon/armor silhouette separation. **Done when:** rig/overlay alignment, combat readability, visual improvement, and standard build/APK gates pass.\n\n"
          if text.count(item) != 1:
              raise SystemExit('P28-D5 active roadmap item not found exactly once')
          roadmap.write_text(text.replace(item, '', 1))

          archive = Path('docs/content-roadmap-archive.md')
          text = archive.read_text()
          marker = "## P28 — Babylon flagship visual-quality overhaul\n\n"
          if text.count(marker) != 1:
              raise SystemExit('P28 archive insertion marker not found exactly once')
          entry = """- [x] **P28-D5 — Ship suppressor enemy LOD0** — Completed 2026-10-08 with a deterministic authored suppressor LOD0 that strengthens weapon/armor silhouette separation while preserving the shared enemy rig/socket contract, simulation-owned hitboxes/gameplay bounds, and combat-presentation ownership boundaries.
            - Added `enemy-suppressor-lod0.glb` plus `scripts/prepare-suppressor-enemy-lod0.mjs`; the production build generates a 116,912-byte textured metallic/roughness PBR GLB with 53 authored nodes, 592 source triangles, 1,820 instantiated mesh-node triangles, embedded base-color/normal/packed-ORM/emissive channels, asymmetric positive-Z stabilizer armor, a clear negative-Z external weapon lane, and no embedded weapon.
            - Preserved `enemy-rig`, hip/torso/helmet/arm/leg/backpack transforms and `weapon-socket`, including the established suppressor role marker `suppressor-shoulder-left`; hitbox/gameplay-bounds ownership stays simulation-side. Flagship/high detail selects `enemy-suppressor-lod0`; balanced/performance retain suppressor LOD1/LOD2 recovery paths.
            - Added deterministic generation/detail/PBR/rig/socket/bounds/Babylon-loading/LOD-selection regressions, including explicit stabilizer-side armor and weapon-lane separation assertions. Deterministic Flagship evidence now requires assault and suppressor LOD0 together while technician/elite retain their current recovery tiers, with telegraph/status/lifecycle presentation remaining read-only and aligned.
            - Exact implementation head `3a20bf7ca806b35cb673f1d0ab253e25273c5490` on PR #335 passed PR Candidate Verification run `37800740053`: the single full repository verification/production build, desktop and mobile-landscape browser journeys, APK delivery/signature checks, API 35 product smoke, Android 16/API 36 large-screen smoke, aggregate Android verification, and exact-candidate evidence all passed. Candidate web artifact `ironshade-vector-pr-candidate-web-3a20bf7ca806b35cb673f1d0ab253e25273c5490` is `11560971167` (digest `sha256:79d8dc77e069b7de3d354b11eb9eb4c1ff243881edd23e03397ad9f2b215b08c`).
            - Deterministic Flagship evidence is tagged for P28-D5; P28 Image Grade Visual run `37800739537` passed with artifact `ironshade-vector-p28a5-image-grade` (`11560516932`, digest `sha256:e71be1b5770198bf1cab5c31eb9a11c3c96d9ed73af5b8898d35abbacdd2b683`). Browser artifacts are desktop `11560797421` (digest `sha256:d55dc5e220621ad64f29eeb31716894e2e9d08f602117bc2cd493b10060e3ea7`) and mobile-landscape `11561157074` (digest `sha256:5585e1241c29d880f5b79807b7821eeec0ffa3cb853a1fb7a5b7ca170ded70b4`).
            - Verified implementation APK artifact `ironshade-vector-pr-android-apk` (`11561486211`, artifact digest `sha256:1b0058c8a7fff89c28b4575088a8250d45e4813869a8c713f52e3735c50b80c3`) contains `Ironshade-Vector-Android-Debug.apk` (10,551,724 bytes; package `app.ironshade.vector`; version `0.0.1-pr.85 (85)`; min SDK 24; target SDK 36; APK Signature Scheme v2 verified). API 35 artifact `11560349619` (digest `sha256:514b115dcefca9733b67c202a5f8e628f4f5ff961a315ec537f8023c551dddf0`) and API 36 artifact `11560329415` (digest `sha256:61e034c2fb5c757b04c179bda013485d5bba86326d360da77b1ca9fb50e7275d`) preserve emulator evidence for the same implementation candidate; candidate evidence artifact `11560758076` (digest `sha256:efab7e0403f79da0c0101df0b22a048609ab1cd15e886beaee087e875d728847`) records the exact implementation proof ledger.
            - **Next: P28-D6 — Ship technician enemy LOD0.**

          """
          archive.write_text(text.replace(marker, marker + entry, 1))
          PY
      - name: Sync and validate roadmap metadata
        run: |
          set -euo pipefail
          node agent/tools/sync-roadmap-metadata.mjs --write
          node agent/tools/sync-roadmap-metadata.mjs --check
          node agent/tools/roadmap-adapter.mjs --validate-only
          node agent/tests/roadmap-adapter.mjs
          node agent/tests/task-graph.mjs
      - name: Commit verified closeout
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/content-roadmap.md docs/content-roadmap-archive.md agent/roadmap-metadata.json
          git commit -m "P28-D5 archive verified delivery"
          git push origin HEAD:chatgpt/p28-d5-suppressor-enemy-lod0
