name: P27-D6 Babylon Resource Soak

on:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Babylon sustained-runtime soak duration in minutes
        required: true
        default: '30'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p27d6-soak.yml'
      - 'scripts/android-babylon-resource-soak.mjs'
      - 'scripts/android-babylon-resource-soak.sh'
      - 'src/game/babylonCombatRenderer.ts'
      - 'src/game/babylonGraphicsAssets.ts'
      - 'src/game/combatGraphicsBackend.ts'
      - 'src/components/GameCanvas.tsx'

permissions:
  contents: read

jobs:
  p27d6-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 0.0.1-beta.${{ github.run_number }}
      ANDROID_P27D6_SOAK_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.soak_minutes || '30' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10.9.8
        run: |
          npm install --global npm@10.9.8
          npm_version="$(npm --version)"
          echo "$npm_version"
          test "$npm_version" = "10.9.8"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full regression and production build
        run: npm run build

      - name: Generate native Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android
          grep -q "versionCode ${ANDROID_VERSION_CODE}" android/app/build.gradle
          grep -q "versionName \"${ANDROID_VERSION_NAME}\"" android/app/build.gradle

      - name: Build Babylon soak APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and stage Babylon soak APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee android-p27d6-apk-badging.txt
          grep -q "package: name='app.ironshade.vector' versionCode='${ANDROID_VERSION_CODE}' versionName='${ANDROID_VERSION_NAME}'" android-p27d6-apk-badging.txt
          grep -q "sdkVersion:'24'" android-p27d6-apk-badging.txt
          grep -q "targetSdkVersion:'36'" android-p27d6-apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android-p27d6-apk-signing.txt
          cp "$APK" Ironshade-Vector-P27D6-Soak.apk
          sha256sum Ironshade-Vector-P27D6-Soak.apk | tee Ironshade-Vector-P27D6-Soak.sha256

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run sustained Babylon resource soak
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          script: ANDROID_P27D6_SOAK_MINUTES="${{ env.ANDROID_P27D6_SOAK_MINUTES }}" bash scripts/android-babylon-resource-soak.sh

      - name: Upload Babylon soak APK and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ironshade-vector-p27d6-soak
          path: |
            Ironshade-Vector-P27D6-Soak.apk
            Ironshade-Vector-P27D6-Soak.sha256
            android-p27d6-apk-badging.txt
            android-p27d6-apk-signing.txt
            android-p27d6-babylon-soak.json
            android-p27d6-memory.txt
            android-p27d6-memory-summary.json
            android-p27d6-meminfo-final.txt
            android-p27d6-gfxinfo.txt
            android-p27d6-thermal-before.txt
            android-p27d6-thermal-after.txt
            android-p27d6-logcat.txt
            android-p27d6-final.png
          if-no-files-found: warn
          retention-days: 90
