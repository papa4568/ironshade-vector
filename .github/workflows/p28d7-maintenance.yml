name: P28-D7 maintenance patch

on:
  push:
    branches:
      - chatgpt/p28-d7-elite-enemy-lod0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply asserted patch once
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: retry P28-D7 maintenance patch" ]; then
            echo "Skipping maintenance patch for non-trigger commit."
            exit 0
          fi
          python scripts/p28d7-maintenance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare-premium-pbr-reference.mjs src/game/graphicsAssetManifest.ts scripts/browser-runtime-smoke.mjs scripts/p28a5-image-grade-capture.mjs tests/premium-pbr-reference.mjs tests/graphics-asset-pipeline.ts
          git diff --cached --check
          git commit -m 'P28-D7 register elite LOD0 and runtime proof'
          git push origin HEAD:${GITHUB_REF_NAME}
