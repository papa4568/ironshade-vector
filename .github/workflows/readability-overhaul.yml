name: Validate UI readability overhaul

on:
  push:
    branches:
      - ui/readability-loot-discovery

permissions:
  contents: write

jobs:
  validate-publish-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load readability overhaul from validation branch
        run: |
          git fetch origin ui/readability-loot-discovery
          git show FETCH_HEAD:src/readability.css > src/readability.css
          git show FETCH_HEAD:tests/ui-readability.ts > tests/ui-readability.ts
          git show FETCH_HEAD:scripts/apply_readability_patch_v2.py > /tmp/apply_readability_patch.py
          python /tmp/apply_readability_patch.py
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full regression suite and production build
        run: npm run build
      - name: Publish validated readability overhaul to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/App.tsx src/components/Armory.tsx src/components/GameCanvas.tsx src/game/threeCombatRenderer.ts src/readability.css tests/ui-readability.ts
          git commit -m 'Improve combat and gear readability'
          git push origin HEAD:main
      - name: Load live QA
        run: |
          git fetch origin ui/readability-loot-discovery
          git show FETCH_HEAD:scripts/live_readability_qa.mjs > .live-readability-qa.mjs
      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Verify live mobile readability
        run: node .live-readability-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readability-live-qa
          path: readability-live.png
          if-no-files-found: ignore
