# AO-16 has been promoted. The one-use helper was deleted atomically on
# main; this retained, nonprivileged workflow verifies that retirement.
# The owner-comment write path is deliberately gone, not merely skipped.
name: AO-16 Retired Trusted EV-9 Observer Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ao16-trusted-observer-bootstrap.yml'
      - 'tools/ao16-trusted-observer-bootstrap.mjs'
      - 'agent/task-graph.json'

permissions:
  contents: read

jobs:
  bootstrap-retirement-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Assert one-use helper is absent and only approved observer remains
        run: |
          set -euo pipefail
          test ! -e tools/ao16-trusted-observer-bootstrap.mjs
          test "$(git rev-parse HEAD:agent/tools/ev9-trusted-pr-candidate-observer-v11.mjs)" = 'd17392878d2dd4a70122a649ba8fc10d54a0d4d6'
          node agent/tools/ev9-trusted-pr-candidate-observer-v11.mjs self-test
      - name: Replay pinned pre-retirement privileged self-test and verify atomic Git transaction
        run: |
          set -euo pipefail
          pre=2de60a408971abee458e9014b474a7bbc3af3deb
          post=2b1e24fd680887efdd0ab278d8a75826db5af27d
          helper=tools/ao16-trusted-observer-bootstrap.mjs
          observer=agent/tools/ev9-trusted-pr-candidate-observer-v11.mjs
          test "$(git rev-parse "$post^")" = "$pre"
          test "$(git rev-parse "$pre:$helper")" = a1094640496f60e1b25a63724c505243012bdbf4
          test "$(git rev-parse "$post:$observer")" = d17392878d2dd4a70122a649ba8fc10d54a0d4d6
          test "$(git rev-parse "$pre:$observer")" = 3df1250e218565a2c1b76d927810ee8a27c0a471
          if git cat-file -e "$post:$helper" 2>/dev/null; then
            echo 'retired helper is still present'; exit 1
          fi
          actual="$(git diff-tree --no-commit-id --name-only -r "$post" | sort)"
          expected="$(printf '%s\n' "$observer" "$helper" | sort)"
          test "$actual" = "$expected"
          # Only the historical unprivileged fixture self-test is run:
          # no token, no candidate-authored code, no promotion command.
          git show "$pre:$helper" > "$RUNNER_TEMP/ao16-reviewed-bootstrap.mjs"
          node "$RUNNER_TEMP/ao16-reviewed-bootstrap.mjs" self-test
          rm "$RUNNER_TEMP/ao16-reviewed-bootstrap.mjs"
          echo 'AO16_HISTORIC_BOOTSTRAP_REGRESSIONS_PASS'
      - name: Authenticate trusted Copilot approval and completed owner promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root = 'https://api.github.com/repos/papa4568/ironshade-vector';
          const read = async path => {
            const response = await fetch(root + path, {
              headers: {
                Authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            assert.equal(response.status, 200, 'read-only GitHub evidence unavailable: ' + path);
            return response.json();
          };
          const [technical, reviewer, comment, promotion, g5] = await Promise.all([
            read('/actions/runs/40408309239'),
            read('/actions/runs/40411925939'),
            read('/issues/comments/6428749889'),
            read('/actions/runs/40412218481'),
            read('/actions/runs/40418195371'),
          ]);
          assert.equal(technical.head_sha, 'e2ce61abdf9ee559146bc999b4b91c7a1077e33f');
          assert.equal(technical.path, '.github/workflows/pr-candidate.yml');
          assert.equal(technical.conclusion, 'success');
          assert.equal(reviewer.head_sha, 'c101a50fb98c0db481223c87fc82224ea938650c');
          assert.equal(reviewer.name, 'AO-6 Trusted Independent Review');
          assert.equal(reviewer.workflow_id, 380851235);
          assert.equal(reviewer.conclusion, 'success');
          assert.equal(comment.user.login, 'github-actions[bot]');
          const opened = comment.body.indexOf('{', comment.body.indexOf('json'));
          const closed = comment.body.lastIndexOf('}');
          assert(opened > 0 && closed > opened, 'trusted JSON envelope missing');
          const result = JSON.parse(comment.body.slice(opened, closed + 1));
          assert.equal(result.taskId, 'AO-16');
          assert.equal(result.candidateSha, technical.head_sha);
          assert.equal(result.sourceRunId, reviewer.id);
          assert.equal(result.reviewerKind, 'trusted-main-copilot-actions');
          assert.equal(result.verdict, 'pass');
          assert(result.acceptanceChecks.every(check => check.status === 'satisfied'));
          assert(result.proofChecks.every(check => check.status === 'credible'));
          assert.equal(promotion.head_sha, '2de60a408971abee458e9014b474a7bbc3af3deb');
          assert.equal(promotion.name, 'AO-16 One-Shot Trusted EV-9 Observer Bootstrap');
          assert.equal(promotion.workflow_id, 397083248);
          assert.equal(promotion.event, 'issue_comment');
          assert.equal(promotion.actor.login, 'papa4568');
          assert.equal(promotion.conclusion, 'success');
          // G5 is rerun on promoted main; final review is still required.
          assert.equal(g5.head_sha, 'aff8707e2e40f7a8d1f57d59d7eb7138b108ee1c');
          assert.equal(g5.path, '.github/workflows/pr-candidate.yml');
          assert(['completed', 'in_progress'].includes(g5.status));
          console.log('AO16_REAL_TRUSTED_COPILOT_AND_OWNER_PROMOTION_PROVENANCE_PASS');
          NODE
